/* Both players on screen at all times — you left, them right.
   Standard for matched play: you should never have to wonder who
   you are up against or what their streak is doing.              */
function streakPips(x, y, n, mirror, broken){
  for (let i=0;i<5;i++){
    const idx = mirror ? 4-i : i;
    const on = idx < n;
    const px = x + i*7;
    rect(px, y, 5, 8, broken && i===(mirror?4:0) ? broken : (on ? C.ORANGE : C.PANELED));
    if (on) rect(px+1, y+1, 3, 3, C.GOLD2);
  }
}

  // timer bar — freezes the instant you commit
  const frac = S.qResolved ? 0 : Math.max(0, S.qTimer/5);
  rect(24, y+22, W-48, 3, C.PANELED);
  if (!S.qResolved) rect(24, y+22, (W-48)*frac, 3, frac<0.3?C.RED:C.GOLD);

  const lines = wrapText(S.q.text, W-56);
  lines.forEach((l,i)=> txt(l, W/2, y+34+i*12, C.WHITE, 9, 'center'));

  const rt = S.qRevealT;
  const showOpp = S.qResolved && rt >= REVEAL_OPP;
  const showAns = S.qResolved && rt >= REVEAL_ANS;

  ANSWER_RECTS = [];
  const oy = y + 42 + lines.length*12;
  S.q.opts.forEach((o,i)=>{
    const rx=30, ry=oy+i*29, rw=W-60, rh=24;
    ANSWER_RECTS.push([rx,ry,rw,rh]);

    let bg = C.PANEL, fg = C.WHITE, bd = C.PANELED;
    if (S.qResolved && i===S.qPick && !showAns){ bd = C.GOLD; bg = '#26200c'; }   // committed, unjudged
    if (showAns){
      if (o.correct){ bg='#124a2c'; bd=C.GREEN; fg='#6ee08a'; }
      else if (i===S.qPick || i===S.oppAnswer){ bg='#4a1a14'; bd=C.RED; fg='#f08a7a'; }
      else { fg=C.GREYDK; }
    }
    rect(rx,ry,rw,rh, bd); rect(rx+1,ry+1,rw-2,rh-2, bg);
    txt(String(i+1), rx+6, ry+7, C.GREYDK, 9);
    txt(o.text, rx+20, ry+7, fg, 9);

    // your pointer, from the left
    if (S.qResolved && i===S.qPick){
      const k = Math.min(1, rt/0.14);
      tri(rx - 12 + k*6, ry+rh/2, 1, 5, C.GOLD);
      txt('YOU', rx-14, ry+rh/2-3, C.GOLD, 6, 'right');
    }
    // theirs, from the right — slides in a beat later
    if (showOpp && i===S.oppAnswer){
      const k = Math.min(1, (rt-REVEAL_OPP)/0.18);
      const ease = 1-Math.pow(1-k,3);
      tri(rx + rw + 12 - ease*6, ry+rh/2, -1, 5, S.opp.col);
      txt(S.opp.name.slice(0,7), rx+rw+14, ry+rh/2-3, S.opp.col, 6);
    }
  });

  // verdict line
  if (showAns){
    const msg = S.qWasRight ? 'TARGET +10%  ·  STREAK '+S.streak
              : (S.qPick < 0 ? 'TOO SLOW  ·  STREAK BROKEN' : 'STREAK BROKEN');
    txt(msg, W/2, y+188, S.qWasRight?C.GOLD:C.RED, 10, 'center');
  } else if (S.qResolved){
    txt('LOCKED', W/2, y+188, C.GREYDK, 10, 'center');
  }
  drawPlayerBar();                       // both players stay visible through the question
}

// pre-rendered once — a full-screen dither every frame would cost 40k fillRects
let backdrop = null;
function makeBackdrop(){
  backdrop = document.createElement('canvas'); backdrop.width=W; backdrop.height=H;
  const g = backdrop.getContext('2d');
  g.fillStyle = C.VOID; g.fillRect(0,0,W,H);
  for (let y=0;y<H;y++){ g.fillStyle = (Math.floor(y/6)%2===0) ? (y/H<0.5?'#080d18':'#060a12') : C.VOID; g.fillRect(0,y,W,1); }
  g.fillStyle = '#0d1626';
  for (let y=0;y<H;y++) for (let x=(y%3); x<W; x+=3) g.fillRect(x,y,1,1);
}

/* ── the create-a-player showcase animation ──────────────────── */
function drawCreatePreview(){
  const cs = S.createShow;
  const kit = playerKit();
  const { bodyW, hScale } = bodyMetrics();

  let cx = W/2, gy = 150, s = 2.0;
  gy += Math.sin(S.t*3)*0.5;

  const px = x => cx + x*s*bodyW, py = y => gy + y*s*hScale;
  function lm(x0,y0,x1,y1,w,c){ b.strokeStyle=c; b.lineWidth=Math.max(1.2,w*s*bodyW); b.lineCap='butt';
    b.beginPath(); b.moveTo(px(x0),py(y0)); b.lineTo(px(x1),py(y1)); b.stroke(); }
  function bx(x,y,w,h,c){ b.fillStyle=c;
    b.fillRect(Math.round(px(x)), Math.round(py(y)), Math.max(1,Math.round(w*s*bodyW)), Math.max(1,Math.round(h*s*hScale))); }
  function boot(x,y,flip){
    bx(x-(flip?2.6:0.6), y-1.2, 3.2, 2.4, kit.shoe);
    bx(x-(flip?2.6:0.6), y+0.6, 3.2, 0.8, '#f4f1e4');
  }

  let pK=[4.2,-10], pF=[5,0], kK=[-4.2,-10], kF=[-5,0];
  let aL=[[-9,-27],[-10,-20]], aR=[[9,-27],[10,-20]];
  let lean=0, headDip=0, armsUp=false;
  let ballLocal = [-5,-1];   // resting beside his right foot (screen-left — we're behind him)

  if (cs.phase === 'JUGGLE'){
    const t = cs.cycleT, side = cs.foot;
    const flick = Math.max(0, Math.cos(Math.min(1,t/0.35)*Math.PI*0.5));
    const active=[lerp(-5,-2,flick), lerp(0,-14,flick)], activeKnee=[lerp(-4.2,-1,flick), lerp(-10,-17,flick)];
    const rest=[5,0], restKnee=[4.2,-10];
    if (side===0){ kF=active; kK=activeKnee; pF=rest; pK=restKnee; }
    else { kF=[-rest[0],rest[1]]; kK=[-restKnee[0],restKnee[1]]; pF=[-active[0],active[1]]; pK=[-activeKnee[0],activeKnee[1]]; }
    const armSwing = Math.sin(t*Math.PI*2)*2;
    aL=[[-9-armSwing,-27],[-10-armSwing,-19]]; aR=[[9+armSwing,-27],[10+armSwing,-19]];
    gy -= Math.sin(t*Math.PI)*1.1;
    const fromX = side===0?-5:5, toX=-fromX;
    ballLocal = [ lerp(fromX,toX,t), -Math.sin(Math.PI*t)*20-2 ];

  } else if (cs.phase === 'HIGH_CATCH'){
    const T = cs.phaseT;
    if (T < CS_HC_LAUNCH){                              // a big committed flick
      const k = T/CS_HC_LAUNCH;
      kF=[lerp(-5,-2,k), lerp(0,-18,k)]; kK=[lerp(-4.2,-1,k), lerp(-10,-20,k)];
      pF=[5,0]; pK=[4.2,-10];
      aL=[[-11,-29],[-15,-24]]; aR=[[11,-29],[15,-24]];
      ballLocal = [ lerp(-5,-3,k), lerp(0,-8,k) ];
    } else if (T < CS_HC_EXIT){                          // powers up and out of frame entirely
      const k = (T-CS_HC_LAUNCH)/(CS_HC_EXIT-CS_HC_LAUNCH);
      ballLocal = [ lerp(-3,-1,k), lerp(-8,-95,k*k) ];    // accelerating rise, well past the top edge
      const lookUp = Math.min(1, k*2);
      headDip = -lookUp*3.8; lean = -lookUp*1.3;
      pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
      aL=[[-10,-28],[-13,-22]]; aR=[[10,-28],[13,-22]];
    } else if (T < CS_HC_ANTIC_END){                      // gone — tracking empty sky, crowd tightening up
      ballLocal = null;
      headDip = -3.8 + Math.sin(T*2)*0.4;
      lean = Math.sin(T*1.1)*0.9;
      pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
      aL=[[-10,-28],[-13,-22]]; aR=[[10,-28],[13,-22]];
    } else if (T < CS_HC_CATCH){                          // back into view, falling straight for him
      const k = (T-CS_HC_ANTIC_END)/(CS_HC_CATCH-CS_HC_ANTIC_END);
      ballLocal = [ lerp(-1,0,k), lerp(-95,-34, k*(2-k)) ];
      headDip = -3.8; lean = -1.3;
      pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
      aL=[[-10,-28],[-13,-22]]; aR=[[10,-28],[13,-22]];
    } else {                                              // BOOM — trapped dead, then he goes off
      const k = Math.min(1, (T-CS_HC_CATCH)/(CS_HC_TOTAL-CS_HC_CATCH));
      armsUp = k > 0.12;
      if (armsUp){
        gy -= Math.max(0, Math.sin(Math.min(1,(k-0.12)*3.2)*Math.PI)) * 2.4;
        aL=[[-10,-38],[-11.5,-45]]; aR=[[10,-38],[11.5,-45]];
        pF=[4,0]; pK=[3.5,-10]; kF=[-4,0]; kK=[-3.5,-10];
      } else {
        aL=[[-10,-28],[-13,-22]]; aR=[[10,-28],[13,-22]];
        pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
      }
      headDip = lerp(-3.8, 0, k);
      ballLocal = [ lerp(0,-5,k), lerp(-34,0,k) ];
    }

  } else if (cs.phase === 'SHOULDERS'){
    const T = cs.phaseT;
    const SL=[-6,-32], SR=[6,-32], PEAK=-58;             // arcs well above his head every bounce
    pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
    aL=[[-9,-27],[-10,-20]]; aR=[[9,-27],[10,-20]];
    if (T < CS_SH_LIFT){
      const k = T/CS_SH_LIFT;
      ballLocal = lerp2([-5,0], SL, k);
      headDip = -2.2*k;
    } else {
      const bt = T - CS_SH_LIFT, span = CS_SH_BOUNCES*CS_SH_BOUNCE_PERIOD;
      if (bt < span){
        const beatIdx = Math.floor(bt/CS_SH_BOUNCE_PERIOD);
        const beatT = (bt % CS_SH_BOUNCE_PERIOD) / CS_SH_BOUNCE_PERIOD;
        const from = beatIdx%2===0 ? SL : SR, to = beatIdx%2===0 ? SR : SL;
        ballLocal = [ lerp(from[0],to[0],beatT), (1-beatT)*(1-beatT)*from[1] + 2*(1-beatT)*beatT*PEAK + beatT*beatT*to[1] ];
        const pop = Math.max(0, Math.sin(Math.min(1,beatT/0.3)*Math.PI));
        lean = (beatIdx%2===0 ? -1 : 1) * pop * 1.2;
        headDip = -2.2 - Math.sin(beatT*Math.PI)*1.6;     // extra look-up as each bounce peaks
      } else {                                            // settles up onto the crown of his head
        const k = Math.min(1, (bt-span)/CS_SH_SETTLE);
        const last = (CS_SH_BOUNCES%2===0) ? SL : SR;
        ballLocal = lerp2(last, [0,-50], k);
        headDip = lerp(-2.2, 0, k);
      }
    }

  } else if (cs.phase === 'HEAD_BALANCE'){
    const T = cs.phaseT;
    pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
    if (T < CS_HB_HOLD){                                  // a skilful, actively-corrected balance
      const sway = Math.sin(T*1.8);
      ballLocal = [ sway*2.6, -50 + Math.abs(sway)*0.4 ];
      lean = -Math.sin(T*1.8 - 0.35) * 1.6;
      aL=[[-13,-27],[-18,-24]]; aR=[[13,-27],[18,-24]];   // arms wide, tightrope-walker balance
    } else {
      const k = Math.min(1, (T-CS_HB_HOLD)/CS_HB_DROP);
      ballLocal = [ lerp(0,-5,k), lerp(-50,0,k) ];
      aL=[[-9,-27],[-10,-20]]; aR=[[9,-27],[10,-20]];
    }
  }

  // shadow
  b.save(); b.globalAlpha=0.28; b.fillStyle='#04140b';
  b.beginPath(); b.ellipse(px(0.5), py(0.8), 12*s, 3.4*s, 0,0,6.2832); b.fill(); b.restore();

  lm(-3,-19, kK[0],kK[1], 4.8, kit.shorts);
  lm(kK[0],kK[1], kF[0],kF[1], 3.8, S.skin);
  bx(kF[0]-1.7, kF[1]-1, 3.6, 3.6, kit.socks);
  boot(kF[0], kF[1]+2.2, true);

  const tx = lean;
  bx(tx-6.8,-33.5, 13.6, 15.5, kit.shirt);
  bx(tx-6.8,-33.5, 13.6, 1.6, kit.trim);
  bx(tx-6.8,-20.5, 13.6, 2, kit.trim);
  bx(tx-7.7,-32.5, 1.2, 6, kit.trim);
  bx(tx+6.5,-32.5, 1.2, 6, kit.trim);
  b.fillStyle = kit.num;
  b.font = 'bold '+Math.max(5, Math.round(8*s))+'px ui-monospace, Menlo, monospace';
  b.textAlign='center'; b.textBaseline='middle';
  b.fillText(String(S.shirtNum), px(tx), py(-27));
  bx(tx-6.3,-21, 12.6, 8, kit.shorts);

  lm(tx+3,-19, pK[0],pK[1], 5, kit.shorts);
  lm(pK[0],pK[1], pF[0],pF[1], 4, S.skin);
  bx(pF[0]-1.7, pF[1]-4.6, 3.6, 4.4, kit.socks);
  boot(pF[0], pF[1], false);

  lm(tx-6.8,-31.5, aL[0][0],aL[0][1], 3.5, kit.shirt);
  lm(aL[0][0],aL[0][1], aL[1][0],aL[1][1], 2.9, S.skin);
  lm(tx+6.8,-31.5, aR[0][0],aR[0][1], 3.5, kit.shirt);
  lm(aR[0][0],aR[0][1], aR[1][0],aR[1][1], 2.9, S.skin);

  const hy = -39 + headDip;
  bx(tx-1.4,-35.5, 3, 2.4, S.skin);
  bx(tx-3.8, hy-3.7, 7.6, 7.6, S.skin);
  bx(tx-4.0, hy-4.3, 8.0, 3.7, S.hair);
  bx(tx-1.15, hy-4.3, 0.6, 3.3, S.skin);
  bx(tx-4.0, hy-1.2, 1.2, 2.4, S.hair);
  bx(tx+2.8, hy-1.2, 1.2, 2.4, S.hair);

  if (ballLocal){
    const wob = (cs.phase==='JUGGLE') ? Math.sin(S.t*20)*0.4 : 0;
    drawBall(px(ballLocal[0])+wob, py(ballLocal[1]), 9);
  }
}

    const col = g==='S'?C.GOLD:g==='A'?C.GREEN:g==='B'?C.BLUE:g==='C'?C.GREY:C.RED;
    rect(x,y,22,22, C.PANELED); rect(x+1,y+1,20,20, C.PANEL);
    txt(g, x+11, y+6, col, 11, 'center');
  });
  txt('Form is driven by grades, not goals —', W/2, 320, C.GREYDK, 8, 'center');
  txt('an S-average still climbs after a loss.', W/2, 331, C.GREYDK, 8, 'center');
  txt('TAP FOR A NEW SEED', W/2, 380, Math.sin(S.t*5)>0?C.WHITE:C.GREYDK, 10, 'center');
}

/* ── frame padding: extends the stadium above and below the game
   buffer so the presentation fills a tall phone screen rather than
   letterboxing. Purely decorative — the buffer itself is untouched. ── */
function drawFrameTop(){
  const g = ctx.createLinearGradient(0,0,0,PAD_TOP);
  g.addColorStop(0, '#03040a'); g.addColorStop(1, C.STAND2);
  ctx.fillStyle = g; ctx.fillRect(0,0,FRAME_W,PAD_TOP);
  const hype = S.crowdHype;
  for (let i=0;i<FRAME_W;i+=3){
    const hh = 6 + ((i*7919)%9);
    const hash = ((i*2654435761)>>>0);
    const ph = (hash%628)/100;
    const bob = Math.sin(S.t*(1.0+(hash%5)*0.14) + ph) * 0.7 + (waveBoost(i, S.t)+burstWaveBoost(i,S.t))*6
              + (hype > 0 ? Math.max(0, Math.sin(S.t*17 + i*0.4)) * hype * 5 : 0);
    ctx.fillStyle = hash%3===0 ? C.CROWD2 : C.CROWD1;
    ctx.fillRect(i, PAD_TOP-hh-bob, 3, hh+bob);
  }
  [26, FRAME_W-26].forEach(px=>{
    ctx.fillStyle = '#1b2438'; ctx.fillRect(px-1, 4, 2, PAD_TOP-6);
    ctx.fillStyle = '#e8e0c8';
    for (let k=0;k<3;k++) ctx.fillRect(px-4+k*4, 2, 2, 2);
    ctx.save(); ctx.globalAlpha=0.10; ctx.fillStyle='#9fd0ff';
    ctx.beginPath(); ctx.moveTo(px,6); ctx.lineTo(px+60,PAD_TOP); ctx.lineTo(px-60,PAD_TOP); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}
function drawFrameBottom(){
  const y0 = FRAME_H-PAD_BOTTOM;
  const g = ctx.createLinearGradient(0,y0,0,FRAME_H);
  g.addColorStop(0, C.TURFLO); g.addColorStop(1, '#03040a');
  ctx.fillStyle = g; ctx.fillRect(0,y0,FRAME_W,PAD_BOTTOM);
  ctx.fillStyle = '#0f4028';
  for (let y=y0; y<FRAME_H; y++){ if (Math.floor((y-y0)/7)%2===0) ctx.fillRect(0,y,FRAME_W,1); }
}

/* ── settings / pause menu — top-left MENU button, always available.
   Freezes the sim (see update()) and draws on top of whatever scene
   is behind it. Same panel/row language as everything else.       ── */
let SETTINGS_RECTS = [], SETTINGS_PANEL = [0,0,0,0];
function settingsHit(px,py){ for (const r of SETTINGS_RECTS){ if (px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]) return r; } return null; }
function handleSettingsTap(px,py){
  const hit = settingsHit(px,py);
  if (!hit){
    const p = SETTINGS_PANEL;
    const inPanel = px>=p[0]&&px<=p[0]+p[2]&&py>=p[1]&&py<=p[1]+p[3];
    if (!inPanel){ S.settingsOpen = false; S.settingsConfirmQuit = false; }
    return;
  }
  const key = hit[4];
  if (key !== 'quit') S.settingsConfirmQuit = false;
  if (key === 'sound'){ S.audioMuted = !S.audioMuted; applyVolume(); SFX.tick(!S.audioMuted); }
  else if (key === 'vol'){ S.audioVolume = Math.max(0, Math.min(1, S.audioVolume + hit[5]*0.1)); applyVolume(); SFX.tick(true); }
  else if (key === 'motion'){ S.reduceMotion = !S.reduceMotion; }
  else if (key === 'ladder'){ S.ladderStyle = S.ladderStyle==='football' ? 'money' : 'football'; }
  else if (key === 'save'){ const ok = saveGame(); S.saveFlashT = ok ? 1.4 : 0; SFX.correct(); }
  else if (key === 'quit'){
    if (S.settingsConfirmQuit){
      S.settingsOpen = false; S.settingsConfirmQuit = false;
      S.ku = null; S.mode = 'SHOOTOUT';
      gotoScene('TITLE');
    } else { S.settingsConfirmQuit = true; SFX.wrong(); }
  }
  else if (key === 'close'){ S.settingsOpen = false; S.settingsConfirmQuit = false; }
}
function drawSettings(){
  b.save(); b.globalAlpha = 0.72; rect(0,0,W,H,C.INK); b.restore();

  const px0=24, py0=88, pw=240, ph=236;
  SETTINGS_PANEL = [px0,py0,pw,ph];
  panel(px0,py0,pw,ph);
  txt('PAUSED', W/2, py0+10, C.GOLD, 15, 'center');

  SETTINGS_RECTS = [];
  const rx = px0+12, rw = pw-24, rh = 26;
  let ry = py0+36;

  rect(rx,ry,rw,rh-4, C.PANEL);
  txt('SOUND', rx+8, ry+7, C.GREYDK, 8);
  txt(S.audioMuted?'OFF':'ON', rx+rw-30, ry+7, S.audioMuted?C.RED:C.GREEN, 9, 'center');
  SETTINGS_RECTS.push([rx, ry, rw, rh-4, 'sound']);
  ry += rh;

  rect(rx,ry,rw,rh-4, C.PANEL);
  txt('VOLUME', rx+8, ry+7, C.GREYDK, 8);
  SETTINGS_RECTS.push([rx+rw-70, ry, 20, rh-4, 'vol', -1]);
  SETTINGS_RECTS.push([rx+rw-22, ry, 20, rh-4, 'vol', 1]);
  txt('<', rx+rw-60, ry+6, C.GREY, 10, 'center');
  txt('>', rx+rw-12, ry+6, C.GREY, 10, 'center');
  txt(Math.round(S.audioVolume*100)+'%', rx+rw-36, ry+7, C.WHITE, 9, 'center');
  ry += rh;

  rect(rx,ry,rw,rh-4, C.PANEL);
  txt('REDUCE MOTION', rx+8, ry+7, C.GREYDK, 8);
  txt(S.reduceMotion?'ON':'OFF', rx+rw-30, ry+7, S.reduceMotion?C.GREEN:C.GREYDK, 9, 'center');
  SETTINGS_RECTS.push([rx, ry, rw, rh-4, 'motion']);
  ry += rh;

  rect(rx,ry,rw,rh-4, C.PANEL);
  txt('LADDER', rx+8, ry+7, C.GREYDK, 8);
  txt(S.ladderStyle==='football'?'BALLS':'MONEY', rx+rw-38, ry+7, C.GOLD2, 9, 'center');
  SETTINGS_RECTS.push([rx, ry, rw, rh-4, 'ladder']);
  ry += rh + 6;

  SETTINGS_RECTS.push([rx, ry, rw, 22, 'save']);
  rect(rx,ry,rw,22, C.PANELED); rect(rx+1,ry+1,rw-2,20, C.PANEL);
  txt(S.saveFlashT>0 ? 'SAVED ✓' : 'SAVE PLAYER', W/2, ry+6, S.saveFlashT>0?C.GOLD2:C.WHITE, 9, 'center');
  ry += 28;

  SETTINGS_RECTS.push([rx, ry, rw, 22, 'quit']);
  rect(rx,ry,rw,22, S.settingsConfirmQuit?C.RED:C.PANELED);
  rect(rx+1,ry+1,rw-2,20, S.settingsConfirmQuit?'#3a1410':C.PANEL);
  txt(S.settingsConfirmQuit ? 'TAP AGAIN TO CONFIRM' : 'QUIT TO MENU', W/2, ry+6, S.settingsConfirmQuit?'#ff8a7a':C.WHITE, 9, 'center');
  ry += 28;

  SETTINGS_RECTS.push([rx, ry, rw, 22, 'close']);
  rect(rx,ry,rw,22, C.GOLDDK); rect(rx+1,ry+1,rw-2,20, '#241a06');
  txt('RESUME', W/2, ry+6, C.GOLD2, 9, 'center');
}
function finishDraw(){
  if (S.settingsOpen) drawSettings();
  post();
}

/* ── post-processing: shake, flash, RGB split, scanlines, vignette ── */
function post(){
  const sh = S.reduceMotion ? 0 : S.shake;
  const ox = sh ? (rnd()-0.5)*sh*2 : 0, oy = sh ? (rnd()-0.5)*sh*2 : 0;

  ctx.fillStyle = C.VOID; ctx.fillRect(0,0,cv.width,cv.height);
  const sc = cv.width / FRAME_W;
  ctx.save(); ctx.scale(sc, sc); ctx.imageSmoothingEnabled = false;

  drawFrameTop();
  drawFrameBottom();
  ctx.save();
  ctx.translate(0, PAD_TOP);

  if (S.aberr > 0.01 && !S.reduceMotion){
    const d = S.aberr * 3;
    ta.clearRect(0,0,W,H); ta.drawImage(buf,0,0);
    ta.globalCompositeOperation='multiply'; ta.fillStyle='#ff2020'; ta.fillRect(0,0,W,H);
    ta.globalCompositeOperation='source-over';
    tb.clearRect(0,0,W,H); tb.drawImage(buf,0,0);
    tb.globalCompositeOperation='multiply'; tb.fillStyle='#20ffff'; tb.fillRect(0,0,W,H);
    tb.globalCompositeOperation='source-over';
    ctx.drawImage(buf, ox, oy);
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha = 0.55; ctx.drawImage(tA, ox-d, oy); ctx.drawImage(tB, ox+d, oy);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation='source-over';
  } else {
    ctx.drawImage(buf, ox, oy);
  }

  if (S.flash > 0.01){ ctx.globalAlpha = Math.min(0.7, S.flash); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }

  // the roar warms the whole picture
  if (S.crowdHype > 0.3){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (S.crowdHype-0.3)*0.16;
    ctx.fillStyle = '#ffb84a'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  // the boo drains it — colour first, then a cold cast
  if (S.gloom > 0.01){
    ctx.globalCompositeOperation = 'saturation';
    ctx.globalAlpha = Math.min(0.9, S.gloom);
    ctx.fillStyle = '#808080'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = Math.min(0.30, S.gloom*0.30);
    ctx.fillStyle = '#0d1a33'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();   // undo the PAD_TOP translate — back to frame space

  // scanlines, over the whole frame
  ctx.globalAlpha = 0.13; ctx.fillStyle = '#000';
  for (let y=0;y<FRAME_H;y+=2) ctx.fillRect(0,y,FRAME_W,1);
  ctx.globalAlpha = 1;

  // vignette, over the whole frame
  const g = ctx.createRadialGradient(FRAME_W/2,FRAME_H/2,FRAME_H*0.30, FRAME_W/2,FRAME_H/2,FRAME_H*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0,0,FRAME_W,FRAME_H);
  ctx.restore();
}

loadGame();

/* ═══════════════════════════════════════════════════════════
   RESIZE + LOOP
   ═══════════════════════════════════════════════════════════ */
function resize(){
  const availH = window.innerHeight - 20, availW = window.innerWidth - 8;
  const s = Math.min(availW / FRAME_W, availH / FRAME_H);
  cv.width = Math.round(FRAME_W*s); cv.height = Math.round(FRAME_H*s);
  cv.style.width = cv.width+'px'; cv.style.height = cv.height+'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now){
  let dt = (now - last)/1000; last = now;
  if (dt > 0.25) dt = 0.25;
  if (S.hitstop > 0){ S.hitstop -= dt; dt = 0; }
  tickAcc += dt;
  let guard = 0;
  while (tickAcc >= DT && guard++ < 8){ update(DT); tickAcc -= DT; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
