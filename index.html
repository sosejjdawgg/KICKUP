function drawGauges(){
  const active = S.scene;
  const dimPower = active==='P_POWER'    ? 1 : 0.28;
  const dimAcc   = active==='P_ACCURACY' ? 1 : 0.28;
  const card = CARDS[S.round];
  const hideBands = !!S.cond.dark;

  // ── POWER (bottom)
  b.save(); b.globalAlpha = dimPower;
  rect(PB.x0-2, PB.y-2, PB.x1-PB.x0+4, PB.h+4, C.INK);
  rect(PB.x0, PB.y, PB.x1-PB.x0, PB.h, C.PANEL);
  const bw = PB.x1-PB.x0;
  if (!hideBands){
    const lo = (0.70-card.band/2), hi = (0.70+card.band/2);
    rect(PB.x0+lo*bw, PB.y, (hi-lo)*bw, PB.h, C.GREENDK);
    const clo=(0.70-card.core/2), chi=(0.70+card.core/2);
    rect(PB.x0+clo*bw, PB.y, (chi-clo)*bw, PB.h, C.GOLDDK);
  }
  const fill = (active==='P_POWER' ? S.gauge : S.lockP) * bw;
  for (let i=0;i<fill;i+=3) rect(PB.x0+i, PB.y+2, 2, PB.h-4, i/bw>0.78 ? C.RED : i/bw>0.62 ? C.GOLD : C.BLUE);
  if (S.lockP && active!=='P_POWER') rect(PB.x0+S.lockP*bw-1, PB.y-3, 3, PB.h+6, C.WHITE);
  if (active==='P_POWER') rect(PB.x0+S.gauge*bw-1, PB.y-3, 3, PB.h+6, C.WHITE);
  txt('POWER', PB.x0, PB.y-11, active==='P_POWER'?C.WHITE:C.GREYDK, 8);
  b.restore();

  // ── ACCURACY (under the goal, horizontal) — how tightly you land the
  // spot you aimed at; sweep direction at the tap still sets curl
  b.save(); b.globalAlpha = dimAcc;
  rect(PT.x0-2, PT.y-2, PT.x1-PT.x0+4, PT.h+4, C.INK);
  rect(PT.x0, PT.y, PT.x1-PT.x0, PT.h, C.PANEL);
  const pw = PT.x1-PT.x0;
  if (!hideBands){
    const lo = (0.5-card.band/2), hi = (0.5+card.band/2);
    rect(PT.x0+lo*pw, PT.y, (hi-lo)*pw, PT.h, C.GREENDK);
    const clo=(0.5-card.core/2), chi=(0.5+card.core/2);
    rect(PT.x0+clo*pw, PT.y, (chi-clo)*pw, PT.h, C.GOLDDK);
  }
  const uv = (active==='P_ACCURACY' ? S.gauge : S.lockA);
  const mx = PT.x0 + Math.max(0,Math.min(1,uv))*pw;
  rect(mx-1, PT.y-2, 3, PT.h+4, C.WHITE);
  if (active==='P_ACCURACY'){
    // curl arrow follows sweep direction
    const d = S.gaugeDir;
    for (let i=1;i<=3;i++) rect(mx + d*(3+i*3), PT.y+2, 2, 2, C.GOLD2);
    txt(d>0 ? 'SLICE >' : '< HOOK', d>0 ? PT.x1-40 : PT.x0+2, PT.y-11, C.GOLD2, 8);
  } else {
    txt('ACCURACY', PT.x0, PT.y-11, C.GREYDK, 8);
  }
  b.restore();
}

/* Both players on screen at all times — you left, them right.
   Standard for matched play: you should never have to wonder who
   you are up against or what their streak is doing.              */
function streakPips(x, y, n, mirror, broken){
  for (let i=0;i<5;i++){
    const idx = mirror ? 4-i : i;
    const on = idx < n;
    const px = x + i*7;
    rect(px, y, 5, 8, broken && i===(mirror?4:0) ? broken : (on ? C.ORANGE : C.PANELED));
    if (on) rect(px+1, y+1, 3, 3, C.GOLD2);
  }
}

function tri(x, y, dir, size, c){          // pointer: dir +1 points right
  b.fillStyle = c; b.beginPath();
  b.moveTo(x + dir*size, y); b.lineTo(x, y - size*0.8); b.lineTo(x, y + size*0.8);
  b.closePath(); b.fill();
}
function drawQuestion(){
  b.save(); b.globalAlpha = 0.90; rect(0,0,W,H,C.INK); b.restore();
  const y = 100;
  panel(14, y, W-28, 206);
  txt(S.cat, 24, y+8, C.GOLD2, 8);
  txt('+10% TARGET', W-24, y+8, C.GREYDK, 8, 'right');

  // timer bar — freezes the instant you commit
  const frac = S.qResolved ? 0 : Math.max(0, S.qTimer/5);
  rect(24, y+22, W-48, 3, C.PANELED);
  if (!S.qResolved) rect(24, y+22, (W-48)*frac, 3, frac<0.3?C.RED:C.GOLD);

  const lines = wrapText(S.q.text, W-56);
  lines.forEach((l,i)=> txt(l, W/2, y+34+i*12, C.WHITE, 9, 'center'));

  const rt = S.qRevealT;
  const showOpp = S.qResolved && rt >= REVEAL_OPP;
  const showAns = S.qResolved && rt >= REVEAL_ANS;

  ANSWER_RECTS = [];
  const oy = y + 42 + lines.length*12;
  S.q.opts.forEach((o,i)=>{
    const rx=30, ry=oy+i*29, rw=W-60, rh=24;
    ANSWER_RECTS.push([rx,ry,rw,rh]);

    let bg = C.PANEL, fg = C.WHITE, bd = C.PANELED;
    if (S.qResolved && i===S.qPick && !showAns){ bd = C.GOLD; bg = '#26200c'; }   // committed, unjudged
    if (showAns){
      if (o.correct){ bg='#124a2c'; bd=C.GREEN; fg='#6ee08a'; }
      else if (i===S.qPick || i===S.oppAnswer){ bg='#4a1a14'; bd=C.RED; fg='#f08a7a'; }
      else { fg=C.GREYDK; }
    }
    rect(rx,ry,rw,rh, bd); rect(rx+1,ry+1,rw-2,rh-2, bg);
    txt(String(i+1), rx+6, ry+7, C.GREYDK, 9);
    txt(o.text, rx+20, ry+7, fg, 9);

    // your pointer, from the left
    if (S.qResolved && i===S.qPick){
      const k = Math.min(1, rt/0.14);
      tri(rx - 12 + k*6, ry+rh/2, 1, 5, C.GOLD);
      txt('YOU', rx-14, ry+rh/2-3, C.GOLD, 6, 'right');
    }
    // theirs, from the right — slides in a beat later
    if (showOpp && i===S.oppAnswer){
      const k = Math.min(1, (rt-REVEAL_OPP)/0.18);
      const ease = 1-Math.pow(1-k,3);
      tri(rx + rw + 12 - ease*6, ry+rh/2, -1, 5, S.opp.col);
      txt(S.opp.name.slice(0,7), rx+rw+14, ry+rh/2-3, S.opp.col, 6);
    }
  });

  // verdict line
  if (showAns){
    const msg = S.qWasRight ? 'TARGET +10%  ·  STREAK '+S.streak
              : (S.qPick < 0 ? 'TOO SLOW  ·  STREAK BROKEN' : 'STREAK BROKEN');
    txt(msg, W/2, y+188, S.qWasRight?C.GOLD:C.RED, 10, 'center');
  } else if (S.qResolved){
    txt('LOCKED', W/2, y+188, C.GREYDK, 10, 'center');
  }
  drawPlayerBar();                       // both players stay visible through the question
}

/* ── the create-a-player showcase animation ──────────────────── */
function drawCreatePreview(){
  const cs = S.createShow;
  const kit = playerKit();
  const { bodyW, hScale } = bodyMetrics();

  let cx = W/2, gy = 150, s = 2.0;
  gy += Math.sin(S.t*3)*0.5;

  const px = x => cx + x*s*bodyW, py = y => gy + y*s*hScale;
  function lm(x0,y0,x1,y1,w,c){ b.strokeStyle=c; b.lineWidth=Math.max(1.2,w*s*bodyW); b.lineCap='butt';
    b.beginPath(); b.moveTo(px(x0),py(y0)); b.lineTo(px(x1),py(y1)); b.stroke(); }
  function bx(x,y,w,h,c){ b.fillStyle=c;
    b.fillRect(Math.round(px(x)), Math.round(py(y)), Math.max(1,Math.round(w*s*bodyW)), Math.max(1,Math.round(h*s*hScale))); }
  function boot(x,y,flip){
    bx(x-(flip?2.6:0.6), y-1.2, 3.2, 2.4, kit.shoe);
    bx(x-(flip?2.6:0.6), y+0.6, 3.2, 0.8, '#f4f1e4');
  }

  let pK=[4.2,-10], pF=[5,0], kK=[-4.2,-10], kF=[-5,0];
  let aL=[[-9,-27],[-10,-20]], aR=[[9,-27],[10,-20]];
  let lean=0, headDip=0, armsUp=false;
  let ballLocal = [-5,-1];   // resting beside his right foot (screen-left — we're behind him)

  if (cs.phase === 'JUGGLE'){
    const t = cs.cycleT, side = cs.foot;
    const flick = Math.max(0, Math.cos(Math.min(1,t/0.35)*Math.PI*0.5));
    const active=[lerp(-5,-2,flick), lerp(0,-14,flick)], activeKnee=[lerp(-4.2,-1,flick), lerp(-10,-17,flick)];
    const rest=[5,0], restKnee=[4.2,-10];
    if (side===0){ kF=active; kK=activeKnee; pF=rest; pK=restKnee; }
    else { kF=[-rest[0],rest[1]]; kK=[-restKnee[0],restKnee[1]]; pF=[-active[0],active[1]]; pK=[-activeKnee[0],activeKnee[1]]; }
    const armSwing = Math.sin(t*Math.PI*2)*2;
    aL=[[-9-armSwing,-27],[-10-armSwing,-19]]; aR=[[9+armSwing,-27],[10+armSwing,-19]];
    gy -= Math.sin(t*Math.PI)*1.1;
    const fromX = side===0?-5:5, toX=-fromX;
    ballLocal = [ lerp(fromX,toX,t), -Math.sin(Math.PI*t)*20-2 ];

  } else if (cs.phase === 'HIGH_CATCH'){
    const T = cs.phaseT;
    if (T < CS_HC_LAUNCH){                              // a big committed flick
      const k = T/CS_HC_LAUNCH;
      kF=[lerp(-5,-2,k), lerp(0,-18,k)]; kK=[lerp(-4.2,-1,k), lerp(-10,-20,k)];
      pF=[5,0]; pK=[4.2,-10];
      aL=[[-11,-29],[-15,-24]]; aR=[[11,-29],[15,-24]];
      ballLocal = [ lerp(-5,-3,k), lerp(0,-8,k) ];
    } else if (T < CS_HC_EXIT){                          // powers up and out of frame entirely
      const k = (T-CS_HC_LAUNCH)/(CS_HC_EXIT-CS_HC_LAUNCH);
      ballLocal = [ lerp(-3,-1,k), lerp(-8,-95,k*k) ];    // accelerating rise, well past the top edge
      const lookUp = Math.min(1, k*2);
      headDip = -lookUp*3.8; lean = -lookUp*1.3;
      pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
      aL=[[-10,-28],[-13,-22]]; aR=[[10,-28],[13,-22]];
    } else if (T < CS_HC_ANTIC_END){                      // gone — tracking empty sky, crowd tightening up
      ballLocal = null;
      headDip = -3.8 + Math.sin(T*2)*0.4;
      lean = Math.sin(T*1.1)*0.9;
      pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
      aL=[[-10,-28],[-13,-22]]; aR=[[10,-28],[13,-22]];
    } else if (T < CS_HC_CATCH){                          // back into view, falling straight for him
      const k = (T-CS_HC_ANTIC_END)/(CS_HC_CATCH-CS_HC_ANTIC_END);
      ballLocal = [ lerp(-1,0,k), lerp(-95,-34, k*(2-k)) ];
      headDip = -3.8; lean = -1.3;
      pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
      aL=[[-10,-28],[-13,-22]]; aR=[[10,-28],[13,-22]];
    } else {                                              // BOOM — trapped dead, then he goes off
      const k = Math.min(1, (T-CS_HC_CATCH)/(CS_HC_TOTAL-CS_HC_CATCH));
      armsUp = k > 0.12;
      if (armsUp){
        gy -= Math.max(0, Math.sin(Math.min(1,(k-0.12)*3.2)*Math.PI)) * 2.4;
        aL=[[-10,-38],[-11.5,-45]]; aR=[[10,-38],[11.5,-45]];
        pF=[4,0]; pK=[3.5,-10]; kF=[-4,0]; kK=[-3.5,-10];
      } else {
        aL=[[-10,-28],[-13,-22]]; aR=[[10,-28],[13,-22]];
        pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
      }
      headDip = lerp(-3.8, 0, k);
      ballLocal = [ lerp(0,-5,k), lerp(-34,0,k) ];
    }

  } else if (cs.phase === 'SHOULDERS'){
    const T = cs.phaseT;
    const SL=[-6,-32], SR=[6,-32], PEAK=-58;             // arcs well above his head every bounce
    pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
    aL=[[-9,-27],[-10,-20]]; aR=[[9,-27],[10,-20]];
    if (T < CS_SH_LIFT){
      const k = T/CS_SH_LIFT;
      ballLocal = lerp2([-5,0], SL, k);
      headDip = -2.2*k;
    } else {
      const bt = T - CS_SH_LIFT, span = CS_SH_BOUNCES*CS_SH_BOUNCE_PERIOD;
      if (bt < span){
        const beatIdx = Math.floor(bt/CS_SH_BOUNCE_PERIOD);
        const beatT = (bt % CS_SH_BOUNCE_PERIOD) / CS_SH_BOUNCE_PERIOD;
        const from = beatIdx%2===0 ? SL : SR, to = beatIdx%2===0 ? SR : SL;
        ballLocal = [ lerp(from[0],to[0],beatT), (1-beatT)*(1-beatT)*from[1] + 2*(1-beatT)*beatT*PEAK + beatT*beatT*to[1] ];
        const pop = Math.max(0, Math.sin(Math.min(1,beatT/0.3)*Math.PI));
        lean = (beatIdx%2===0 ? -1 : 1) * pop * 1.2;
        headDip = -2.2 - Math.sin(beatT*Math.PI)*1.6;     // extra look-up as each bounce peaks
      } else {                                            // settles up onto the crown of his head
        const k = Math.min(1, (bt-span)/CS_SH_SETTLE);
        const last = (CS_SH_BOUNCES%2===0) ? SL : SR;
        ballLocal = lerp2(last, [0,-50], k);
        headDip = lerp(-2.2, 0, k);
      }
    }

  } else if (cs.phase === 'HEAD_BALANCE'){
    const T = cs.phaseT;
    pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];
    if (T < CS_HB_HOLD){                                  // a skilful, actively-corrected balance
      const sway = Math.sin(T*1.8);
      ballLocal = [ sway*2.6, -50 + Math.abs(sway)*0.4 ];
      lean = -Math.sin(T*1.8 - 0.35) * 1.6;
      aL=[[-13,-27],[-18,-24]]; aR=[[13,-27],[18,-24]];   // arms wide, tightrope-walker balance
    } else {
      const k = Math.min(1, (T-CS_HB_HOLD)/CS_HB_DROP);
      ballLocal = [ lerp(0,-5,k), lerp(-50,0,k) ];
      aL=[[-9,-27],[-10,-20]]; aR=[[9,-27],[10,-20]];
    }
  }

  // shadow
  b.save(); b.globalAlpha=0.28; b.fillStyle='#04140b';
  b.beginPath(); b.ellipse(px(0.5), py(0.8), 12*s, 3.4*s, 0,0,6.2832); b.fill(); b.restore();

  lm(-3,-19, kK[0],kK[1], 4.8, kit.shorts);
  lm(kK[0],kK[1], kF[0],kF[1], 3.8, S.skin);
  bx(kF[0]-1.7, kF[1]-1, 3.6, 3.6, kit.socks);
  boot(kF[0], kF[1]+2.2, true);

  const tx = lean;
  bx(tx-6.8,-33.5, 13.6, 15.5, kit.shirt);
  bx(tx-6.8,-33.5, 13.6, 1.6, kit.trim);
  bx(tx-6.8,-20.5, 13.6, 2, kit.trim);
  bx(tx-7.7,-32.5, 1.2, 6, kit.trim);
  bx(tx+6.5,-32.5, 1.2, 6, kit.trim);
  b.fillStyle = kit.num;
  b.font = 'bold '+Math.max(5, Math.round(8*s))+'px ui-monospace, Menlo, monospace';
  b.textAlign='center'; b.textBaseline='middle';
  b.fillText(String(S.shirtNum), px(tx), py(-27));
  bx(tx-6.3,-21, 12.6, 8, kit.shorts);

  lm(tx+3,-19, pK[0],pK[1], 5, kit.shorts);
  lm(pK[0],pK[1], pF[0],pF[1], 4, S.skin);
  bx(pF[0]-1.7, pF[1]-4.6, 3.6, 4.4, kit.socks);
  boot(pF[0], pF[1], false);

  lm(tx-6.8,-31.5, aL[0][0],aL[0][1], 3.5, kit.shirt);
  lm(aL[0][0],aL[0][1], aL[1][0],aL[1][1], 2.9, S.skin);
  lm(tx+6.8,-31.5, aR[0][0],aR[0][1], 3.5, kit.shirt);
  lm(aR[0][0],aR[0][1], aR[1][0],aR[1][1], 2.9, S.skin);

  const hy = -39 + headDip;
  bx(tx-1.4,-35.5, 3, 2.4, S.skin);
  bx(tx-3.8, hy-3.7, 7.6, 7.6, S.skin);
  bx(tx-4.0, hy-4.3, 8.0, 3.7, S.hair);
  bx(tx-1.15, hy-4.3, 0.6, 3.3, S.skin);
  bx(tx-4.0, hy-1.2, 1.2, 2.4, S.hair);
  bx(tx+2.8, hy-1.2, 1.2, 2.4, S.hair);

  if (ballLocal){
    const wob = (cs.phase==='JUGGLE') ? Math.sin(S.t*20)*0.4 : 0;
    drawBall(px(ballLocal[0])+wob, py(ballLocal[1]), 9);
  }
}

/* ── language select — the very first thing a player sees ──────
   Flat flags are drawn onto a small scratch canvas, then re-drawn
   into the main buffer one column at a time with a per-column sine
   offset, so each one flutters independently like real cloth.     ── */
function drawFlagFlat(lang){
  const c = flagCtx, w = FLAG_W, h = FLAG_H, [c1,c2,c3] = lang.colors;
  c.clearRect(0,0,w,h);
  if (lang.pattern === 'v3'){
    c.fillStyle = c1; c.fillRect(0,0,w/3,h);
    c.fillStyle = c2; c.fillRect(w/3,0,w/3,h);
    c.fillStyle = c3; c.fillRect(w*2/3,0,w/3,h);
  } else if (lang.pattern === 'h3'){
    c.fillStyle = c1; c.fillRect(0,0,w,h/3);
    c.fillStyle = c2; c.fillRect(0,h/3,w,h/3);
    c.fillStyle = c3; c.fillRect(0,h*2/3,w,h/3);
  } else if (lang.pattern === 'h3w'){                 // red-yellow(wide)-red
    c.fillStyle = c1; c.fillRect(0,0,w,h);
    c.fillStyle = c2; c.fillRect(0,h*0.25,w,h*0.5);
  } else if (lang.pattern === 'cross'){                // St George's Cross
    c.fillStyle = c1; c.fillRect(0,0,w,h);
    c.fillStyle = c2; c.fillRect(0,h*0.38,w,h*0.24); c.fillRect(w*0.4,0,w*0.2,h);
  }
}
function drawWavyFlag(cx, cy, w, h, lang, phase, amp){
  drawFlagFlat(lang);
  for (let i=0;i<w;i++){
    const k = i/w;
    const wave = Math.sin(phase*2.4 + i*0.42) * (amp*0.3 + amp*k);
    b.drawImage(flagBuf, i*FLAG_W/w, 0, FLAG_W/w, FLAG_H, Math.round(cx - w/2 + i), Math.round(cy - h/2 + wave), 1, h);
  }
}

let LANG_RECTS = [];
function drawLanguage(){
  // a quiet drifting starfield — no pitch, no crest, this is before any of that
  const g = b.createRadialGradient(W/2,H*0.35,20, W/2,H*0.35,H*0.9);
  g.addColorStop(0,'#111b34'); g.addColorStop(1,'#05070d');
  b.fillStyle = g; b.fillRect(0,0,W,H);
  for (let i=0;i<46;i++){
    const hash = (i*2654435761)>>>0;
    const sx = (hash%W), sy = ((hash>>>8)%H);
    const tw = 0.4 + 0.6*Math.max(0, Math.sin(S.t*1.4 + (hash%100)*0.1));
    b.save(); b.globalAlpha = tw*0.8; rect(sx, sy, 1, 1, '#cfe0ff'); b.restore();
  }

  const glow = 0.5 + 0.5*Math.sin(S.t*1.2);
  b.save(); b.globalAlpha = 0.5 + glow*0.5;
  txt('KICK-OFF', W/2, 34, C.GOLD, 20, 'center');

  LANG_RECTS = [];

      b.save(); b.globalAlpha = 0.5 + 0.5*Math.sin(S.t*4);
      rect(19, y-1, W-38, rh-8, C.GOLD2);
      b.restore();
    }
    rect(20, y, W-40, rh-10, picked ? C.GOLD : C.PANELED);
    rect(21, y+1, W-42, rh-12, C.PANEL);

    const fcx = 62, fcy = y + (rh-10)/2;
    b.save();
    if (picked){ b.globalAlpha = 0.35 + 0.25*Math.sin(S.t*5); circ(fcx, fcy, 24, C.GOLD2); b.globalAlpha=1; }
    b.restore();
    drawWavyFlag(fcx, fcy, FLAG_W, FLAG_H, lang, S.t + i*1.7, picked ? 3.2 : 1.8);
    ring(fcx, fcy, FLAG_H*0.62, 'rgba(0,0,0,0.4)', 1);

    txt(lang.name, 100, y+14, picked?C.GOLD2:C.WHITE, 12);
    if (picked){ txt(t('lang_subtitle'), 100, y+30, C.GOLD2, 7); }
  });
}
function langHit(px,py){
  for (const r of LANG_RECTS) if (px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]) return r[4];
  return null;
}

/* ── name & number — inspired by Tony Hawk's Pro Skater's name-entry
   screen: the shirt spins slowly on the spot, the number on its back
   updates live as you dial it.                                     ── */
function drawNameEntry(){
  const g = b.createRadialGradient(W/2,H*0.4,20, W/2,H*0.4,H*0.9);
  g.addColorStop(0,'#111b34'); g.addColorStop(1,'#05070d');
  b.fillStyle = g; b.fillRect(0,0,W,H);

  txt(t('name_header'), W/2, 34, C.GOLD, 16, 'center');

  // the shirt — a flattened, symmetric torso silhouette that spins on a
  // vertical axis by squashing its width with a cosine and swapping
  // which face (front/back) is drawn past the 90° turn
  const cx = W/2, cy = 170, spin = S.t*0.9;
  const facingBack = Math.cos(spin) < 0;
  const squash = Math.max(0.1, Math.abs(Math.cos(spin)));
  const kit = playerKit();
  const bw = 50*squash, bh = 60;
  b.save();
  b.globalAlpha = 0.25 + squash*0.75;                 // thin edge-on sliver fades a touch
  b.translate(cx, cy);
  rect(-bw*0.36, -bh/2, bw*0.72, bh*0.24, kit.trim);   // shoulders/collar trim peeking above the body
  rect(-bw/2, -bh*0.38, bw, bh*0.82, kit.shirt);       // body
  rect(-bw*0.72, -bh*0.32, bw*0.22, bh*0.34, kit.shirt);  // sleeve L
  rect(bw*0.5,  -bh*0.32, bw*0.22, bh*0.34, kit.shirt);   // sleeve R
  rect(-bw*0.14, -bh*0.42, bw*0.28, bh*0.1, kit.trim);    // collar notch
  if (squash > 0.35 && facingBack){
    b.fillStyle = '#0d1424';
    b.font = 'bold 22px ui-monospace, Menlo, Consolas, monospace';
    b.textAlign = 'center'; b.textBaseline = 'middle';
    b.save(); b.scale(squash, 1); b.fillText(String(S.playerNumber), 0, 4); b.restore();
  }
  b.restore();

  // name field
  const ny = 250;
  rect(30, ny, W-60, 26, C.PANELED); rect(31, ny+1, W-62, 24, C.PANEL);
  txt(t('name_label'), 38, ny-11, C.GREYDK, 8);
  const showCursor = Math.sin(S.t*4) > 0;
  txt((S.playerName || '') + (showCursor?'_':''), W/2, ny+9, C.WHITE, 11, 'center');

  // number stepper
  const numY = 296;
  txt(t('name_number_label'), 38, numY-11, C.GREYDK, 8);
  NAME_RECTS = [];
  NAME_RECTS.push(['num', -1, 30, numY, 30, 24]);
  NAME_RECTS.push(['num', 1, W-60, numY, 30, 24]);
  rect(30, numY, 30, 24, C.PANELED); rect(31,numY+1,28,22,C.PANEL);
  rect(W-60, numY, 30, 24, C.PANELED); rect(W-59,numY+1,28,22,C.PANEL);
  txt('<', 45, numY+7, C.GREY, 12, 'center');
  txt('>', W-45, numY+7, C.GREY, 12, 'center');
  rect(70, numY, W-140, 24, C.PANELED); rect(71,numY+1,W-142,22,C.PANEL);
  txt(String(S.playerNumber), W/2, numY+5, C.GOLD, 14, 'center');

  // continue
  // keyboard first, then CONTINUE below it with clear air between —
  // they used to overlap by 2px, so tapping the top edge of the A-I row
  // submitted the name instead of typing the letter
  KEYBOARD_RECTS = drawNameKeyboard(70, 332);

  const by = 390;
  NAME_RECTS.push(['go', 0, 40, by, W-80, 24]);
  rect(40,by,W-80,24, Math.sin(S.t*5)>0?C.GOLD:C.GOLDDK);
  rect(41,by+1,W-82,22,'#241a06');
  txt(t('name_continue'), W/2, by+7, C.GOLD2, 10, 'center');
}
let NAME_RECTS = [], KEYBOARD_RECTS = [];
const NAME_KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ⌫';
function drawNameKeyboard(x0, y0){
  const rects = [];
  const cols = 9, kw = (W-140)/cols, kh = 14;
  [...NAME_KEYS].forEach((ch,i)=>{
    const col = i%cols, row = Math.floor(i/cols);
    const x = x0 + col*kw, y = y0 + row*(kh+2);
    rects.push([ch, x, y, kw-2, kh]);
    rect(x, y, kw-2, kh, C.PANELED); rect(x+0.5, y+0.5, kw-3, kh-1, C.PANEL);
    txt(ch, x+kw/2-1, y+3, C.GREY, 7, 'center');
  });
  return rects;
}
function nameHit(px,py){
  for (const r of NAME_RECTS) if (px>=r[2]&&px<=r[2]+r[4]&&py>=r[3]&&py<=r[3]+r[5]) return r;
  for (const r of KEYBOARD_RECTS) if (px>=r[1]&&px<=r[1]+r[3]&&py>=r[2]&&py<=r[2]+r[4]) return r;
  return null;
}

/* ── club badges — plain shield shapes in a solid team colour with
   initials, no crest linework, same policy as the player's own kit
   colours (see the note above CLUB_QUESTIONS). Locked ones (both the
   7 not-yet-earned clubs and the permanent placeholders) get dimmed
   and padlocked the same way.                                      ── */
function isLightColor(hex){
  const r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), bl = parseInt(hex.substr(5,2),16);
  return (r*299+g*587+bl*114)/1000 > 150;
}
function drawPadlock(cx, cy, r){
  b.save();
  b.fillStyle = '#181818'; b.globalAlpha = 0.88;
  const bw = r*1.3, bh = r;
  b.fillRect(cx-bw/2, cy-bh*0.1, bw, bh);
  b.strokeStyle = '#181818'; b.lineWidth = Math.max(1.5, r*0.28); b.lineCap = 'round';
  b.beginPath(); b.arc(cx, cy-bh*0.1, r*0.55, Math.PI, 0); b.stroke();
  b.restore();
  circ(cx, cy+bh*0.28, Math.max(1.2, r*0.16), '#f0d060');
}
function drawClubBadge(cx, cy, r, color, initials, locked){
  b.save();
  if (locked) b.globalAlpha *= 0.5;
  b.fillStyle = color;
  b.beginPath();
  b.moveTo(cx-r*0.8, cy-r*0.8); b.lineTo(cx+r*0.8, cy-r*0.8);
  b.lineTo(cx+r*0.8, cy+r*0.1); b.lineTo(cx, cy+r); b.lineTo(cx-r*0.8, cy+r*0.1);
  b.closePath(); b.fill();
  b.strokeStyle = 'rgba(0,0,0,0.4)'; b.lineWidth = 1; b.stroke();
  if (initials) txt(initials, cx, cy-r*0.32, isLightColor(color) ? '#1a1a1a' : '#ffffff', Math.max(5, Math.round(r*0.5)), 'center');
  b.restore();
  if (locked) drawPadlock(cx, cy, r*0.55);
}

function handleClubsTap(px, py){
  if (S.clubHintT > 0) S.clubHintT = 0;
  if (CLUBS_BACK && px>=CLUBS_BACK[0] && px<=CLUBS_BACK[0]+CLUBS_BACK[2] &&
      py>=CLUBS_BACK[1] && py<=CLUBS_BACK[1]+CLUBS_BACK[3]){
    SFX.lock(0,true); S.clubBuyConfirm = null; gotoScene('TITLE'); return;
  }
  const cols = CLUBS_COLS, cell = (W-28)/cols, gTop = CLUBS_GRID_TOP, gBot = CLUBS_GRID_BOT;
  if (py < gTop || py > gBot) return;
  const col = Math.floor((px-14)/cell);
  if (col < 0 || col >= cols) return;
  const row = Math.floor((py - gTop + S.clubsScroll) / CLUBS_ROWH);
  const idx = row*cols + col;
  if (idx < 0 || idx >= CLUBS.length) return;
  const club = CLUBS[idx];
  const p = S.profile;
  if (p.clubsUnlocked.indexOf(club.id) >= 0){
    S.clubBuyConfirm = null;
    SFX.whistleShort(); S.isDaily = false;
    transitionTo(()=> beginKeepyups(club.id));
  } else if (club.hasContent){
    // second tap on the same locked club, with a direct-purchase price
    // already showing, actually spends the bank — first tap only arms it
    const price = clubDirectPrice(club);
    if (S.clubBuyConfirm === club.id){
      if (buyClubWithBank(club)){
        S.clubBuyConfirm = null;
        S.clubHintMsg = club.name+' SIGNED! ('+fmtMoney(price)+' from your bank)';
        S.clubHintT = 2.6; SFX.rankUp(); spawnConfetti(16);
      } else {
        S.clubHintMsg = 'Not enough bank money for '+club.name+' — need '+fmtMoney(price)+'.';
        S.clubHintT = 2.8; SFX.wrong();
      }
      return;
    }
    S.clubBuyConfirm = club.id;
    S.clubHintMsg = 'Win '+curSym()+'1,000,000 with a new team — or tap again to buy '+club.name+' outright for '+fmtMoney(price)+'.';
    S.clubHintT = 3.4; SFX.lock(0,false);
  } else {
    S.clubBuyConfirm = null;
    S.clubHintMsg = club.name+' — coming soon.';
    S.clubHintT = 2.0; SFX.lock(0,false);
  }
}

function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(()=>clearTimeout(id));
}

function hubFixturesCacheKey(){
  const followed = S.profile.followedTeams;
  if (followed.length) return 'kick-off_fixtures_team_v2:'+followed.slice().sort().join('|');
  return 'kick-off_fixtures_comp_v2:'+COMPETITIONS[S.hub.compIdx].id;
}
// a followed team's OWN next fixtures — across every competition it's in,
// home or away, domestic or continental — is how "overseas away games"
// show up here, with no separate European-fixtures code path needed
async function fetchTeamFixtures(name){
  try {
    const sRes = await fetchWithTimeout('https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t='+encodeURIComponent(name), HUB_FETCH_TIMEOUT);
    if (!sRes.ok) return [];
    const sJson = await sRes.json();
    const team = (sJson.teams||[])[0];
    if (!team) return [];
    const eRes = await fetchWithTimeout('https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id='+team.idTeam, HUB_FETCH_TIMEOUT);
    if (!eRes.ok) return [];
    const eJson = await eRes.json();
    return (eJson.events||[]).map(e => ({
      home:e.strHomeTeam, away:e.strAwayTeam, date:e.dateEvent, time:e.strTime, venue:e.strVenue, comp:e.strLeague
    }));
  } catch(e){ return []; }
}
async function fetchFixtures(force){
  const h = S.hub, key = hubFixturesCacheKey();
  const cached = hubLoadCache(key);
  if (cached && !force && Date.now()-cached.t < HUB_CACHE_MAX_AGE){
    h.fixtures = cached.data; h.fixturesStatus = 'ok'; return;
  }
  h.fixturesStatus = 'loading'; h.fixturesErr = '';
  try {
    const followed = S.profile.followedTeams;
    let events;
    if (followed.length){
      const groups = await Promise.all(followed.slice(0, MAX_FOLLOWED_FOR_FIXTURES).map(fetchTeamFixtures));
      events = groups.flat().filter(e => e.home && e.away);
      // two followed teams playing each other would otherwise show up once
      // per team's own fetch — collapse to a single card per real fixture
      const seenFixtures = new Set();
      events = events.filter(e => {
        const key = e.date+'|'+e.time+'|'+e.home+'|'+e.away;
        if (seenFixtures.has(key)) return false;
        seenFixtures.add(key); return true;
      });
      events.sort((a,b) => (a.date+' '+a.time).localeCompare(b.date+' '+b.time));
    } else {
      const comp = COMPETITIONS[h.compIdx];
      const res = await fetchWithTimeout('https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id='+comp.id, HUB_FETCH_TIMEOUT);
      if (!res.ok) throw new Error('HTTP '+res.status);
      const json = await res.json();
      events = (json.events||[]).map(e => ({
        home:e.strHomeTeam, away:e.strAwayTeam, date:e.dateEvent, time:e.strTime, venue:e.strVenue, comp:comp.label
      })).filter(e => e.home && e.away);
    }
    h.fixtures = events;
    h.fixturesStatus = events.length ? 'ok' : 'empty';
    hubSaveCache(key, events);   // cache even a genuinely-empty result (e.g. a cup between rounds) so it isn't re-fetched every 30s
  } catch(err){
    const stale = hubLoadCache(key);
    if (stale){ h.fixtures = stale.data; h.fixturesStatus = 'stale'; }
    else { h.fixturesStatus = 'error'; h.fixturesErr = "Couldn't load fixtures — check your connection."; }
  }
}

async function fetchRssSource(src){
  try {
    const res = await fetchWithTimeout('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(src.url), HUB_FETCH_TIMEOUT);
    if (!res.ok) return [];
    const json = await res.json();
    if (json.status !== 'ok') return [];
    return (json.items||[]).slice(0, 15).map(it => ({
      title: it.title, link: it.link, pubDate: it.pubDate,
      desc: (it.description||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim(),
      source: src.label
    }));
  } catch(e){ return []; }
}
async function fetchArticles(sources){
  const groups = await Promise.all(sources.map(fetchRssSource));
  const items = groups.flat();
  items.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
  return items.slice(0, 30);
}
function filterByFollowed(items){
  const followed = S.profile.followedTeams;
  if (!followed.length) return items;
  const needles = followed.map(n => n.toLowerCase());
  return items.filter(it => {
    const hay = (it.title+' '+it.desc).toLowerCase();
    return needles.some(n => hay.includes(n));
  });
}

function relTime(dateStr){
  const ms = Date.now() - new Date(dateStr.replace(' ','T')+'Z').getTime();
  const min = Math.floor(ms/60000);
  if (min < 1) return 'just now';
  if (min < 60) return min+'m ago';
  const hr = Math.floor(min/60);
  if (hr < 24) return hr+'h ago';
  return Math.floor(hr/24)+'d ago';
}
function fixtureLabel(f){
  const d = new Date(f.date+'T00:00:00');
  const day = d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
  const time = (f.time||'').slice(0,5);
  return day + (time ? '  ·  ' + time : '');
}
function drawStar(cx, cy, r, filled, col){
  b.save(); b.translate(cx, cy); b.beginPath();
  for (let i=0;i<5;i++){
    const a1 = -Math.PI/2 + i*2*Math.PI/5, a2 = a1 + Math.PI/5;
    const p1x = Math.cos(a1)*r, p1y = Math.sin(a1)*r;
    const p2x = Math.cos(a2)*r*0.42, p2y = Math.sin(a2)*r*0.42;
    if (i===0) b.moveTo(p1x,p1y); else b.lineTo(p1x,p1y);
    b.lineTo(p2x,p2y);
  }
  b.closePath();
  if (filled){ b.fillStyle = col; b.fill(); } else { b.strokeStyle = col; b.lineWidth = 1.2; b.stroke(); }
  b.restore();
}

function handleHubTap(px, py){
  const h = S.hub;

  if (h.teamPicker){
    if (HUB_PICKER_DONE && px>=HUB_PICKER_DONE[0] && px<=HUB_PICKER_DONE[0]+HUB_PICKER_DONE[2] &&
        py>=HUB_PICKER_DONE[1] && py<=HUB_PICKER_DONE[1]+HUB_PICKER_DONE[3]){
      h.teamPicker = false; SFX.lock(0,true);
      if (h.tab === 'FIXTURES') fetchFixtures(true).then(draw);
      return;
    }
    const hit = HUB_PICKER_ROWS.find(r=>px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]);
    if (hit){
      const name = hit[4], idx = S.profile.followedTeams.indexOf(name);
      if (idx>=0) S.profile.followedTeams.splice(idx,1); else S.profile.followedTeams.push(name);
      saveGame(); SFX.tick(true);
    }
    return;
  }

  if (h.openItem){
    if (HUB_ITEM_LINK_RECT && px>=HUB_ITEM_LINK_RECT[0] && px<=HUB_ITEM_LINK_RECT[0]+HUB_ITEM_LINK_RECT[2] &&
        py>=HUB_ITEM_LINK_RECT[1] && py<=HUB_ITEM_LINK_RECT[1]+HUB_ITEM_LINK_RECT[3]){
      window.open(h.openItem.link, '_blank', 'noopener');
      return;
    }
    h.openItem = null; SFX.lock(0,true);
    return;
  }

  if (HUB_BACK && px>=HUB_BACK[0] && px<=HUB_BACK[0]+HUB_BACK[2] && py>=HUB_BACK[1] && py<=HUB_BACK[1]+HUB_BACK[3]){
    SFX.lock(0,true); gotoScene('TITLE'); return;
  }

  const tabHit = HUB_TAB_RECTS.find(r=>px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]);
  if (tabHit){
    if (h.tab !== tabHit[4]){
      h.tab = tabHit[4]; h.scroll = 0; SFX.lock(0,true);
      if (h.tab === 'TRANSFERS' && h.transfersStatus === 'idle') fetchTransfers();
      else if (h.tab === 'NEWS' && h.newsStatus === 'idle') fetchNews();
    }
    return;
  }

  if (HUB_FOLLOW_RECT && px>=HUB_FOLLOW_RECT[0] && px<=HUB_FOLLOW_RECT[0]+HUB_FOLLOW_RECT[2] &&
      py>=HUB_FOLLOW_RECT[1] && py<=HUB_FOLLOW_RECT[1]+HUB_FOLLOW_RECT[3]){
    h.teamPicker = true; h.teamPickerScroll = 0; SFX.lock(0,true);
    return;
  }

  if (h.tab === 'FIXTURES' && HUB_COMP_RECT && px>=HUB_COMP_RECT[0] && px<=HUB_COMP_RECT[0]+HUB_COMP_RECT[2] &&
      py>=HUB_COMP_RECT[1] && py<=HUB_COMP_RECT[1]+HUB_COMP_RECT[3]){
    h.compIdx = (h.compIdx+1) % COMPETITIONS.length;
    h.scroll = 0; SFX.tick(true);
    fetchFixtures().then(draw);
    return;
  }

  const isError = (h.tab==='FIXTURES' && h.fixturesStatus==='error') ||
                  (h.tab==='NEWS' && h.newsStatus==='error') ||
                  (h.tab==='TRANSFERS' && h.transfersStatus==='error');
  if (isError && HUB_RETRY_RECT && px>=HUB_RETRY_RECT[0] && px<=HUB_RETRY_RECT[0]+HUB_RETRY_RECT[2] &&

/* ── frame padding: extends the stadium above and below the game
   buffer so the presentation fills a tall phone screen rather than
   letterboxing. Purely decorative — the buffer itself is untouched. ── */
/* The bands above and below the playfield are a bezel, not a second
   scene. They used to carry a full bobbing crowd and two floodlight
   cones, which read as clutter competing with the game. Now: a clean
   dark gradient, one calm silhouette row, and a crisp rule line to
   frame the play area. */
function drawFrameTop(){
  // Deliberately empty of scenery. The playfield already draws a full
  // stand of its own directly below this band, and having a second
  // crowd up here just stacked two competing terraces on top of each
  // other. A plain bezel lets the actual game read.
  const g = ctx.createLinearGradient(0,0,0,PAD_TOP);
  g.addColorStop(0, '#03040a'); g.addColorStop(1, '#0a1020');
  ctx.fillStyle = g; ctx.fillRect(0,0,FRAME_W,PAD_TOP);
  ctx.fillStyle = '#1d2942'; ctx.fillRect(0, PAD_TOP-2, FRAME_W, 2);
  ctx.fillStyle = '#2b3a5c'; ctx.fillRect(0, PAD_TOP-1, FRAME_W, 1);
}
function drawFrameBottom(){
  const y0 = FRAME_H-PAD_BOTTOM;
  const g = ctx.createLinearGradient(0,y0,0,FRAME_H);
  g.addColorStop(0, '#0a1020'); g.addColorStop(1, '#03040a');
  ctx.fillStyle = g; ctx.fillRect(0,y0,FRAME_W,PAD_BOTTOM);
  ctx.fillStyle = '#1d2942'; ctx.fillRect(0, y0, FRAME_W, 2);
  ctx.fillStyle = '#2b3a5c'; ctx.fillRect(0, y0, FRAME_W, 1);
}

function handleSettingsTap(px,py){
  if (S.cheatMenuOpen){ handleCheatMenuTap(px,py); return; }
  const hit = settingsHit(px,py);
  if (!hit){
    const p = SETTINGS_PANEL;
    const inPanel = px>=p[0]&&px<=p[0]+p[2]&&py>=p[1]&&py<=p[1]+p[3];
    if (!inPanel){ S.settingsOpen = false; S.settingsConfirmQuit = false; }
    return;
  }
  const key = hit[4];
  if (key !== 'quit') S.settingsConfirmQuit = false;
  if (key === 'sound'){ S.audioMuted = !S.audioMuted; applyVolume(); SFX.tick(!S.audioMuted); }
  else if (key === 'vol'){ S.audioVolume = Math.max(0, Math.min(1, S.audioVolume + hit[5]*0.1)); applyVolume(); SFX.tick(true); }
  else if (key === 'motion'){ S.reduceMotion = !S.reduceMotion; }
  else if (key === 'ladder'){ S.ladderStyle = S.ladderStyle==='football' ? 'money' : 'football'; }
  else if (key === 'language'){
    const i = LANGUAGES.findIndex(l=>l.code===S.language);
    S.language = LANGUAGES[(i+1)%LANGUAGES.length].code;
    rebuildMoneyLabels();
  }
  else if (key === 'cheats'){ S.cheatMenuOpen = true; SFX.lock(0,true); }
  else if (key === 'save'){ const ok = saveGame(); S.saveFlashT = ok ? 1.4 : 0; SFX.correct(); }
  else if (key === 'quit'){
    if (S.settingsConfirmQuit){
      S.settingsOpen = false; S.settingsConfirmQuit = false;
      if (S.scene.indexOf('DEFENDER_')===0) defEnd();
      S.ku = null; S.mode = 'SHOOTOUT';
      gotoScene('TITLE');
    } else { S.settingsConfirmQuit = true; SFX.wrong(); }
  }
  else if (key === 'close'){ S.settingsOpen = false; S.settingsConfirmQuit = false; }
}

let DEVMENU_RECTS = [], DEVMENU_PANEL = [0,0,0,0];
function handleDevMenuTap(px,py){
  const p = DEVMENU_PANEL;
  const inPanel = px>=p[0]&&px<=p[0]+p[2]&&py>=p[1]&&py<=p[1]+p[3];
  const hit = DEVMENU_RECTS.find(r=>px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]);
  if (!hit){ if (!inPanel) S.devMenuOpen = false; return; }
  const key = hit[4];
  if (key === 'CLOSE'){ S.devMenuOpen = false; S.devConfirmReset = false; SFX.lock(0, true); return; }
  if (key === 'ALL'){
    const allOn = CHEATS.every(c => S.cheats[c.key]);
    CHEATS.forEach(c => { S.cheats[c.key] = !allOn; });
    S.devConfirmReset = false;
    SFX.rankUp();
    return;
  }
  if (key.indexOf('sc:')===0){
    const s = DEV_SHORTCUTS.find(x=>x.key===key.slice(3));
    if (!s) return;
    if (s.kind==='toggle'){ s.set(!s.get()); SFX.lock(0, s.get()); S.devConfirmReset = false; return; }
    if (s.kind==='confirm'){
      // destructive — needs a second tap on the same button to actually fire,
      // same "tap again to confirm" pattern as the settings quit button
      if (S.devConfirmReset){ s.run(); S.devConfirmReset = false; SFX.rankUp(); }
      else { S.devConfirmReset = true; SFX.wrong(); }
      return;
    }
    s.run(); S.devConfirmReset = false; SFX.rankUp();
    return;
  }
  S.devConfirmReset = false;
  S.cheats[key] = !S.cheats[key];
  SFX.lock(0, S.cheats[key]);

  S.devMenuScroll = Math.max(0, Math.min(maxScroll, S.devMenuScroll));

  DEVMENU_RECTS = [];
  b.save(); b.beginPath(); b.rect(px0, gTop, pw, gBot-gTop); b.clip();
  let ry = gTop - S.devMenuScroll;
  const vis = (y,h) => y+h >= gTop && y <= gBot;

  if (vis(ry,11)) txt('SHORTCUTS', rx, ry, C.GREYDK, 7);
  ry += 11;
  DEV_SHORTCUTS.forEach((s,i)=>{
    const col = i%2, row = Math.floor(i/2);
    const x = rx + col*(scw+6), y = ry + row*(sch+scGap);
    if (!vis(y,sch)) return;
    const confirming = s.kind==='confirm' && S.devConfirmReset;
    const on = s.kind==='toggle' && s.get();
    DEVMENU_RECTS.push([x,y,scw,sch,'sc:'+s.key]);
    rect(x,y,scw,sch, on?C.GOLD:(confirming?C.RED:C.PANELED));
    rect(x+1,y+1,scw-2,sch-2, on?'#3a2c06':(confirming?'#3a0606':C.PANEL));
    txtFit(confirming?'TAP AGAIN':s.name, x+scw/2, y+sch/2-5, on?C.GOLD2:(confirming?C.WHITE:C.WHITE), 7, scw-8, 'center');
  });
  ry += shortcutRows*(sch+scGap) + 8;

  if (vis(ry,11)) txt('CHEATS', rx, ry, C.GREYDK, 7);
  ry += 11;
  const allOn = CHEATS.every(c => S.cheats[c.key]);
  if (vis(ry,22)){
    DEVMENU_RECTS.push([rx,ry,rw,22,'ALL']);
    rect(rx,ry,rw,22, allOn?C.GOLD:C.PANELED); rect(rx+1,ry+1,rw-2,20, allOn?'#3a2c06':C.PANEL);
    txt(allOn?'ALL CHEATS ON':'ENABLE ALL CHEATS', W/2, ry+6, allOn?C.GOLD2:C.WHITE, 9, 'center');
  }
  ry += 28;

  CHEATS.forEach(c=>{
    const on = S.cheats[c.key];
    if (vis(ry,28)){
      DEVMENU_RECTS.push([rx,ry,rw,28,c.key]);
      rect(rx,ry,rw,28, on?C.GOLDDK:C.PANELED); rect(rx+1,ry+1,rw-2,24, on?'#241a06':C.PANEL);
      txt(c.name, rx+8, ry+4, on?C.GOLD2:C.WHITE, 9);
      txtFit(localizeMoney(c.desc), rx+8, ry+15, C.GREYDK, 6, rw-52);
      if (c.blocksClubUnlock) txt('⚠ BLOCKS CLUB UNLOCK', rx+8, ry+23, C.RED, 5);
      txt(on?'ON':'OFF', rx+rw-22, ry+9, on?C.GREEN:C.GREYDK, 8, 'center');
    }
    ry += 32;
  });
  b.restore();

  if (maxScroll > 0){
    const trackH = gBot-gTop, kh = Math.max(18, trackH*(trackH/contentH));
    const ky = gTop + (trackH-kh)*(S.devMenuScroll/maxScroll);
    rect(px0+pw-6, gTop, 2, trackH, C.PANEL);
    rect(px0+pw-6, ky, 2, kh, C.GOLDDK);
  }

  const closeY = py0+ph-26;
  DEVMENU_RECTS.push([rx,closeY,rw,22,'CLOSE']);
  rect(rx,closeY,rw,22, C.PANELED); rect(rx+1,closeY+1,rw-2,20, C.PANEL);
  txt('CLOSE', W/2, closeY+6, C.WHITE, 9, 'center');
}

/* ── achievement badge art — small pictograms, no font glyphs, so
   they read the same on every device ─────────────────────────── */
function drawAchIcon(kind, cx, cy, r, col){
  switch (kind){
    case 'coin':
      circ(cx, cy, r, col); circ(cx, cy, r*0.66, '#241a06');
      txt('£', cx, cy-r*0.55, col, Math.max(6,Math.round(r*1.1)), 'center'); break;
    case 'diamond':
      b.fillStyle = col; b.beginPath();
      b.moveTo(cx, cy-r); b.lineTo(cx+r*0.78, cy); b.lineTo(cx, cy+r); b.lineTo(cx-r*0.78, cy);
      b.closePath(); b.fill();
      b.strokeStyle='rgba(255,255,255,0.55)'; b.lineWidth=1; b.stroke(); break;
    case 'bolt':
      b.fillStyle = col; b.beginPath();
      b.moveTo(cx+r*0.3, cy-r); b.lineTo(cx-r*0.55, cy+r*0.15); b.lineTo(cx, cy+r*0.15);
      b.lineTo(cx-r*0.3, cy+r); b.lineTo(cx+r*0.6, cy-r*0.2); b.lineTo(cx+r*0.05, cy-r*0.2);
      b.closePath(); b.fill(); break;
    case 'shield':
      b.fillStyle = col; b.beginPath();
      b.moveTo(cx-r*0.8, cy-r*0.8); b.lineTo(cx+r*0.8, cy-r*0.8);
      b.lineTo(cx+r*0.8, cy*1+r*0.1); b.lineTo(cx, cy+r); b.lineTo(cx-r*0.8, cy+r*0.1);
      b.closePath(); b.fill(); break;
    case 'target':
      circ(cx, cy, r, col); circ(cx, cy, r*0.66, '#0e1526'); circ(cx, cy, r*0.32, col); break;
    case 'trophy':
      rect(cx-r*0.55, cy-r*0.85, r*1.1, r*0.95, col);
      rect(cx-r*0.22, cy+r*0.1, r*0.44, r*0.5, col);
      rect(cx-r*0.7, cy+r*0.6, r*1.4, r*0.3, col);
      rect(cx-r*0.95, cy-r*0.75, r*0.3, r*0.5, col);
      rect(cx+r*0.65, cy-r*0.75, r*0.3, r*0.5, col); break;
    case 'flame':
      b.fillStyle = col; b.beginPath();
      b.moveTo(cx, cy-r); b.quadraticCurveTo(cx+r, cy-r*0.1, cx+r*0.45, cy+r*0.7);
      b.quadraticCurveTo(cx, cy+r*1.05, cx-r*0.45, cy+r*0.7);
      b.quadraticCurveTo(cx-r, cy-r*0.1, cx, cy-r);
      b.closePath(); b.fill(); break;
    case 'globe':
      circ(cx, cy, r, col); circ(cx, cy, r*0.82, '#0e1526');
      b.strokeStyle = col; b.lineWidth = 1;
      b.beginPath(); b.ellipse(cx, cy, r*0.36, r*0.82, 0, 0, 6.2832); b.stroke();
      b.beginPath(); b.moveTo(cx-r*0.82, cy); b.lineTo(cx+r*0.82, cy); b.stroke(); break;
    case 'moon':
      circ(cx, cy, r, col); circ(cx+r*0.42, cy-r*0.3, r*0.85, '#0e1526'); break;
    case 'boot':
      rect(cx-r*0.7, cy-r*0.7, r*0.72, r*1.1, col);
      rect(cx-r*0.7, cy+r*0.25, r*1.6, r*0.5, col); break;
    case 'chest':
      rect(cx-r*0.85, cy-r*0.15, r*1.7, r*0.95, col);
      rect(cx-r*0.85, cy-r*0.7, r*1.7, r*0.55, col);
      rect(cx-r*0.15, cy-r*0.25, r*0.3, r*0.45, '#0e1526'); break;
    case 'lock':
      rect(cx-r*0.65, cy-r*0.05, r*1.3, r*0.95, col);
      b.strokeStyle = col; b.lineWidth = Math.max(1.4, r*0.24); b.lineCap = 'round';
      b.beginPath(); b.arc(cx, cy-r*0.05, r*0.5, Math.PI, 0); b.stroke();
      circ(cx, cy+r*0.25, Math.max(1.2, r*0.14), '#0e1526'); break;
    case 'news':
      rect(cx-r*0.85, cy-r*0.85, r*1.7, r*1.7, col);
      for (let i=0;i<3;i++) rect(cx-r*0.6, cy-r*0.5+i*r*0.5, r*1.2, r*0.16, '#0e1526');
      break;
    default:  // 'ball'
      drawLadderBall(cx, cy, r, 'plain');
  }
}

/* Toasts queue up and play one at a time — slide in from the right,
   hold, slide out — so a burst of unlocks never overlaps itself. */
const TOAST_IN = 0.3, TOAST_HOLD = 1.9, TOAST_OUT = 0.35;
const TOAST_LIFE = TOAST_IN + TOAST_HOLD + TOAST_OUT;
function updateAchToasts(dt){
  if (!S.achQueue.length) return;
  const cur = S.achQueue[0];
  cur.t += dt;
  if (cur.t >= TOAST_LIFE) S.achQueue.shift();
}
function drawAchToast(){
  if (!S.achQueue.length) return;
  // ceremony and results screens report their own rewards — a toast on
  // top of those is both redundant and lands on the headline
  if (S.scene === 'KU_OVER' || S.scene === 'MATCHEND' ||
      S.scene === 'KU_CHEST' || S.scene === 'PROFILE' || S.scene === 'CLUBS') return;
  const cur = S.achQueue[0], a = ACH_BY_ID[cur.id];
  if (!a) { S.achQueue.shift(); return; }
  const tw = 176, th = 34, ty = 58;
  let slide;
  if (cur.t < TOAST_IN)                   slide = 1 - cur.t/TOAST_IN;
  else if (cur.t < TOAST_IN + TOAST_HOLD) slide = 0;
  else                                    slide = (cur.t - TOAST_IN - TOAST_HOLD)/TOAST_OUT;
  const ease = slide*slide;
  const tx = W - tw - 6 + ease*(tw + 12);

  b.save();
  b.globalAlpha = 0.96;
  rect(tx-1, ty-1, tw+2, th+2, C.GOLD);
  rect(tx, ty, tw, th, '#1a1405');
  const pulse = 0.5 + 0.5*Math.sin(S.t*7);
  b.globalAlpha = 0.25 + pulse*0.35;
  rect(tx, ty, tw, 1, C.GOLD2); rect(tx, ty+th-1, tw, 1, C.GOLD2);
  b.globalAlpha = 1;
  drawAchIcon(a.icon, tx+17, ty+th/2, 9, C.GOLD);
  txt('ACHIEVEMENT UNLOCKED', tx+32, ty+6, C.GOLD2, 6);
  txtFit(a.name, tx+32, ty+15, C.WHITE, 10, tw-40);
  txtFit(localizeMoney(a.desc), tx+32, ty+26, C.GREYDK, 6, tw-40);
  b.restore();
}

function finishDraw(){
  drawTapFX(); drawFeedback();
  drawAchToast();
  drawTransition();
  if (S.settingsOpen){ if (S.cheatMenuOpen) drawCheatMenu(); else drawSettings(); }
  if (S.devPinOpen) drawDevPin();
  if (S.devMenuOpen) drawDevMenu();
  post();
}

/* ── post-processing: shake, flash, RGB split, scanlines, vignette ── */
function post(){
  const sh = S.reduceMotion ? 0 : S.shake;
  const ox = sh ? (rnd()-0.5)*sh*2 : 0, oy = sh ? (rnd()-0.5)*sh*2 : 0;

  ctx.fillStyle = C.VOID; ctx.fillRect(0,0,cv.width,cv.height);
  const sc = cv.width / FRAME_W;
  ctx.save(); ctx.scale(sc, sc); ctx.imageSmoothingEnabled = false;

  drawFrameTop();
  drawFrameBottom();
  ctx.save();
  ctx.translate(0, PAD_TOP);

  // buf is supersampled (SSxSS the logical size) — draw it smooth so the
  // downscale genuinely antialiases instead of just picking nearest pixels
  ctx.imageSmoothingEnabled = true;
  if (S.aberr > 0.01 && !S.reduceMotion){
    const d = S.aberr * 3;
    ta.clearRect(0,0,W,H); ta.drawImage(buf,0,0,W,H);
    ta.globalCompositeOperation='multiply'; ta.fillStyle='#ff2020'; ta.fillRect(0,0,W,H);
    ta.globalCompositeOperation='source-over';
    tb.clearRect(0,0,W,H); tb.drawImage(buf,0,0,W,H);
    tb.globalCompositeOperation='multiply'; tb.fillStyle='#20ffff'; tb.fillRect(0,0,W,H);
    tb.globalCompositeOperation='source-over';
    ctx.drawImage(buf, ox, oy, W, H);
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha = 0.55; ctx.drawImage(tA, ox-d, oy); ctx.drawImage(tB, ox+d, oy);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation='source-over';
  } else {
    ctx.drawImage(buf, ox, oy, W, H);
  }
  ctx.imageSmoothingEnabled = false;

  if(S.flash>0.01){const f=Math.min(.7,S.flash);ctx.globalAlpha=f;ctx.fillStyle=(S.gloom>.1)?'#dbe8ff':'#fff8df';ctx.fillRect(0,0,W,H);ctx.globalAlpha=f*.28;ctx.fillStyle='#ffc93c';ctx.fillRect(W*.12,H*.18,W*.76,1);ctx.globalAlpha=1;}
  if(S.crowdHype>.55&&!S.reduceMotion){const g=ctx.createRadialGradient(W*.18,H*.16,0,W*.18,H*.16,26);g.addColorStop(0,'rgba(255,245,190,.16)');g.addColorStop(1,'rgba(255,245,190,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

  // the roar warms the whole picture
  if (S.crowdHype > 0.3){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (S.crowdHype-0.3)*0.16;
    ctx.fillStyle = '#ffb84a'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  // the boo drains it — colour first, then a cold cast
  if (S.gloom > 0.01){
    ctx.globalCompositeOperation = 'saturation';
    ctx.globalAlpha = Math.min(0.9, S.gloom);
    ctx.fillStyle = '#808080'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = Math.min(0.30, S.gloom*0.30);
    ctx.fillStyle = '#0d1a33'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();   // undo the PAD_TOP translate — back to frame space

  // scanlines — kept as a hint of CRT, not a veil over the art
  ctx.globalAlpha = 0.06; ctx.fillStyle = '#000';
  for (let y=0;y<FRAME_H;y+=2) ctx.fillRect(0,y,FRAME_W,1);
  ctx.globalAlpha = 1;

  // vignette, over the whole frame — lighter, so edge detail survives
  const g = ctx.createRadialGradient(FRAME_W/2,FRAME_H/2,FRAME_H*0.38, FRAME_W/2,FRAME_H/2,FRAME_H*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle = g; ctx.fillRect(0,0,FRAME_W,FRAME_H);
  ctx.restore();
}

loadGame();
/* Onboarding is a one-time cost. Anyone who has already been through it
   has a name saved, and should land straight on their own title screen
   rather than re-picking a language every single launch. */
if (S.playerName) gotoScene('TITLE');

/* ═══════════════════════════════════════════════════════════
   RESIZE + LOOP
   ═══════════════════════════════════════════════════════════ */
/* Sharpness lives or dies here. The backing store has to be sized in
   *device* pixels — size it in CSS pixels and the browser resamples the
   whole bitmap up to the physical display, which is what turns crisp
   art into mush on any phone with DPR > 1. `buf` is supersampled (see
   SS above) and smooth-downscaled into this backing store, so an exact
   integer scale isn't required for crispness the way it used to be —
   it's kept mainly so a snap that barely costs any screen space is
   free to take, not to preserve literal blocky pixels. */
function resize(){
  const dpr = Math.max(1, Math.min(4, window.devicePixelRatio || 1));
  const availH = window.innerHeight - 12, availW = window.innerWidth - 8;
  const fit = Math.min(availW*dpr / FRAME_W, availH*dpr / FRAME_H);
  const snapped = Math.floor(fit);
  // only give up the perfect pixel grid when snapping would cost real size
  const scale = (snapped >= 1 && snapped/fit > 0.82) ? snapped : fit;

  cv.width  = Math.round(FRAME_W*scale);
  cv.height = Math.round(FRAME_H*scale);
  cv.style.width  = (cv.width/dpr)+'px';
  cv.style.height = (cv.height/dpr)+'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now){
  let dt = (now - last)/1000; last = now;
  if (dt > 0.25) dt = 0.25;
  if (S.hitstop > 0){ S.hitstop -= dt; dt = 0; }
  tickAcc += dt;
  let guard = 0;
  while (tickAcc >= DT && guard++ < 8){ update(DT); tickAcc -= DT; }
  updateAmbience();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
