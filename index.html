function defApplyChoice(ch){const h=S.def;if(ch.kind==='heal'){h.hp=Math.min(h.maxhp, h.hp+Math.round(h.maxhp*.28));SFX.inflate();return;}if(ch.kind==='gold'){h.tokens+=18;SFX.defCoin();return;}if(ch.kind==='weapon'){let w=defWeapon(ch.id);if(w){w.level++;w.cdT=0;}else{const base=H_WEAPONS[ch.id];h.weapons.push({id:ch.id,level:1,cdT:0});if(ch.id==='kickball')S.defMeta.kickball=true;}SFX.correct();S.flash=.14;return;}let p=defPassive(ch.id);if(p)p.level++;else h.passives.push({id:ch.id,level:1});if(ch.id==='speed')h.speed*=1.12;if(ch.id==='magnet')h.magnet+=18;if(ch.id==='damage')h.damage*=1.12;if(ch.id==='cooldown')h.cooldown*=.93;if(ch.id==='hp'){h.maxhp+=18;h.hp+=18;defBurst(h.x,h.y,C.ORANGE,8);S.flash=Math.max(S.flash,.1);}SFX.correct();}
// rare, optional treasure — never required for progression. Reward table is
// weighted toward the small/frequent end (tokens, heal) with a free upgrade
// as the rare top prize, so it always feels like a genuine detour-worthy find
// without being able to break the run's pacing.
function defCollectNetChest(nc){
  const h=S.def; const roll=rnd(); let label;
  if (roll<0.35){ const amt=rint(10,18); h.tokens+=amt; label='+'+amt+' TOKENS'; }
  else if (roll<0.6){ const heal=Math.round(h.maxhp*0.22); h.hp=Math.min(h.maxhp,h.hp+heal); label='+HP'; }
  else if (roll<0.8){ h.magnetBoostT=10; label='MAGNET BOOST'; }
  else { const opts=defEligibleChoices(); if (opts.length){ defApplyChoice(opts[rint(0,opts.length-1)]); label='FREE UPGRADE'; } else { h.tokens+=14; label='+14 TOKENS'; } }
  pushFeedback(t('defender_net_chest')+' · '+label, C.GOLD2);

// "defeated" = the player's squad wipe cleared that club's wave.
// defAdvanceWave() calls this with the wave that just cleared (before
// h.wave is reassigned to the next one, or left at 10 for the endless final
// stage). Guarded so a club is only ever relegated once per run.
function defRelegate(waveIdx){
  const h=S.def; if(!h||waveIdx<0) return;
  const ids=H_WAVE_CLUBS[waveIdx]; if(!ids||!ids.length) return;
  const primary=ids[0], club=CLUB_BY_ID[primary];
  if(!club||h.relegated.includes(primary)) return;
  h.relegated.push(primary);
  h.relegateBanner={short:club.short,name:club.name,t:0};
  SFX.tootToot();
  S.shake=Math.max(S.shake,2.5);
}
// resets every per-wave runtime field for whatever h.wave currently is —
// called at run start (wave 1, via beginDefenderRun) and by defAdvanceWave
// for every wave after. Waves no longer run on a fixed clock: h.waveT is a
// per-wave elapsed-time counter (ticked in defUpdateRun, reset here) used
// only to time each wave's own set piece, not to decide when the wave ends.
function defWaveReset(){
  const h=S.def; if(!h) return;
  h.waveT=0; h.bossSpawned=false;
  // this wave's set piece (pack/boss/dual_elite/surge/final) hasn't fired
  // yet — these all reset per wave, not per run
  h.eventDone=false; h.breathT=0; h.surgeT=0; h.finalBossPending=false; h.finalSurgeDone=false;
  h.conceded=0; h.waveSpawned=0; h.spawnT=0;
  const wd=H_WAVES[h.wave-1]||H_WAVES[9];
  SFX.crowdRoar(Math.min(1,h.wave/7)); defBurst(h.x,h.y,H_TEAMS[wd.team],14);
}
// true once this wave's ordinary spawner has issued its full squad quota
// AND (if the wave has a set piece) that set piece has actually fired —
// wave 10's own full-time surge is a second independent trigger on top of
// its boss event, so both have to have gone off before spawning reads "done"
function defWaveSpawningDone(){
  const h=S.def; if(!h) return false;
  const wd=H_WAVES[h.wave-1]||H_WAVES[9];
  if (h.waveSpawned<wd.min) return false;
  if (wd.event && wd.event!=='none' && !h.eventDone) return false;
  if (wd.event==='final' && wd.surgeAt!=null && !h.finalSurgeDone) return false;
  return true;
}
// the wave clears — a squad wipe, never a ball SMACK — once spawning is done,
// every squad body (anything but a rush mob) is dead, and no breather/surge
// timer is still running out its own beat
function defWaveClear(){
  const h=S.def; if(!h) return false;
  if (!defWaveSpawningDone()) return false;
  if (h.breathT>0 || h.surgeT>0) return false;
  // hp>0, not just array membership — a body killed earlier this same frame
  // still sits in h.enemies until the alive-filter runs later in the tick
  return !h.enemies.some(e=>e.type!=='rush'&&e.hp>0);
}
// advances past the wave that just cleared: relegates its club, then either
// moves on to the next wave's data or — past wave 10 — keeps replaying wave
// 10's own data as an endless final stage (there is no wave 11 to reach)
function defAdvanceWave(){
  const h=S.def; if(!h) return;
  defRelegate(h.wave-1);
  if (h.wave<H_WAVES.length) h.wave++;
  else h.wave10Relegated=true;   // no wave 11 to advance into — flag the final-wave completion for the HUD/tests
  defWaveReset();
  // the big WAVE N / club banner (drawn in drawHoolRun while h.waveT<2.8)
  // carries the announcement — no separate toast needed
}
function defSpawnBoss(){const h=S.def;if(h.bossSpawned||h.wave<3)return;h.bossSpawned=true;defEnemySpawn('ultra',true);const e=h.enemies[h.enemies.length-1];if(e){e.r=13;e.hp*=3.8;e.maxhp=e.hp;e.spd*=.72;e.dmg*=1.8;e.boss=true;e.exitDur=1.0;}pushFeedback(t('defender_boss'),C.RED);SFX.tootToot();S.shake=4;}
// a tight cluster of enemies spread vertically along the enemy net's mouth
// — the "pack" set piece. force:true (like defSpawnBoss) since this is
// only ever 2-3 enemies and is meant to be a guaranteed dramatic beat, not
// silently dropped near the cap
function defSpawnPack(types,count){
  const h=S.def; if(!h||!types||!types.length) return;
  const baseY=H_PITCH_CY+rrange(-30,30);
  for(let i=0;i<count;i++){
    const y=baseY+(i-(count-1)/2)*15;
    defEnemySpawn(types[i%types.length],true,y);
  }
}
// two elites at once — a scaled-up 'ultra' if the wave's roster has reached
// ultra yet, otherwise a beefed bruiser/charger. Flagged .boss so they read
// visually as elite (gold glow + BOSS label); a real 'ultra' still drops its
// usual chest on death via the existing type==='ultra' path in defHitEnemy
function defSpawnDualElite(){
  const h=S.def; if(!h) return;
  const wd=H_WAVES[h.wave-1]||H_WAVES[9];
  const clubs=H_WAVE_CLUBS[Math.max(0,h.wave-1)]||[];
  const baseType=wd.types.includes('ultra') ? 'ultra' : (rnd()<.5?'bruiser':'charger');

    }

// wave 10's own boss — stronger than the regular mid-run boss scaling
function defSpawnFinalBoss(){

  defEnemySpawn('ultra',true);
  const e=h.enemies[h.enemies.length-1];
  if(e){ e.r=16; e.hp*=5.5; e.maxhp=e.hp; e.spd*=.68; e.dmg*=2.1; e.boss=true; e.exitDur=1.1; }

// fires each wave's set piece once, when h.waveT crosses wd.eventAt. Wave
// 10 ('final') has a second, independent trigger at wd.surgeAt for the
// full-time push, and its breather is deliberately gated on the boss's
// death rather than firing the instant it spawns (see defUpdateRun).
function defWaveEvent(wd){
  const h=S.def; if(!h) return;
  if (wd.event && wd.event!=='none' && !h.eventDone && h.waveT>=wd.eventAt){
    h.eventDone=true;
    if (wd.event==='boss'){
      defSpawnBoss(); h.breathT=wd.breathAfter||0;
    } else if (wd.event==='pack'){
      defSpawnPack(wd.packTypes||['bruiser'], wd.packCount||2);
      pushFeedback(t('defender_pack_in'),C.ORANGE);
      h.breathT=wd.breathAfter||0;
    } else if (wd.event==='dual_elite'){
      defSpawnDualElite(); h.breathT=wd.breathAfter||0;
    } else if (wd.event==='surge'){
      h.surgeT=wd.surgeFor||8;
      pushFeedback(t('defender_surge'),C.RED); SFX.tootToot();
    } else if (wd.event==='final'){
      defSpawnFinalBoss(); h.finalBossPending=true;
    }
  }
  if (wd.event==='final' && wd.surgeAt!=null && !h.finalSurgeDone && h.waveT>=wd.surgeAt){
    h.finalSurgeDone=true; h.surgeT=wd.surgeFor||20;
    pushFeedback(t('defender_surge'),C.RED); SFX.tootToot(); S.shake=Math.max(S.shake,3);
  }
}
// Rush mobs ignore the ball entirely and just sprint the player's goal —
// pure flood pressure. They'll briefly tag the player or an orbiting
// Defense unit if one is right in their path, then resume the goal run;
// they never claim, ring, or otherwise react to a ball (see defEnemyAim).
function defRushAim(e){
  const h=S.def;
  let nearest=null, nd=20*20;
  const pd=(h.x-e.x)*(h.x-e.x)+(h.y-e.y)*(h.y-e.y);
  if (pd<nd){ nd=pd; nearest={x:h.x,y:h.y}; }
  for (const c of h.crew){
    if (c.id!=='defense') continue;
    const cd=(c.x-e.x)*(c.x-e.x)+(c.y-e.y)*(c.y-e.y);
    if (cd<nd){ nd=cd; nearest={x:c.x,y:c.y}; }
  }
  return nearest ? {x:nearest.x,y:nearest.y,spd:1} : {x:H_PLAYER_GOAL.x,y:H_PLAYER_GOAL.y,spd:1};
}
// Ball-aware enemy brain. Returns the point this enemy wants to move toward
// this frame (plus a speed multiplier), and drives the carrier's periodic
// drive/pass/hold/shoot decision. Deliberately a small weighted state
// machine rather than real tactics — at 288x432 anything subtler is
// invisible, and the read we want is "a travelling knot of kits around the
// ball", not a simulation.
function defEnemyAim(e,dt){
  const h=S.def;
  // ── carrier: decide what to do with it every onBallT seconds ──
  if (e.carryingBall){
    e.pState='on_ball';
    e.onBallT-=dt;
    // how boxed-in the carrier is right now — drives hold vs drive vs shoot
    let pressure=0;
    if (Math.hypot(h.x-e.x,h.y-e.y)<52) pressure++;
    for (const c of h.crew){ if(Math.hypot(c.x-e.x,c.y-e.y)<52) pressure++; }
    const distToGoal=Math.hypot(H_PLAYER_GOAL.x-e.x,H_PLAYER_GOAL.y-e.y);
    if (e.onBallT<=0){
      e.onBallT=rrange(.4,.7);
      // late waves get greedier: more driving and speculative shooting,
      // less patient holding
      const aggression=Math.min(1,(h.wave-1)/7);
      if (distToGoal<130 && rnd()<.25+aggression*.45){
        // speculative shot at the mouth
        const ball=e.carryingBall;
        const ty=H_PITCH_CY+rrange(-H_GOAL_MOUTH_H*.3,H_GOAL_MOUTH_H*.3);
        const dx=H_PLAYER_GOAL.x-ball.x, dy=ty-ball.y, d=Math.hypot(dx,dy)||1;
        ball.carrier=null; e.carryingBall=null;
        ball.state='shot'; ball.vx=dx/d*135; ball.vy=dy/d*135; ball.target=null;
        e.pState='advance'; SFX.defKick(); defBurst(ball.x,ball.y,C.WHITE,4);
      } else if (pressure>=2 || (pressure>=1 && rnd()<.5-aggression*.3)){
        // boxed in — look for a teammate in a better spot and lay it off
        let best=null,bestScore=-1e9;
        for (const o of h.enemies){
          if (o===e||o.hp<=0||o.state==='exit'||o.carryingBall) continue;
          const od=Math.hypot(o.x-e.x,o.y-e.y);
          if (od>10+40*(1+h.wave*.12)||od<16) continue;
          // prefer someone further up the pitch (lower x) and less crowded
          let crowd=Math.hypot(h.x-o.x,h.y-o.y)<50?1:0;
          for (const c of h.crew) if(Math.hypot(c.x-o.x,c.y-o.y)<50) crowd++;
          const score=(e.x-o.x)*1.4 - crowd*45 - od*.25;
          if (score>bestScore){ bestScore=score; best=o; }
        }
        if (best){
          const ball=e.carryingBall;
          // lead the pass slightly so it looks played into space
          const tx=best.x+(best.x-e.x)*.12, ty=best.y+(best.y-e.y)*.12;
          const dx=tx-ball.x, dy=ty-ball.y, d=Math.hypot(dx,dy)||1;
          ball.carrier=null; e.carryingBall=null;
          ball.state='pass'; ball.target=best; ball.vx=dx/d*115; ball.vy=dy/d*115;
          best.pState='receive';
          e.pState='ring'; SFX.defBallTouch(); defBurst(ball.x,ball.y,C.CHALKDIM,3);
        }
      }
      // otherwise: keep driving (fall through)
    }
    if (e.carryingBall){
      // shield up when swarmed, otherwise run at the goal
      if (pressure>=2) return { x:e.x+(e.x-h.x)*.3, y:e.y+(e.y-h.y)*.3, spd:.45 };
      return { x:H_PLAYER_GOAL.x, y:H_PLAYER_GOAL.y, spd:1.05 };
    }
  }
  // ── find the most interesting ball for this enemy ──
  let loose=null,looseD=1e9, carriedBy=null;
  for (const ball of h.balls){
    if (ball.state==='cleared') continue;
    if (ball.state==='carried'){ carriedBy=ball.carrier; continue; }
    if (ball.state==='loose'||ball.state==='pass'){
      const d=Math.hypot(ball.x-e.x,ball.y-e.y);
      if (d<looseD){ looseD=d; loose=ball; }
    }
  }
  // a pass aimed at me: go meet it
  if (e.pState==='receive'){
    for (const ball of h.balls) if (ball.state==='pass'&&ball.target===e){ return {x:ball.x,y:ball.y,spd:1.15}; }
    e.pState='advance';
  }
  // press a loose ball that's genuinely near me
  if (loose && looseD<110){ e.pState='press'; return {x:loose.x,y:loose.y,spd:1.12}; }
  // teammate has it: form the travelling RING — a moving grunt shield around
  // the carrier, evenly spaced by each body's stable spawn-order slot (so it
  // holds its shape instead of jittering) and biased toward the player's
  // goal, since the ring is escorting the ball forward, not just clustering
  if (carriedBy && carriedBy!==e){
    const d=Math.hypot(carriedBy.x-e.x,carriedBy.y-e.y);
    const ringR=20+Math.min(10,h.wave*1.1);
    if (d<150+ringR){
      e.pState='ring';
      const N=Math.min(7,Math.max(4,4+Math.floor(h.wave/3)));
      const slot=(e.spawnSeq||0)%N;
      const goalAng=Math.atan2(H_PLAYER_GOAL.y-carriedBy.y,H_PLAYER_GOAL.x-carriedBy.x);
      const spread=2.7; // ~155°: a broad arc facing goal-ward, not a full circle
      const ang=goalAng+(N>1?(slot/(N-1)-0.5):0)*spread;
      return { x:carriedBy.x+Math.cos(ang)*ringR, y:carriedBy.y+Math.sin(ang)*ringR, spd:1.0 };
    }
  }
  // ── nothing ball-related: the pre-existing pressure/goal-drive behaviour ──
  e.pState='advance';
  let aimX=h.x, aimY=h.y, bestD=Math.hypot(h.x-e.x,h.y-e.y);
  for (const c of h.crew){ const cd=Math.hypot(c.x-e.x,c.y-e.y); if(cd<bestD){bestD=cd;aimX=c.x;aimY=c.y;} }
  if (bestD>=H_ENEMY_PRESSURE_RANGE){ aimX=H_PLAYER_GOAL.x; aimY=H_PLAYER_GOAL.y; }
  return {x:aimX,y:aimY,spd:1};
}
function defUpdateRun(dt){
  const h=S.def;if(!h)return;
  h.t+=dt;h.waveT+=dt;h.invuln=Math.max(0,h.invuln-dt);h.hitFlash=Math.max(0,h.hitFlash-dt);h.shake=Math.max(0,h.shake-dt*4);
  const wd=H_WAVES[h.wave-1]||H_WAVES[9];
  defWaveEvent(wd);
  h.spawnT-=dt;
  const density=Math.min(2.8,1+h.t/95);
  // ── squad spawner — always gated on the wave's total quota, never on
  // concurrent-alive count, since the wave now only ends on a full wipe ──
  if (h.breathT>0){
    // just had a set piece — a real lull, not another ramp: half rate
    h.breathT=Math.max(0,h.breathT-dt);
    while(h.spawnT<=0&&h.waveSpawned<wd.min&&h.enemies.length<H_MAX_ENEMIES){h.spawnT+=wd.interval*2;defEnemySpawn(wd.types[rint(0,wd.types.length-1)]);}
  } else if (h.surgeT>0){
    h.surgeT=Math.max(0,h.surgeT-dt);
    if (h.surgeT<=0) h.breathT=wd.breathAfter||0;   // surge just ended -> straight into its breather
    const mult=wd.spawnMultDuringEvent||.6;
    while(h.spawnT<=0&&h.waveSpawned<wd.min&&h.enemies.length<H_MAX_ENEMIES){h.spawnT+=(wd.interval*mult)/density;defEnemySpawn(wd.types[rint(0,wd.types.length-1)]);}
    for(let q=0;q<4&&h.waveSpawned<wd.min&&h.enemies.length<H_MAX_ENEMIES;q++) defEnemySpawn(wd.types[rint(0,wd.types.length-1)]);
  } else {
    while(h.spawnT<=0&&h.waveSpawned<wd.min&&h.enemies.length<H_MAX_ENEMIES){
      h.spawnT+=wd.interval/density; defEnemySpawn(wd.types[rint(0,wd.types.length-1)]);
      if (h.waveSpawned<wd.min && rnd()<Math.min(.35,h.t/240)) defEnemySpawn(wd.types[rint(0,wd.types.length-1)]);
    }
    // fast top-up toward the wave's quota at the START of a wave (a fresh
    // pitch shouldn't feel sparse) — only adds up to 4/frame, and only ever
    // toward the quota, never re-topping-up concurrent count once it's spent
    for(let q=0;q<4&&h.waveSpawned<wd.min&&h.enemies.length<H_MAX_ENEMIES;q++) defEnemySpawn(wd.types[rint(0,wd.types.length-1)]);
  }
  // wave clear is a squad wipe, checked once spawning + set pieces are done
  // and every non-rush body is dead — SMACKing the ball never ends a wave
  if (!h.gameover && defWaveClear()) defAdvanceWave();
  // ── rush mobs: pure flood pressure, entirely outside the squad/ball loop
  // — pour from the net in staggered bursts on their own timer, and again
  // (as a punish) right after a SMACK (see defClearBall) ──────────────────
  { const rushEnabled = h.wave>=2 || h.waveT>40;
    if (rushEnabled){
      h.rushPourT-=dt;
      if (h.rushPourT<=0){
        defQueueRushBurst(rint(3+Math.floor(h.wave/3),6+Math.floor(h.wave/3)));
        h.rushPourT=Math.max(2.5,9-h.wave*0.6);
      }
    }
    for (let i=h.rushQueue.length-1;i>=0;i--){
      h.rushQueue[i]-=dt;
      if (h.rushQueue[i]<=0){ defEnemySpawn('rush',true); h.rushQueue.splice(i,1); }
    }
  }
  // ── possession ball ─────────────────────────────────────────────────
  // Exactly one live (non-cleared) ball at all times: the opposition always
  // has one, you SMACK it gone forever, and they feed a fresh one from the
  // net after a short (wave-scaled) delay — see defClearBall for the timer.
  { const activeBall = h.balls.find(b=>b.state!=='cleared');
    h.ballSpawnT-=dt;
    if (!activeBall && h.ballSpawnT<=0){
      defSpawnBall(H_ENEMY_NET_X-rrange(4,14), H_PITCH_CY+rrange(-30,30));
    }
  }
  // Shoulder Barge owns h.x/h.y for its lunge-shove-return duration; while
  // it's running, skip joystick/keyboard input entirely so the jolt reads
  // clean instead of fighting the player's held stick. Same for the
  // stationary Throw-In's placement mode (§4) — the ghost owns the pointer
  // instead of the joystick then.
  const bargeOwnsMovement = defUpdateBarge(h, dt);
  const placing = !!(h.placeMode && h.placeMode.active);
  let ix=0,iy=0, sp=defSpeed();
  if (!bargeOwnsMovement && !placing){
    // player input: virtual joystick (offset from where the finger went down,
    // not from the player — a real stick, not "walk toward wherever I tapped"),
    // then keyboard, with a soft deadzone and linear ramp to full speed
    if (h.joystick.active){
      const maxR=36, dead=6;
      const jdx=h.joystick.curX-h.joystick.originX, jdy=h.joystick.curY-h.joystick.originY;
      const mag=Math.hypot(jdx,jdy);

function defBuy(kind){
  const h=S.def,meta=S.defMeta;
  if (kind==='kickball'){
    if (meta.kickball) return false;
    if (h.tokens<28) return false;
    h.tokens-=28; meta.kickball=true; h.weapons.push({id:'kickball',level:1,cdT:0});
    pushFeedback(t('defender_kickball'),C.GOLD2);
  } else if (kind==='defense'){
    // the one orbital role — bought straight into the ring, never planted
    const spec=H_CREW.defense;
    if (h.tokens<spec.cost) return false;
    if (h.crew.filter(c=>c.id==='defense').length>=2){ pushFeedback(t('defender_defense_cap'),C.GREY); return false; }
    h.tokens-=spec.cost; meta.crew.defense=(meta.crew.defense||0)+1;
    h.crew.push(defMakeDefenseUnit('defense', 1+Math.floor(meta.crew.defense/3), 0));
    pushFeedback(t('defender_defense_added'),C.GOLD2); spawnConfetti(10); S.shake=1.5; SFX.defCoin(); buzz(35);
  } else if (H_CREW[kind]){
    // every other role is a drag-placed tower
    if (kind==='throwin' && h.crew.filter(c=>c.id==='throwin').length>=2){ pushFeedback(t('defender_unit_cap'),C.GREY); return false; }
    if (h.crew.filter(c=>c.id!=='defense').length>=8){ pushFeedback(t('defender_unit_cap'),C.GREY); return false; }
    if (h.tokens<H_CREW[kind].cost) return false;
    h.placeMode = { active:true, id:kind, x:h.x, y:h.y, cost:H_CREW[kind].cost };
    gotoScene('DEFENDER_RUN');
    pushFeedback(t('defender_place_hint'),C.GOLD2);
    return true;   // token spend happens on actual placement — see defTryPlaceUnit
  } else if (H_PASSIVES[kind]){
    const p=defPassive(kind); if(p&&p.level>=p.max) return false;
    const cost=10+(p?p.level:0)*8; if(h.tokens<cost) return false;
    h.tokens-=cost; defApplyChoice({kind:'passive',id:kind});
    pushFeedback(H_PASSIVES[kind].name+' ▲',C.GOLD2); SFX.correct();
  } else return false;
  saveGame(); return true;
}

// the joystick itself is drawn in screen space at the finger's origin (see
// drawHoolJoystick, called from drawHoolRun after the camera transform is

function drawHoolJoystick(){

// shared pitch-marking geometry — used by both the world pitch (RUN, under
// the camera) and the static intro backdrop, scaled to whatever rect it's
// given, so the two contexts read as the same football pitch
function drawPitchMarkings(r){
  const cx=(r.x0+r.x1)/2, cy=(r.y0+r.y1)/2, w=r.x1-r.x0, hh=r.y1-r.y0;
  const boxBigD=Math.min(66,w*0.22), boxBigH=Math.min(220,hh*0.55);
  const boxSmallD=Math.min(26,w*0.09), boxSmallH=Math.min(130,hh*0.32);
  const spotD=Math.min(54,w*0.18), centerR=Math.min(50,w*0.16,hh*0.42);
  b.save(); b.strokeStyle=C.CHALK; b.lineWidth=1.4; b.strokeRect(r.x0,r.y0,w,hh); b.restore();
  line(cx,r.y0,cx,r.y1,C.CHALK);
  ring(cx,cy,centerR,C.CHALK,1.2);
  rect(cx-1.2,cy-1.2,2.4,2.4,C.CHALK);
  b.save(); b.strokeStyle=C.CHALKDIM; b.lineWidth=1;
  b.strokeRect(r.x0,cy-boxBigH/2,boxBigD,boxBigH);
  b.strokeRect(r.x0,cy-boxSmallH/2,boxSmallD,boxSmallH);
  b.strokeRect(r.x1-boxBigD,cy-boxBigH/2,boxBigD,boxBigH);
  b.strokeRect(r.x1-boxSmallD,cy-boxSmallH/2,boxSmallD,boxSmallH);
  b.restore();
  rect(r.x0+spotD-1,cy-1,2,2,C.CHALK);
  rect(r.x1-spotD-1,cy-1,2,2,C.CHALK);
  const cr=Math.min(8,w*0.03);
  [[r.x0,r.y0,0,Math.PI/2],[r.x1,r.y0,Math.PI/2,Math.PI],[r.x1,r.y1,Math.PI,Math.PI*1.5],[r.x0,r.y1,Math.PI*1.5,Math.PI*2]]
    .forEach(([ccx,ccy,a0,a1])=>{ b.save(); b.strokeStyle=C.CHALKDIM; b.lineWidth=1; b.beginPath(); b.arc(ccx,ccy,cr,a0,a1); b.stroke(); b.restore(); });
}
// posts + net, matching drawGoalAndTarget's clipped sparse-grid net —
// decorative + a chest anchor, never solid: the player/enemies pass through
function drawPitchGoal(r, side, mouthH){
  const x0 = side==='L' ? r.x0 : r.x1, dir = side==='L' ? -1 : 1;
  const depth = Math.max(14,(r.x1-r.x0)*0.07), cy=(r.y0+r.y1)/2;
  const yTop=cy-mouthH/2, yBot=cy+mouthH/2, xOuter=x0+dir*depth;
  const rx0=Math.min(x0,xOuter), rx1=Math.max(x0,xOuter);
  b.save(); b.beginPath(); b.rect(rx0,yTop,rx1-rx0,yBot-yTop); b.clip();
  rect(rx0,yTop,rx1-rx0,yBot-yTop,'#0c1526');
  for(let x=rx0;x<=rx1;x+=6) line(x,yTop,x,yBot,C.NET);
  for(let y=yTop;y<=yBot;y+=6) line(rx0,y,rx1,y,C.NET);
  for(let x=rx0;x<=rx1;x+=18) line(x,yTop,x,yBot,C.NET2);
  b.restore();
  rect(x0-1.5,yTop-2,3,4,C.POST); rect(x0-1.5,yBot-2,3,4,C.POST);
  ring(x0,yTop,2,C.POSTSH,1); ring(x0,yBot,2,C.POSTSH,1);
}
// very low-alpha glow triangles from the top of the world — same idea as

  b.beginPath(); b.moveTo(H_WORLD.x1-40,H_WORLD.y0); b.lineTo(H_PITCH_CX+20,H_PITCH.y1); b.lineTo(H_WORLD.x1+20,H_PITCH.y1); b.closePath(); b.fill();

// fixed, deterministic blade candidates spread across the world — a cheap
// hash, NOT the shared seeded rnd() (that's gameplay RNG and must stay
// untouched by decoration). Filtered to the visible camera window and hard
// -capped at draw time so a big world never means a big per-frame cost.
const H_GRASS_CANDIDATES = (()=>{
  const out=[];
  for (let i=0;i<260;i++){
    const hx=((i*2654435761)>>>0), hy=((i*40503+i*97)>>>0);
    out.push({
      x: H_WORLD.x0+(hx%10007)/10007*(H_WORLD.x1-H_WORLD.x0),
      y: H_WORLD.y0+(hy%9973)/9973*(H_WORLD.y1-H_WORLD.y0),
      ph:(hx%628)/100, spd:1.0+(hy%50)/100
    });
  }
  return out;
})();
function drawHoolGrass(h){
  if (S.reduceMotion) return;
  const camHalfW=(W/2)/h.zoom, camHalfH=((H-H_ARENA.y)/2)/h.zoom;
  const vx0=h.camX-camHalfW-10, vx1=h.camX+camHalfW+10, vy0=h.camY-camHalfH-10, vy1=h.camY+camHalfH+10;
  let drawn=0;
  b.save(); b.strokeStyle='rgba(255,255,255,0.10)'; b.lineWidth=1;
  for (const g of H_GRASS_CANDIDATES){
    if (drawn>=110) break;
    if (g.x<vx0||g.x>vx1||g.y<vy0||g.y>vy1) continue;
    const sway=Math.sin(S.t*g.spd+g.x*0.08+g.y*0.05)*1.1;
    b.beginPath(); b.moveTo(g.x,g.y); b.lineTo(g.x+sway,g.y-3.4); b.stroke();
    drawn++;
  }
  b.restore();
}

// the RUN pitch spans the whole (larger-than-viewport) H_WORLD rect, drawn

// Defense units are drawn as small kit-wearing people at their own AI-owned
// x/y (defUpdateDefenseUnit moves them — this function only reads position,
// it never computes it), not abstract dots orbiting the player. Role prop
// (shoulder pads / ball at feet / flag / planted post) so each type reads
// at a glance. c.pop (0->1 over .35s) scales a fresh hire in rather than
// popping it into existence instantly. Anchored (THROW-IN) units skip the
// idle bob — they're planted, not bouncing on the spot.
function drawHoolCrewMember(c,idx){
  const spec=H_CREW[c.id];
  const x=c.x, y=c.y;
  const bob=(S.reduceMotion||c.anchored)?0:Math.sin(S.t*7+c.phase)*.55;
  const pop=c.pop==null?1:c.pop, popScale=pop<1?Math.sin(Math.min(1,pop)*Math.PI/2):1;
  if(popScale<=0.02) return;
  const seed=idx*7+((c.id.charCodeAt(0)||0)*3);
  const skin=SKINS[seed%SKINS.length], hair=HAIRS[(seed+2)%HAIRS.length];
  const s=.78*popScale;
  if (c.hp<c.maxhp){ rect(x-8,y-16,16,2,'#18233a'); rect(x-8,y-16,16*Math.max(0,c.hp/c.maxhp),2,C.GREEN); }
  b.save(); b.translate(x,y+bob); b.scale(s,s);
  b.globalAlpha=.22; b.fillStyle='#04140b'; b.beginPath(); b.ellipse(0,7.5,7,2.3,0,0,6.2832); b.fill(); b.globalAlpha=1;
  rect(-4.2,-4.2,8.4,9,spec.col); rect(-4.2,-4.2,8.4,2,C.WHITE);
  circ(0,-7,3,skin); rect(-2.8,-9.4,5.6,2.4,hair);
  rect(-5.2,-2.6,1.9,3.2,spec.col); rect(3.3,-2.6,1.9,3.2,spec.col);
  rect(-3.5,4.4,2.6,2.7,'#16203a'); rect(.9,4.4,2.6,2.7,'#16203a');
  rect(-3.6,6.9,2.9,1.6,'#111318'); rect(.7,6.9,2.9,1.6,'#111318');
  if(c.id==='defense'){
    rect(-6.4,-3.6,2.6,3.4,C.WHITE); rect(3.8,-3.6,2.6,3.4,C.WHITE);
  } else if(c.id==='striker'){
    if(!S.reduceMotion&&Math.sin(S.t*3+c.phase)>0.3) circ(3.6,7.4,1.6,C.WHITE);
  } else if(c.id==='flag'){
    rect(4.4,-13.5,1.1,15,'#8a6a38');
    const wave=S.reduceMotion?0:Math.sin(S.t*6+c.phase)*1.2;
    rect(5.5,-13.5+wave*.3,6.4,5.4,spec.col);
    rect(5.5,-13.5+wave*.3,6.4,1.6,C.WHITE);
  } else if(c.id==='throwin'){
    rect(-1.1,-14,2.2,15.5,'#5a4326'); rect(-5,-12.4,10,2.6,spec.col);
  }
  b.restore();
}

function drawHoolRun(){const h=S.def;

  b.translate(camCx,camCy); b.scale(h.zoom,h.zoom); b.translate(-h.camX,-h.camY);

/* ═══════════════════════════════════════════════════════════
   UPDATE — fixed timestep
   ═══════════════════════════════════════════════════════════ */
const DT = 1/120;
let tickAcc = 0, lastTickSound = 0;

function update(dt){
  if (S.settingsOpen){ S.saveFlashT = Math.max(0, S.saveFlashT - dt*0.8); return; }
  if (S.devPinOpen || S.devMenuOpen){ S.devPinShakeT = Math.max(0, S.devPinShakeT - dt*2.5); return; }
  S.t += dt; S.sceneT += dt;
  updateAchToasts(dt);
  S.shareFlashT = Math.max(0, S.shareFlashT - dt*0.7);
  if(S.tapFX){S.tapFX.t+=dt;if(S.tapFX.t>.36)S.tapFX=null;}
  for(const f of S.feedbackQueue)f.t+=dt;
  S.clubHintT = Math.max(0, S.clubHintT - dt*0.7);
  // momentum scroll: only once the finger's lifted (dragY===null) and there's
  // still some velocity left on the badge grids — decays smoothly to a stop
  // rather than the drag just cutting off dead at release
  if (dragY === null && (SCROLLABLE_SCENES.includes(S.scene) || S.devMenuOpen) && !hubOverlayBlocksScroll() && Math.abs(scrollVel) > 1){
    scrollAdd(scrollVel*dt);
    scrollVel *= Math.pow(0.02, dt);
    if (Math.abs(scrollVel) < 1) scrollVel = 0;
  }
  if (S.transition.dur > 0){
    S.transition.t += dt;
    const half = S.transition.dur/2;
    if (S.transition.pending && S.transition.t >= half){
      const nxt = S.transition.pending; S.transition.pending = null; nxt();
    }
    if (S.transition.t >= S.transition.dur){ S.transition.dur = 0; S.transition.t = 0; }
  }
  S.shake = Math.max(0, S.shake - dt*14);
  S.flash = Math.max(0, S.flash - dt*2.4);
  S.aberr = Math.max(0, S.aberr - dt*1.4);
  S.inflate = Math.max(0, S.inflate - dt*1.8);
  S.streakBreak = Math.max(0, S.streakBreak - dt*2);
  S.crowdHype = Math.max(0, S.crowdHype - dt*0.42);
  S.gloom = Math.max(0, S.gloom - dt*0.45);
  if (S.perfect.active){ S.perfect.t += dt; if (S.perfect.t > 1.5) S.perfect.active = false; }
  if (S.hattrick.active){ S.hattrick.t += dt; if (S.hattrick.t > 1.5) S.hattrick.active = false; }
  if (S.safetyNet.active){ S.safetyNet.t += dt; if (S.safetyNet.t > 1.5) S.safetyNet.active = false; }
  if (S.crowdBurst){
    const b = S.crowdBurst;
    if (S.t - b.startT > (b.count-1)*b.spacing + b.dur + 0.2) S.crowdBurst = null;
  }
  if (S.cheats.discomode){                              // cheat: the party never stops
    S.crowdHype = Math.max(S.crowdHype, 0.75);
    S.discoTimer -= dt;
    if (S.discoTimer <= 0){ S.discoTimer = 1.3; spawnConfetti(12); triggerCrowdBurst(); }
  }
  if (S.confetti.length){
    for (const p of S.confetti){ p.y += p.vy*dt; p.x += Math.sin(S.t*2+p.ph)*p.sway*dt*14; }
    S.confetti = S.confetti.filter(p => p.y < H+10);
  }

  if (S.scene === 'CREATE'){ updateCreateShow(dt); return; }

  for (const w of S.windParts){
    w.x += S.windDir * (S.wind*0.9 + 6) * w.s * dt;
    if (w.x > W+6) w.x = -6; if (w.x < -6) w.x = W+6;
  }
  for (const p of S.smokePuffs){
    p.x += p.sp*dt; p.ph += dt*0.7;
    if (p.x < -50) p.x = W+50; if (p.x > W+50) p.x = -50;
  }

  if (S.scene === 'QUESTION'){
    if (!S.qResolved){
      S.qTimer -= dt;
      if (S.qTimer <= 0){ S.qPick = -1; S.qResolved = true; S.qRevealT = 0; S.qWasRight = false; }
    } else {
      const before = S.qRevealT;
      S.qRevealT += dt;
      if (before < REVEAL_OPP && S.qRevealT >= REVEAL_OPP) SFX.oppPick();
      if (!S.oppApplied && S.qRevealT >= REVEAL_ANS){ S.oppApplied = true; applyQuestion(); }
      if (S.qRevealT >= REVEAL_END) gotoScene('READY');
    }
    return;
  }

  if (S.scene==='KU_INTRO' || S.scene==='KU_READY' || S.scene==='KU_PLAY' || S.scene==='KU_HATTRICK' ||
      S.scene==='KU_SAFETYNET' || S.scene==='KU_BICYCLE' || S.scene==='KU_CHEST' || S.scene==='KU_OVER'){
    updateKeepyups(dt);
    return;
  }

  if (S.scene==='DEFENDER_INTRO'){ return; }
  if (S.scene==='DEFENDER_RUN'){ defUpdateRun(dt); return; }
  if (S.scene==='DEFENDER_LEVELUP' || S.scene==='DEFENDER_SHOP' || S.scene==='DEFENDER_OVER'){ return; }

  if (S.keeperOn && S.scene!=='QUESTION' && S.scene!=='ROUNDCARD' && S.scene!=='RESOLVE')
    S.keeperU = keeperAt(S.t);

  // he runs up during the power phase, then settles over the ball
  if (S.scene === 'P_POWER') S.runT = Math.min(1, S.runT + dt/RUN.dur);

  // the swing — contact resolves at the end of it, so the keeper and a
  // moving target are read at the true moment of contact
  if (S.scene === 'STRIKE'){
    if (S.sceneT >= STRIKE_DUR){ resolveShot(); gotoScene('FLIGHT'); }
    return;
  }

  // the 10s clock spans all three taps — aim, power, accuracy
  const timerRunning = S.scene==='AIM'||S.scene==='P_POWER'||S.scene==='P_ACCURACY';
  if (timerRunning){
    S.clock -= dt;
    // clock ticks
    if (S.clock < 3 && S.t - lastTickSound > 0.25){ SFX.tick(true); lastTickSound = S.t; }
    else if (S.clock >= 3 && S.t - lastTickSound > 0.5){ SFX.tick(false); lastTickSound = S.t; }
    if (S.clock <= 0){
      if (!S.aimSet){ const tp = targetAt(S.t); S.aimU = tp.u; S.aimV = tp.v; S.aimSet = true; }
      S.lockP = S.lockP||0.4; S.lockA = S.lockA||1.6;   // sails wide
      S.clock = 0; S.clockAtLock = 0; gotoScene('STRIKE'); return;
    }
    // marker motion — only the power and accuracy meters actually move
    const gaugeMoving = S.scene==='P_POWER'||S.scene==='P_ACCURACY';
    if (gaugeMoving){
      const card = CARDS[S.round];
      let speed = 1.0 * card.tempo * (S.cond.fast || 1);
      if (S.scene === 'P_POWER')    speed *= 0.95;
      if (S.scene === 'P_ACCURACY') speed *= 0.78;
      let j = 0;
      if (S.cond.jitter) j = (rnd()-0.5) * S.cond.jitter * 0.02;
      S.gauge += S.gaugeDir * speed * dt + j;
      if (S.gauge >= 1){ S.gauge = 1; S.gaugeDir = -1; }
      if (S.gauge <= 0){ S.gauge = 0; S.gaugeDir = 1; }
    }
  }

  if (S.scene === 'FLIGHT'){
    const bl = S.ball;
    bl.t += dt;
    const k = Math.min(1, bl.t / bl.dur);
    const ease = k;
    const x = bl.from.x + (bl.to.x - bl.from.x)*ease + Math.sin(k*Math.PI) * bl.curl * 140;
    const y = bl.from.y + (bl.to.y - bl.from.y)*ease - Math.sin(k*Math.PI)*10;
    S.trail.push({x, y, a:1});
    if (S.trail.length > 22) S.trail.shift();
    for (const p of S.trail) p.a -= dt*2.4;
    if (k >= 1 && !bl.done){ bl.done = true; applyResult(); gotoScene('RESOLVE'); }
  }

  if (S.scene === 'RESOLVE' && S.sceneT > 2.4) advance();
}
function nonAnswer(){ // timed out — pick nothing, count as wrong
  const wrongIdx = S.q.opts.findIndex(o=>!o.correct);
  return wrongIdx;
}

function drawBall(x,y,r){
  circ(x, y, r, C.WHITE);
  b.save(); b.globalAlpha = 0.92;                       // panels, so 16px reads as a football
  circ(x,             y - r*0.16, r*0.30, '#191d27');
  circ(x - r*0.64,    y + r*0.48, r*0.21, '#191d27');
  circ(x + r*0.64,    y + r*0.48, r*0.21, '#191d27');
  b.restore();
  circ(x - r*0.34, y - r*0.44, r*0.30, '#ffffff');
  ring(x, y, r, '#8f9ab0', 1);
}
function rect(x,y,w,h,c){ b.fillStyle=c; b.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function line(x0,y0,x1,y1,c){ b.strokeStyle=c; b.lineWidth=1; b.beginPath();
  b.moveTo(Math.round(x0)+0.5,Math.round(y0)+0.5); b.lineTo(Math.round(x1)+0.5,Math.round(y1)+0.5); b.stroke(); }
function circ(x,y,r,c){ b.fillStyle=c; b.beginPath(); b.arc(x,y,r,0,6.2832); b.fill(); }
function ring(x,y,r,c,w){ b.strokeStyle=c; b.lineWidth=w||1; b.beginPath(); b.arc(x,y,r,0,6.2832); b.stroke(); }
function txt(s,x,y,c,size,align,weight){
  b.fillStyle=c; b.font=(weight||'bold')+' '+(size||8)+'px ui-monospace, Menlo, Consolas, monospace';
  b.textAlign=align||'left'; b.textBaseline='top'; b.fillText(s, Math.round(x), Math.round(y));
}
// like txt(), but shrinks the font until it fits maxWidth — some translations
// run longer than English and this file has several fixed single-line labels
// hard-truncate with an ellipsis — for grid cells where shrinking the
// font isn't enough and the text must simply not leave its box
function txtClip(s,x,y,c,size,maxWidth,align,weight){
  b.font=(weight||'bold')+' '+size+'px ui-monospace, Menlo, Consolas, monospace';
  let out = s;
  if (b.measureText(out).width > maxWidth){
    while (out.length > 1 && b.measureText(out+'…').width > maxWidth) out = out.slice(0,-1);
    out += '…';
  }
  txt(out,x,y,c,size,align,weight);
}
function txtFit(s,x,y,c,maxSize,maxWidth,align,weight){
  let size = maxSize;
  b.font=(weight||'bold')+' '+size+'px ui-monospace, Menlo, Consolas, monospace';
  while (size > 5 && b.measureText(s).width > maxWidth) size--, b.font=(weight||'bold')+' '+size+'px ui-monospace, Menlo, Consolas, monospace';
  txt(s,x,y,c,size,align,weight);
}
function wrapText(s, max, size){
  const words = (s||'').split(' '); const lines=[]; let cur='';
  b.font='bold '+(size||9)+'px ui-monospace, Menlo, Consolas, monospace';
  for (const w of words){
    const test = cur ? cur+' '+w : w;
    if (b.measureText(test).width > max && cur){ lines.push(cur); cur=w; } else cur=test;
  }
  if (cur) lines.push(cur);
  return lines;
}
// wrapText(), but hard-capped at maxLines — the last line gets ellipsized
// instead of quietly overflowing past its box, which is what txtFit's
// font-shrinking used to do once it hit its minimum size floor
function wrapTextClamped(s, max, size, maxLines){
  const lines = wrapText(s, max, size);
  if (lines.length <= maxLines) return lines;
  const out = lines.slice(0, maxLines);
  let last = out[maxLines-1];
  b.font='bold '+(size||9)+'px ui-monospace, Menlo, Consolas, monospace';
  while (last.length > 1 && b.measureText(last+'…').width > max) last = last.slice(0,-1);
  out[maxLines-1] = last+'…';
  return out;
}
function txtBlock(lines, cx, y, c, size, lineH, align){
  lines.forEach((l,i)=> txt(l, cx, y+i*lineH, c, size, align||'center'));
  return y + lines.length*lineH;
}
function dither(x,y,w,h,c,step){ b.fillStyle=c; const st=step||2;
  for(let j=0;j<h;j+=1) for(let i=(j%st);i<w;i+=st) b.fillRect(Math.round(x+i),Math.round(y+j),1,1); }

/* ── ROLLING BANNER — a reusable big-callout renderer. Letters roll in
   one by one with a little overshoot, then shimmer as a travelling
   wave until the callout fades. Same chunky gold/white palette
   everywhere it's used: PERFECT SHOT, HAT-TRICK, N STREAK…          ── */
function drawRollingBanner(word, t, opts){
  const o = opts || {};
  const cw = o.cw || 15, fontPx = o.fontPx || 13;
  const totalW = word.length * cw;
  const baseX = W/2 - totalW/2 + cw/2;
  const baseY = o.baseY != null ? o.baseY : 148;
  const inDur = 0.40, fadeStart = o.fadeStart != null ? o.fadeStart : 1.05, fadeDur = 0.30;
  const globalAlpha = t > fadeStart ? Math.max(0, 1 - (t-fadeStart)/fadeDur) : 1;
  if (globalAlpha <= 0) return;
  const colA = o.colA || C.GOLD2, colB = o.colB || C.GOLD, washCol = o.washCol || C.GOLD;

  // a soft colour wash behind the callout
  b.save(); b.globalAlpha = globalAlpha * 0.16 * Math.min(1, t/0.3);
  rect(0, baseY-11, W, 24, washCol);
  b.restore();

  b.save();
  b.font = 'bold '+fontPx+'px ui-monospace, Menlo, Consolas, monospace';
  b.textAlign = 'center'; b.textBaseline = 'middle';
  for (let i=0;i<word.length;i++){
    const ch = word[i];
    if (ch === ' ') continue;
    const delay = i * 0.032;
    const lt = t - delay;
    if (lt < 0) continue;
    let scale, bob;
    if (lt < inDur){
      const k = lt / inDur, kk = k - 1, ov = 1.70158;
      scale = 1 + (kk*kk*((ov+1)*kk + ov));
      bob = 0;
    } else {
      scale = 1;
      bob = Math.sin(t*7 - i*0.55) * 1.5;    // the rolling shimmer
    }
    const x = baseX + i*cw, y = baseY + bob;
    b.save();
    b.globalAlpha = globalAlpha;
    b.translate(x, y);
    b.scale(Math.max(0.01,scale), Math.max(0.01,scale));
    b.fillStyle = '#000000a0';
    b.fillText(ch, 1, 2);
    b.fillStyle = Math.sin(t*6 - i*0.6) > 0 ? colA : colB;
    b.fillText(ch, 0, 0);
    b.restore();
  }
  b.restore();
}
function drawPerfectBanner(){ drawRollingBanner('PERFECT SHOT', S.perfect.t, {baseY:148}); }

/* ── the Mexican wave — a clean, deterministic left-to-right sweep
   that repeats every WAVE_CYCLE seconds. Returns 0..1, the crest's
   height at column x (in buffer/frame pixels) at time t.           */
const WAVE_CYCLE = 11, WAVE_DUR = 2.4, WAVE_WIDTH = 0.30, WAVE_LEAD = 0.82;
function waveBoostFrom(x, t, startT, dur){
  const cyclePos = t - startT;
  if (cyclePos < 0 || cyclePos > dur) return 0;
  const frac = x / W;
  const phase = cyclePos/dur - frac*WAVE_LEAD;
  if (phase < 0 || phase > WAVE_WIDTH) return 0;
  return Math.sin((phase/WAVE_WIDTH) * Math.PI);
}
function waveBoost(x, t){
  return waveBoostFrom(x, t, Math.floor(t/WAVE_CYCLE)*WAVE_CYCLE, WAVE_DUR);
}
// an on-demand burst of several quick successive waves — "the crowd goes wild"
function triggerCrowdBurst(){ S.crowdBurst = { startT: S.t, count: 3, spacing: 0.85, dur: 1.7 }; }
function burstWaveBoost(x, t){
  const bst = S.crowdBurst; if (!bst) return 0;
  let sum = 0;
  for (let k=0; k<bst.count; k++) sum += waveBoostFrom(x, t, bst.startT + k*bst.spacing, bst.dur);
  return Math.min(1.4, sum);
}

/* ── stadium ───────────────────────────────────────────────── */
function drawStadium(){
  const dark = S.cond.dark ? 0.55 : 1;
  rect(0,44,W,42, C.SKY);
  // stands + crowd noise texture
  rect(0,52,W,34, C.STAND2);
  const hype = S.crowdHype;
  for (let i=0;i<W;i+=2){
    const hh = 10 + ((i*7919)%11);
    const hash = ((i*2654435761)>>>0);
    // a calm baseline murmur — the real spectacle is the wave below
    const ph = (hash%628)/100, spd = 1.1 + (hash%5)*0.10;
    const idle = Math.sin(S.t*spd + ph) * 0.5;
    const wave = (waveBoost(i, S.t) + burstWaveBoost(i, S.t)) * 11;   // the Mexican wave crest(s)
    const j = idle + wave + (hype > 0 ? Math.max(0, Math.sin(S.t*17 + i*0.55) * hype * 4) : 0);
    const lit = wave > 6.5 || (hype > 0.55 && hash%5===0 && Math.sin(S.t*13 + i) > 0);
    // a lit crest keeps per-person variation, otherwise the wave renders
    // as one flat bright slab across the stand instead of a row of people
    const litCol = hash%3===0 ? '#b9d6f7' : (hash%3===1 ? '#8fbdec' : '#7ba9d8');
    rect(i, 76-hh-j, 2, hh+j, lit ? litCol : (hash%3===0 ? C.CROWD2 : C.CROWD1));
  }
  {    // scarves, arms and banners above the heads — mostly quiet, rise with the wave or the hype
    b.save(); b.globalAlpha = Math.min(0.55, 0.08 + hype*0.55);
    for (let i=1;i<W;i+=7){
      const ph = ((i*137)%628)/100;
      const wave = waveBoost(i, S.t) + burstWaveBoost(i, S.t);
      const y = 60 - Math.abs(Math.sin(S.t*(1.8+(i%5)*0.2) + ph)) * (1.2 + hype*4.4) - wave*10;
      const big = hype > 0.75;                        // banners come out when it's really going off
      rect(i, y, big?2:1, big?5:3, ((i*40503)>>>0)%2 ? C.GOLD : '#c8d5f0');
    }
    b.restore();
  }
  dither(0,52,W,26, C.CROWD3, 3);
  // floodlight glow
  if (!S.cond.dark){
    b.save(); b.globalAlpha=0.10; b.fillStyle='#9fd0ff';
    b.beginPath(); b.moveTo(20,52); b.lineTo(120,300); b.lineTo(-30,300); b.closePath(); b.fill();
    b.beginPath(); b.moveTo(268,52); b.lineTo(320,300); b.lineTo(170,300); b.closePath(); b.fill();
    b.restore();
  }
  // turf bands
  rect(0,86,W,H-86, C.TURF3);
  for (let y=86; y<H; y+=1){
    const k = (y-86)/(H-86);
    const c = k<0.3 ? C.TURF3 : (Math.floor((y-86)/9)%2===0 ? C.TURF1 : C.TURF2);
    rect(0,y,W,1, c);
  }
  rect(0,300,W,H-300, C.TURFLO);
  for (let y=300;y<H;y+=1){ if (Math.floor((y-300)/7)%2===0) rect(0,y,W,1,'#0f4028'); }
  // penalty box lines in perspective
  line(6, 232, GOAL.x0-16, 226, C.CHALKDIM);
  line(W-6, 232, GOAL.x1+16, 226, C.CHALKDIM);
  line(GOAL.x0-16, 226, GOAL.x1+16, 226, C.CHALKDIM);
  // spot
  rect(SPOT.x-3, SPOT.y+8, 7, 2, C.CHALK);
}

/* ── goal, net, target, keeper, ball ───────────────────────── */
function drawGoalAndTarget(){
  // net
  b.save();
  b.beginPath(); b.rect(GOAL.x0, GOAL.y0, GW, GH); b.clip();
  rect(GOAL.x0, GOAL.y0, GW, GH, '#0c1526');
  for (let x=GOAL.x0; x<=GOAL.x1; x+=6) line(x, GOAL.y0, x, GOAL.y1, C.NET);
  for (let y=GOAL.y0; y<=GOAL.y1; y+=6) line(GOAL.x0, y, GOAL.x1, y, C.NET);
  for (let x=GOAL.x0; x<=GOAL.x1; x+=24) line(x, GOAL.y0, x, GOAL.y1, C.NET2);
  b.restore();

  // an inviting pulse round the mouth while you're picking your spot
  if (S.scene === 'AIM'){
    b.save(); b.strokeStyle = C.GOLD2; b.lineWidth = 1;
    b.globalAlpha = 0.35 + 0.35*Math.sin(S.t*6);
    b.strokeRect(GOAL.x0-2.5, GOAL.y0-2.5, GW+5, GH+5);
    b.restore();
  }

  // target
  const tp = targetAt(S.t);
  const tx = u2x(tp.u), ty = v2y(tp.v);
  let R = S.target.r;
  if (S.inflate > 0) R *= 1 + 0.22*Math.sin(S.inflate*Math.PI/0.55);   // springy overshoot
  const vis = S.cond.dark ? 0.55 : 1;
  b.save(); b.globalAlpha = vis;
  circ(tx, ty, R, C.BLUEDK);
  circ(tx, ty, R*0.70, C.RED);
  circ(tx, ty, R*0.42, '#f0efe4');
  circ(tx, ty, R*0.18, C.GOLD);
  const pulse = 0.5 + 0.5*Math.sin(S.t*6);
  circ(tx, ty, R*0.18*(0.55+0.2*pulse), C.GOLD2);
  ring(tx, ty, R, '#0a1220', 1);
  b.restore();
  if (S.round === 1 && S.scene !== 'FLIGHT'){   // motion ghost (low-rank training wheel)
    const g = targetAt(S.t + 0.55);
    b.save(); b.globalAlpha = 0.22; ring(u2x(g.u), v2y(g.v), R, C.GOLD2, 1); b.restore();
  }

  // your aim — a small reticle that sticks where you tapped, so you can
  // see exactly what the power and accuracy meters are about to execute
  if (S.aimSet && S.scene !== 'FLIGHT' && S.scene !== 'RESOLVE'){
    const ax = u2x(S.aimU), ay = v2y(S.aimV);
    const rp = 5.5 + 0.8*Math.sin(S.t*9);
    b.save(); b.strokeStyle = C.GOLD2; b.lineWidth = 1; b.globalAlpha = 0.9;
    b.beginPath();
    b.moveTo(ax-rp, ay); b.lineTo(ax-rp*0.35, ay);
    b.moveTo(ax+rp*0.35, ay); b.lineTo(ax+rp, ay);
    b.moveTo(ax, ay-rp); b.lineTo(ax, ay-rp*0.35);
    b.moveTo(ax, ay+rp*0.35); b.lineTo(ax, ay+rp);
    b.stroke();
    b.restore();
    circ(ax, ay, 1.2, C.GOLD2);
  }

  // keeper — paces, never dives
  if (S.keeperOn){
    const kx = u2x(S.keeperU), kb = v2y(0);
    const kh = 46, kw = 16;
    rect(kx-kw/2, kb-kh, kw, kh, C.KEEP2);
    rect(kx-kw/2, kb-kh, kw, 3, C.KEEP3);
    rect(kx-2, kb-kh-8, 5, 8, C.SKIN);
    rect(kx-kw/2-6, kb-kh+6, 6, 4, C.KEEP1);   // gloves
    rect(kx+kw/2, kb-kh+6, 6, 4, C.KEEP1);
    rect(kx-kw/2, kb-10, kw, 10, C.KEEP3);
    b.save(); b.globalAlpha=0.25; rect(kx-kw/2-2, kb-2, kw+4, 3, '#000'); b.restore();
  }

  // posts on top
  rect(GOAL.x0-4, GOAL.y0-4, GW+8, 4, C.POST);
  rect(GOAL.x0-4, GOAL.y0-4, 4, GH+8, C.POST);
  rect(GOAL.x1, GOAL.y0-4, 4, GH+8, C.POST);
  rect(GOAL.x0-4, GOAL.y0, 2, GH, C.POSTSH);

  // smoke (flares)
  if (S.cond.smoke){
    b.save();
    for (const p of S.smokePuffs){
      const yy = p.y + Math.sin(p.ph)*6;
      b.globalAlpha = 0.30; circ(p.x, yy, p.r, '#5a5f6e');
      b.globalAlpha = 0.16; circ(p.x-6, yy+4, p.r*0.7, '#8c8f9b');
      b.globalAlpha = 0.10; circ(p.x+8, yy-5, p.r*0.55, C.ORANGE);
    }
    b.restore();
    // flare glow from the terrace
    b.save(); b.globalAlpha = 0.14 + 0.05*Math.sin(S.t*9); rect(0,44,W,H-44, C.ORANGE); b.restore();
  }
  if (S.cond.dark){
    b.save(); b.globalAlpha=0.62; rect(0,44,W,H-44, '#02040a'); b.restore();
    // phone torches
    for (let i=0;i<18;i++){
      const x = ((i*61)%W), y = 56 + ((i*37)%18);
      b.save(); b.globalAlpha=0.5+0.4*Math.sin(S.t*3+i); rect(x,y,1,1,'#fff8d0'); b.restore();
    }
  }

  // the man doing the kicking
  drawShooter();

  // ball + trail
  if (S.ball){
    for (const p of S.trail){ if (p.a>0){ b.save(); b.globalAlpha=p.a*0.5; circ(p.x,p.y,4.4*p.a,C.GOLD2); b.restore(); } }
    const bl = S.ball, k = Math.min(1, bl.t/bl.dur);
    const x = bl.from.x + (bl.to.x-bl.from.x)*k + Math.sin(k*Math.PI)*bl.curl*140;
    const y = bl.from.y + (bl.to.y-bl.from.y)*k - Math.sin(k*Math.PI)*10;
    b.save();b.globalAlpha=.22;b.fillStyle='#02060a';b.beginPath();b.ellipse(x,y+7,Math.max(2,5-k*2),1.5,0,0,Math.PI*2);b.fill();b.restore();
    drawBall(x, y, 8 - k*3.4);
  } else if (S.scene!=='RESOLVE'){
    const jig = S.scene==='STRIKE' ? Math.sin(S.sceneT*90)*0.5 : 0;
    drawBall(SPOT.x + jig, SPOT.y, 8);
  }

  // impact marker
  if (S.scene==='RESOLVE' && S.impact){
    const i = S.impact;
    ring(i.x, i.y, 5 + S.sceneT*10, S.result.ring>=0?C.GOLD2:C.RED, 1);
    rect(i.x-1,i.y-1,3,3, C.WHITE);
  }
}


/* ═══════════════════════════════════════════════════════════
   THE SHOOTER — retro back-view sprite, one pose per touch.
   The whole point: you must be able to see a person deciding,
   running, planting, and striking. Left-footed, so the plant
   foot lands between him and the ball and the swing arcs in.

     STANCE   waiting — this is also where he stands while you aim
     RUNUP    tap 2 locked power — he comes in
     SETTLE   arrived, shuffling over the ball
     WINDUP   tap 3 window open — plants, leg cocked, trembling
     STRIKE   accuracy locked — the swing through
     FOLLOW   in flight, leg high, on his toe
     REACT    result known — arms up, or hands on head
   ═══════════════════════════════════════════════════════════ */
function shooterPhase(){
  switch (S.scene){
    case 'P_POWER':    return S.runT < 1 ? 'RUNUP' : 'SETTLE';
    case 'P_ACCURACY': return 'WINDUP';
    case 'STRIKE':     return 'STRIKE';
    case 'FLIGHT':     return 'FOLLOW';
    case 'RESOLVE':    return 'REACT';
    default:           return 'STANCE';        // TITLE, READY, AIM…
  }
}
const easeIO = t => t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const lerp = (a,c,t) => a + (c-a)*t;

function drawShooter(){
  const phase = shooterPhase();
  let cx, gy, s;
  if (phase === 'STANCE'){
    cx = RUN.x0; gy = RUN.y0 + Math.sin(S.t*2.6)*0.9; s = RUN.s0;
  } else if (phase === 'RUNUP'){
    const k = easeIO(S.runT);
    cx = lerp(RUN.x0, RUN.x1, k); gy = lerp(RUN.y0, RUN.y1, k); s = lerp(RUN.s0, RUN.s1, k);
  } else {
    cx = RUN.x1; gy = RUN.y1; s = RUN.s1;
    if (phase === 'SETTLE') gy += Math.abs(Math.sin(S.t*7))*-1.2;
    if (phase === 'FOLLOW') gy -= 1.6;
  }

  const kit = playerKit();
  const { bodyW, hScale } = bodyMetrics();
  // local unit space → screen
  const px = x => cx + x*s*bodyW, py = y => gy + y*s*hScale;
  function lm(x0,y0,x1,y1,w,c){
    b.strokeStyle=c; b.lineWidth=Math.max(1.2,w*s*bodyW); b.lineCap='butt';
    b.beginPath(); b.moveTo(px(x0),py(y0)); b.lineTo(px(x1),py(y1)); b.stroke();
  }
  function bx(x,y,w,h,c){
    b.fillStyle=c;
    b.fillRect(Math.round(px(x)), Math.round(py(y)), Math.max(1,Math.round(w*s*bodyW)), Math.max(1,Math.round(h*s*hScale)));
  }
  function boot(x,y,flip){
    bx(x-(flip?2.6:0.6), y-1.2, 3.2, 2.4, kit.shoe);
    bx(x-(flip?2.6:0.6), y+0.6, 3.2, 0.8, '#f4f1e4');
  }

  /* ── joints per pose ─────────────────────────────────────── */
  // plant leg = RIGHT (lands beside the ball), kicking leg = LEFT
  let pK=[4.5,-10], pF=[6,0];        // plant knee, plant foot
  let kK=[-3.5,-10], kF=[-4.5,0];    // kick knee, kick foot
  let aL=[[-9,-27],[-9,-19]];        // left arm: elbow, hand
  let aR=[[9,-27],[9,-19]];
  let lean = 0, headDip = 0, armsUp = false;

  if (phase === 'RUNUP' || phase === 'SETTLE'){
    const a = (phase==='RUNUP' ? S.runT*20 : S.t*7);
    const sw = Math.sin(a);
    pK=[3+1.8*sw, -11-2.5*Math.abs(sw)];  pF=[5+4*sw, -1-5.5*Math.max(0,sw)];
    kK=[-3-1.8*sw,-11-2.5*Math.abs(sw)];  kF=[-4-4*sw,-1-5.5*Math.max(0,-sw)];
    aL=[[-9,-27+2*sw],[-10,-20+4*sw]];
    aR=[[9,-27-2*sw],[10,-20-4*sw]];
    lean = 0.8;
  }
  else if (phase === 'WINDUP'){
    const tr = Math.sin(S.t*26)*0.35;              // held tension
    pK=[5,-10];        pF=[6.5,0];
    kK=[-8.5,-13+tr];  kF=[-11.5,-19.5+tr];        // cocked out and up
    aL=[[-12,-29],[-17.5,-26]];                    // arm out for balance
    aR=[[8.5,-25],[8,-19]];
    lean = 1.6;
  }
  else if (phase === 'STRIKE'){
    const k = Math.min(1, S.sceneT/STRIKE_DUR), e = k*k;   // accelerates into the ball
    pK=[lerp(5,4.5,k), lerp(-10,-9,k)];  pF=[lerp(6.5,6,k), lerp(0,-0.6,k)];
    kK=[lerp(-8.5,4,e),  lerp(-13,-14,e)];
    kF=[lerp(-11.5,15.5,e), lerp(-19.5,-8,e)];            // swings through the ball
    aL=[[lerp(-12,-11,k),lerp(-29,-32,k)],[lerp(-17.5,-15,k),lerp(-26,-33,k)]];
    aR=[[lerp(8.5,10,k),-26],[lerp(8,12,k),-21]];
    lean = lerp(1.6,-1.2,k);
  }
  else if (phase === 'FOLLOW'){
    pK=[4,-9]; pF=[6,-2.4];                        // up on his toe
    kK=[3,-16]; kF=[9.5,-24];                      // leg high
    aL=[[-12,-32],[-16,-36]];
    aR=[[11,-28],[13,-23]];
    lean = -1.6;
  }
  else if (phase === 'REACT'){
    const good = S.result && S.result.pts > 0;
    const j = Math.max(0, Math.sin(Math.min(S.sceneT,0.6)*5.2))*(good?2.6:0);
    gy -= j;
    pK=[3.5,-10]; pF=[4,0]; kK=[-3.5,-10]; kF=[-4,0];
    if (good){ armsUp = true; aL=[[-10,-38],[-11.5,-45]]; aR=[[10,-38],[11.5,-45]]; }
    else { aL=[[-9,-36],[-4,-42]]; aR=[[9,-36],[4,-42]]; headDip = 1.6; }
  }

  /* ── shadow ──────────────────────────────────────────────── */
  b.save(); b.globalAlpha = 0.28; b.fillStyle = '#04140b';
  b.beginPath(); b.ellipse(px(1), py(0.8), 11*s, 3.2*s, 0, 0, 6.2832); b.fill(); b.restore();

  /* ── legs (kicking leg behind the torso, plant leg in front) ─ */
  lm(-3,-19, kK[0],kK[1], 4.6, kit.shorts);            // thigh
  lm(kK[0],kK[1], kF[0],kF[1], 3.6, S.skin);           // shin
  bx(kF[0]-1.6, kF[1]-1, 3.4, 3.4, kit.socks);         // sock
  boot(kF[0], kF[1]+2.2, true);

  /* ── torso ───────────────────────────────────────────────── */
  const tx = lean;
  bx(tx-6.5,-33.5, 13, 15, kit.shirt);
  bx(tx-6.5,-33.5, 13, 1.6, kit.trim);                 // collar
  bx(tx-6.5,-20.5, 13, 2, kit.trim);                   // hem
  bx(tx-7.4,-32.5, 1.2, 6, kit.trim);                  // sleeve edges
  bx(tx+6.2,-32.5, 1.2, 6, kit.trim);
  // shirt number, back view
  b.fillStyle = kit.num;
  b.font = 'bold '+Math.max(5, Math.round(8*s))+'px ui-monospace, Menlo, monospace';
  b.textAlign='center'; b.textBaseline='middle';
  b.fillText(String(S.shirtNum), px(tx), py(-27));
  // shorts
  bx(tx-6,-21, 12, 8, kit.shorts);
  bx(tx-6,-14, 12, 1.4, '#00000033');

  /* ── plant leg in front ──────────────────────────────────── */
  lm(tx+3,-19, pK[0],pK[1], 4.8, kit.shorts);
  lm(pK[0],pK[1], pF[0],pF[1], 3.8, S.skin);
  bx(pF[0]-1.6, pF[1]-4.6, 3.4, 4.2, kit.socks);
  boot(pF[0], pF[1], false);

  /* ── arms ────────────────────────────────────────────────── */
  lm(tx-6.5,-31.5, aL[0][0],aL[0][1], 3.4, kit.shirt);
  lm(aL[0][0],aL[0][1], aL[1][0],aL[1][1], 2.8, S.skin);
  lm(tx+6.5,-31.5, aR[0][0],aR[0][1], 3.4, kit.shirt);
  lm(aR[0][0],aR[0][1], aR[1][0],aR[1][1], 2.8, S.skin);

  /* ── head, from behind ───────────────────────────────────── */
  const hy = -39 + headDip;
  bx(tx-1.4, -35.5, 3, 2.4, S.skin);                   // neck
  b.save();
  if (S.cheats.bighead){                               // cheat: comically oversized head
    const pvX = px(tx), pvY = py(hy-1);
    b.translate(pvX, pvY); b.scale(1.9, 1.9); b.translate(-pvX, -pvY);
  }
  bx(tx-3.6, hy-3.6, 7.2, 7.4, S.skin);
  bx(tx-3.8, hy-4.2, 7.6, 3.6, S.hair);                // hair, back of the head
  bx(tx-1.1, hy-4.2, 0.6, 3.2, S.skin);                // hard side parting — '60s comb
  bx(tx-3.8, hy-1.2, 1.2, 2.4, S.hair);
  bx(tx+2.6, hy-1.2, 1.2, 2.4, S.hair);
  bx(tx-2.6, hy+3.2, 5.2, 1, '#00000030');
  b.restore();

  /* ── contact spark ───────────────────────────────────────── */
  if (phase==='STRIKE' && S.sceneT/STRIKE_DUR > 0.82){
    b.save(); b.globalAlpha=0.85;
    circ(SPOT.x-5, SPOT.y+1, 7, C.GOLD2);
    b.globalAlpha=0.5; circ(SPOT.x-5, SPOT.y+1, 13, C.GOLD);
    b.restore();
  }
}

/* ═══════════════════════════════════════════════════════════
   KEEPY-UPS — closeup juggling, same rig style as the shooter but
   bigger and centred. One loop = one second = one foot to the other.
   During a streak-5 celebration the loop hands off to a bicycle
   kick that sends the ball away into a goal set up behind him.
   ═══════════════════════════════════════════════════════════ */
const lerp2 = (a,c,t) => [lerp(a[0],c[0],t), lerp(a[1],c[1],t)];

function drawJuggler(anchor){
  anchor = anchor || JUG;
  const ku = S.ku;
  const inBike = S.scene === 'KU_BICYCLE';
  const bikeT = inBike ? ku.bike.t : -1;
  const cx = anchor.x, s = anchor.s;
  let gy = anchor.y;
  if (!inBike) gy += Math.sin(S.t*3)*0.6;                 // idle breathing sway

  const kit = playerKit();
  const { bodyW, hScale } = bodyMetrics();
  const px = x => cx + x*s*bodyW, py = y => gy + y*s*hScale;
  function lm(x0,y0,x1,y1,w,c){ b.strokeStyle=c; b.lineWidth=Math.max(1.2,w*s*bodyW); b.lineCap='butt';
    b.beginPath(); b.moveTo(px(x0),py(y0)); b.lineTo(px(x1),py(y1)); b.stroke(); }
  function bx(x,y,w,h,c){ b.fillStyle=c;
    b.fillRect(Math.round(px(x)), Math.round(py(y)), Math.max(1,Math.round(w*s*bodyW)), Math.max(1,Math.round(h*s*hScale))); }
  function boot(x,y,flip){
    bx(x-(flip?2.6:0.6), y-1.2, 3.2, 2.4, kit.shoe);
    bx(x-(flip?2.6:0.6), y+0.6, 3.2, 0.8, '#f4f1e4');
  }

  let pK=[4.2,-10], pF=[5,0];        // support leg
  let kK=[-4.2,-10], kF=[-5,0];      // active/juggling leg
  let aL=[[-9,-27],[-10,-20]], aR=[[9,-27],[10,-20]];
  let lean = 0, armsUp = false, headDip = 0;
  let ballLocal = null;              // [x,y] in local unit space, or null to skip drawing here
  let contactLocal = null;           // [x,y] of the leg that just made contact, for the dust poof

  if (inBike){
    if (bikeT < 0.30){                                   // leap into the scissor
      const k = bikeT/0.30;
      gy -= Math.sin(k*Math.PI)*10;
      pF = lerp2([5,0],[-9,-22],k);   pK = lerp2([4.2,-10],[-2,-16],k);
      kF = lerp2([-5,0],[11,-26],k);  kK = lerp2([-4.2,-10],[4,-18],k);
      aL=[[-12,-24],[-16,-18]]; aR=[[12,-24],[16,-18]];
      lean = lerp(0,-8,k);
    } else if (bikeT < 0.80){                             // settle back down
      const k = Math.min(1,(bikeT-0.30)/0.5);
      gy -= 10*(1-k);
      pF = lerp2([-9,-22],[5,0],k);  pK = lerp2([-2,-16],[4.2,-10],k);
      kF = lerp2([11,-26],[7,-3],k); kK = lerp2([4,-18],[-2,-13],k);
      aL=[[-12,-24],[-16,-18]]; aR=[[12,-24],[16,-18]];
      lean = lerp(-8,0,k);
    } else {                                              // celebrate the finish
      armsUp = true;
      pF=[4,0]; pK=[3.5,-10]; kF=[-4,0]; kK=[-3.5,-10];
      aL=[[-10,-38],[-11.5,-45]]; aR=[[10,-38],[11.5,-45]];
    }
  } else {
    const t = ku ? ku.cycleT : (S.t % 1);          // no ku? animate off the clock (character preview)
    const side = ku ? ku.foot : (Math.floor(S.t) % 2);
    const pattern = ku ? TRICK_PATTERNS[ku.tier] : TRICK_PATTERNS[0];
    const idx = ku ? ku.trickIdx : (Math.floor(S.t) % pattern.length);
    const curType = pattern[idx % pattern.length];
    const nextType = pattern[(idx+1) % pattern.length];
    const flick = Math.max(0, Math.cos(Math.min(1, t/0.35)*Math.PI*0.5));

    let extraLift = 0;
    if (curType === 'head'){
      extraLift = flick * 1.8;
      headDip = -flick * 3;
      pF=[5,0]; pK=[4.2,-10]; kF=[-5,0]; kK=[-4.2,-10];       // legs stay grounded
      aL=[[-11,-30],[-14,-26]]; aR=[[11,-30],[14,-26]];        // arms wide for balance
    } else {
      // same left/behind ⇄ right/front swap as the original foot-only rig,
      // so the active leg alternates which one draws in front each beat
      const isKnee = curType === 'knee';
      const active = [lerp(-5,   isKnee?-2.0:-2, flick), lerp(0,   isKnee?-10:-14, flick)];
      const activeKnee = [lerp(-4.2, isKnee?-2.2:-1, flick), lerp(-10, isKnee?-19:-17, flick)];
      const rest = [5,0], restKnee = [4.2,-10];
      if (side === 0){ kF=active; kK=activeKnee; pF=rest; pK=restKnee; contactLocal = kF; }
      else { kF=[-rest[0],rest[1]]; kK=[-restKnee[0],restKnee[1]]; pF=[-active[0],active[1]]; pK=[-activeKnee[0],activeKnee[1]]; contactLocal = pF; }
      const armSwing = Math.sin(t*Math.PI*2)*2;
      aL=[[-9-armSwing,-27],[-10-armSwing,-19]]; aR=[[9+armSwing,-27],[10+armSwing,-19]];
    }
    const hop = Math.sin(t*Math.PI) * 1.1;
    gy -= hop + extraLift;

    const fromX = contactX(curType, side), toX = contactX(nextType, 1-side);
    const y0 = CONTACT_Y[curType], y1 = CONTACT_Y[nextType];
    const peak = Math.min(y0,y1) - Math.max(CONTACT_REACH[curType], CONTACT_REACH[nextType]);
    const bxLocal = lerp(fromX, toX, t);
    const byLocal = (1-t)*(1-t)*y0 + 2*(1-t)*t*peak + t*t*y1;
    ballLocal = [ bxLocal, byLocal - 2 ];
  }

  // shadow
  b.save(); b.globalAlpha=0.28; b.fillStyle='#04140b';
  b.beginPath(); b.ellipse(px(0.5), py(0.8), 12*s, 3.4*s, 0,0,6.2832); b.fill(); b.restore();

  // legs (juggling leg behind, support leg in front — same order as the shooter)
  lm(-3,-19, kK[0],kK[1], 4.8, kit.shorts);
  lm(kK[0],kK[1], kF[0],kF[1], 3.8, S.skin);
  bx(kF[0]-1.7, kF[1]-1, 3.6, 3.6, kit.socks);
  boot(kF[0], kF[1]+2.2, true);

  // torso
  const tx = lean;
  bx(tx-6.8,-33.5, 13.6, 15.5, kit.shirt);
  bx(tx-6.8,-33.5, 13.6, 1.6, kit.trim);
  bx(tx-6.8,-20.5, 13.6, 2, kit.trim);
  bx(tx-7.7,-32.5, 1.2, 6, kit.trim);
  bx(tx+6.5,-32.5, 1.2, 6, kit.trim);
  b.fillStyle = kit.num;
  b.font = 'bold '+Math.max(5, Math.round(8*s))+'px ui-monospace, Menlo, monospace';
  b.textAlign='center'; b.textBaseline='middle';
  b.fillText(String(S.shirtNum), px(tx), py(-27));
  bx(tx-6.3,-21, 12.6, 8, kit.shorts);

  // support leg in front
  lm(tx+3,-19, pK[0],pK[1], 5, kit.shorts);
  lm(pK[0],pK[1], pF[0],pF[1], 4, S.skin);
  bx(pF[0]-1.7, pF[1]-4.6, 3.6, 4.4, kit.socks);
  boot(pF[0], pF[1], false);

  // arms
  lm(tx-6.8,-31.5, aL[0][0],aL[0][1], 3.5, kit.shirt);
  lm(aL[0][0],aL[0][1], aL[1][0],aL[1][1], 2.9, S.skin);
  lm(tx+6.8,-31.5, aR[0][0],aR[0][1], 3.5, kit.shirt);
  lm(aR[0][0],aR[0][1], aR[1][0],aR[1][1], 2.9, S.skin);

  // head, from behind — same period side-parting as the shooter
  const hy = -39 + headDip;
  bx(tx-1.4,-35.5, 3, 2.4, S.skin);
  b.save();
  if (S.cheats.bighead){                               // cheat: comically oversized head
    const pvX = px(tx), pvY = py(hy-1);
    b.translate(pvX, pvY); b.scale(1.9, 1.9); b.translate(-pvX, -pvY);
  }
  bx(tx-3.8, hy-3.7, 7.6, 7.6, S.skin);
  bx(tx-4.0, hy-4.3, 8.0, 3.7, S.hair);
  bx(tx-1.15, hy-4.3, 0.6, 3.3, S.skin);
  bx(tx-4.0, hy-1.2, 1.2, 2.4, S.hair);
  bx(tx+2.8, hy-1.2, 1.2, 2.4, S.hair);
  b.restore();

  // contact feedback — dust off the foot/knee, a soft ring off the head
  if (!inBike && ku && ku.contactPop > 0){
    b.save(); b.globalAlpha = ku.contactPop*0.55;
    if (ku.contactType === 'head'){
      ring(px(tx), py(hy-2), (1-ku.contactPop)*5*s*0.14 + 2.5, C.CHALKDIM, 1);
    } else if (contactLocal){
      const groundY = ku.contactType==='knee' ? contactLocal[1]+2 : 1.4;
      circ(px(contactLocal[0]), py(groundY), (1-ku.contactPop)*6*s*0.14 + 1.5, C.CHALKDIM);
    }
    b.restore();
  }

  // the ball — juggling loop only; the bicycle kick draws its own flight
  if (ballLocal){
    const wob = Math.sin(S.t*20)*0.4;
    drawBall(px(ballLocal[0])+wob, py(ballLocal[1]), 9);
  }
}

/* ── a small goal set up behind him, for the ball to sink into ──── */
function drawDistantGoal(scale, cy, bikeT){
  const gw = 96*scale, gh = 50*scale;
  const x0 = W/2-gw/2, y0 = cy;
  b.save();
  b.beginPath(); b.rect(x0,y0,gw,gh); b.clip();
  rect(x0,y0,gw,gh,'#0c1526');
  for (let x=x0; x<=x0+gw; x+=6*scale) line(x,y0,x,y0+gh,C.NET);
  for (let y=y0; y<=y0+gh; y+=6*scale) line(x0,y,x0+gw,y,C.NET);
  b.restore();
  rect(x0-2,y0-2,gw+4,2,C.POST);
  rect(x0-2,y0-2,2,gh+4,C.POST);
  rect(x0+gw,y0-2,2,gh+4,C.POST);
  if (bikeT >= 1.25){
    const k = Math.max(0, 1-(bikeT-1.25)/0.4);
    b.save(); b.globalAlpha = 0.55*k;
    circ(W/2, y0+gh*0.5, gw*0.42, C.GOLD2);
    b.restore();
  }
}

function drawBicycleScene(){
  const bk = S.ku.bike, t = bk.t;
  drawDistantGoal(0.55, 66, t);

  if (t > 0.30 && t < 1.30){                                // the rush toward goal
    const k = (t-0.30)/1.0;
    b.save(); b.globalAlpha = 0.20*Math.sin(Math.min(1,k)*Math.PI);
    for (let i=0;i<14;i++){
      const ang = (i/14)*6.2832 + S.t*2;
      const x0 = W/2 + Math.cos(ang)*10, y0 = 90 + Math.sin(ang)*10;
      const x1 = W/2 + Math.cos(ang)*130, y1 = 90 + Math.sin(ang)*130;
      line(x0,y0,x1,y1, C.GOLD2);
    }
    b.restore();
  }

  if (t >= 0.28 && t < 1.25){                                // the ball itself, receding
    const k = Math.max(0, Math.min(1, (t-0.28)/0.95));
    const ease = k*k;
    const bx_ = W/2 + Math.sin(ease*Math.PI)*16;             // it loops up and over him
    const by_ = lerp(JUG.y-30, 66+25, ease);
    const br = lerp(9, 2, ease);
    drawBall(bx_, by_, Math.max(1,br));
  }

  drawJuggler();                                             // he occludes the ball as it passes
}

/* A Wordle-style spoiler-free result — ladder rungs as blocks, so it
   pastes into any chat and still reads as a scoreboard. */
function buildShareText(){
  const ku = S.ku;
  const cell = r => r===15 ? (r<=ku.best?'💎':'⬛')
              : (r===5||r===10) ? (r<=ku.best?'🟨':'⬛')
              : (r<=ku.best?'⚪':'⬛');
  // rows ascend left→right, and the rows themselves stack highest-first,
  // so the block reads the same way the ladder does on screen
  const rows = [];
  for (let base=1; base<=15; base+=5){
    let row = '';
    for (let r=base; r<base+5; r++) row += cell(r);
    rows.unshift(row);
  }
  const grid = rows.join('\n');
  const head = 'KICK-OFF' + (S.isDaily ? ' DAILY ' + todayKey() : '') +
               '  ' + MONEY_LABELS[Math.max(0,ku.best-1)] + (ku.best?'':'—') +
               '  ' + ku.best + '/15';
  return head + '\n' + grid.trim();
}
function doShare(){
  const text = buildShareText();
  const done = ()=>{ S.shareFlashT = 1.4; SFX.correct(); buzz(20); };
  try {
    if (navigator.share){ navigator.share({ text }).then(done).catch(()=>{}); return; }
    if (navigator.clipboard){ navigator.clipboard.writeText(text).then(done).catch(()=>{}); return; }
  } catch(e){}
  try {                                    // last resort for file:// and old browsers
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done();
  } catch(e){}
}

const LADDER_X = 4, LADDER_Y = 64, LADDER_W = 78, LADDER_ROW_H = 33, LADDER_GROUP = 5;

/* a small ball icon for the ladder — plain/dim/gold/blue share one drawer,
   the rank-15 diamond gets its own shimmering shape. */
function drawLadderBall(cx, cy, r, style){
  if (style === 'diamond'){
    const shim = 0.5 + 0.5*Math.sin(S.t*5);
    b.save(); b.globalAlpha = 0.28 + 0.28*shim; circ(cx, cy, r*2, '#bfe8ff'); b.restore();
    b.fillStyle = '#eaf9ff';
    b.beginPath(); b.moveTo(cx, cy-r*1.25); b.lineTo(cx+r*0.9, cy); b.lineTo(cx, cy+r*1.25); b.lineTo(cx-r*0.9, cy); b.closePath(); b.fill();
    b.strokeStyle = '#7fd6ff'; b.lineWidth = 1; b.stroke();
    b.save(); b.globalAlpha = 0.55 + 0.45*shim; b.fillStyle = '#ffffff';
    b.beginPath(); b.moveTo(cx, cy-r*1.25); b.lineTo(cx+r*0.32, cy-r*0.05); b.lineTo(cx, cy+r*0.18); b.lineTo(cx-r*0.32, cy-r*0.05); b.closePath(); b.fill();
    b.restore();
    if (shim > 0.82){
      b.save(); b.strokeStyle = 'rgba(255,255,255,0.9)'; b.lineWidth = 1;
      b.beginPath(); b.moveTo(cx-r*1.7,cy); b.lineTo(cx+r*1.7,cy); b.moveTo(cx,cy-r*1.7); b.lineTo(cx,cy+r*1.7); b.stroke();
      b.restore();
    }
    return;
  }
  // same pentagon-panel pattern as the real matchball (drawBall), just
  // tinted per state — so every ball actually reads as a football, at
  // full opacity so the ones still ahead don't fade into the pitch.
  const PAL = {
    dim:   { base:'#5c6a82', panel:'#333c50', edge:'#828da3' },
    plain: { base:C.WHITE,   panel:'#191d27', edge:'#8f9ab0' },
    gold:  { base:C.GOLD,    panel:C.GOLDDK,  edge:'#7a5a10' },
    blue:  { base:C.BLUE,    panel:C.BLUEDK,  edge:'#0d2740' },
  };
  const p = PAL[style];
  circ(cx, cy, r, p.base);
  b.save(); b.globalAlpha = 0.92;
  circ(cx,          cy - r*0.16, r*0.30, p.panel);
  circ(cx - r*0.64, cy + r*0.48, r*0.21, p.panel);
  circ(cx + r*0.64, cy + r*0.48, r*0.21, p.panel);
  b.restore();
  circ(cx - r*0.34, cy - r*0.44, r*0.30, 'rgba(255,255,255,0.85)');
  ring(cx, cy, r, p.edge, 1);
}

/* Every ball is just the next question, not a fixed rank slot — we only ever
   show the current group of 5 (ranks 1-5, 6-10, 11-15). The top ball of the
   group is the one that matters: reach it and you rank up (a checkpoint, or
   the final diamond at 15), and the group rolls over to a fresh empty one. */
function drawMoneyLadder(){
  const ku = S.ku;
  const football = S.ladderStyle === 'football';
  const group = Math.min(2, Math.floor(ku.rank / LADDER_GROUP));
  const groupStart = group * LADDER_GROUP;

  if (football){
    const cx = LADDER_X + 32, r = 10;
    const yFor = slot => LADDER_Y + (LADDER_GROUP-slot)*LADDER_ROW_H + LADDER_ROW_H/2 - 2;
    const yTop = yFor(LADDER_GROUP), yBottom = yFor(1);
    const railL = cx - 16, railR = cx + 16;

    // a literal ladder — two rails and a rung per question, so the climb
    // itself stays legible even though only one group of 5 is on screen
    line(railL, yTop-9, railL, yBottom+9, C.PANELED);
    line(railR, yTop-9, railR, yBottom+9, C.PANELED);
    for (let slot=1; slot<=LADDER_GROUP; slot++) line(railL, yFor(slot), railR, yFor(slot), C.PANELED);

    if (group < 2){                        // hint the climb continues above this group
      const ay = yTop - 17 + Math.sin(S.t*2)*1.2;
      line(cx-4, ay+4, cx, ay, C.GREYDK); line(cx+4, ay+4, cx, ay, C.GREYDK);
    }

    for (let slot=1; slot<=LADDER_GROUP; slot++){
      const rank = groupStart + slot;
      const isTop = slot === LADDER_GROUP;
      const isFinal = rank === 15;
      const used = (rank===5 && ku.checkpoint5Used) || (rank===10 && ku.checkpoint10Used);
      const secured = rank <= ku.rank;
      const isCurrent = rank === ku.rank + 1;
      const cy = yFor(slot);
      const isLifeline = isTop && !isFinal;
      const style = isFinal ? 'diamond' : isTop ? (used ? 'blue' : 'gold') : (secured ? 'plain' : 'dim');
      if (isCurrent){
        const pulse = 0.35 + 0.35*Math.sin(S.t*6);
        b.save(); b.globalAlpha = pulse; ring(cx, cy, r+4, C.GOLD2, 1.6); b.restore();
      }
      drawLadderBall(cx, cy, r, style);

      // a small money counter beside every ball, so the scale of the climb
      // is always visible — checkpoints add a compact "2ND CHANCE" tag
      const lx = railR + 6;
      const moneyCol = secured || isCurrent ? C.WHITE : C.GREYDK;
      txt(MONEY_LABELS[rank-1], lx, cy - (isLifeline?7:3), moneyCol, 7);
      if (isLifeline) txt(t('second_chance'), lx, cy+2, used ? C.BLUE : C.GOLD, 5);
    }
    return;
  }

  for (let slot=1; slot<=LADDER_GROUP; slot++){
    const rank = groupStart + slot;
    const isTop = slot === LADDER_GROUP;         // the rank-up ball for this group
    const used = (rank===5 && ku.checkpoint5Used) || (rank===10 && ku.checkpoint10Used);
    const secured = rank <= ku.rank;
    const isCurrent = rank === ku.rank + 1;
    const rowFromTop = LADDER_GROUP - slot;
    const ry = LADDER_Y + rowFromTop*LADDER_ROW_H;

    let bg = C.PANEL, bd = C.PANELED, fg = C.GREYDK;
    if (isTop) bd = used ? C.BLUE : C.GOLD;
    if (secured){ fg = C.WHITE; bg = '#101a12'; }
    if (isCurrent){
      const pulse = 0.5 + 0.5*Math.sin(S.t*6);
      bg = isTop ? (used ? '#123a5c' : '#3a2c06') : '#123a5c';
      fg = C.WHITE;
      bd = isTop ? (used ? C.BLUE : C.GOLD) : C.GOLD2;
      b.save(); b.globalAlpha = 0.5 + pulse*0.5;
      rect(LADDER_X-1, ry-1, LADDER_W+2, LADDER_ROW_H-4, bd);
      b.restore();
    }
    rect(LADDER_X, ry, LADDER_W, LADDER_ROW_H-6, bd);
    rect(LADDER_X+1, ry+1, LADDER_W-2, LADDER_ROW_H-8, bg);
    txt(MONEY_LABELS[rank-1], LADDER_X+LADDER_W/2, ry+9, fg, 8, 'center');
  }
}

/* ── the pre-match showcase — before you climb it, watch it. Scrolls the
   full 15-rung ladder past a fixed viewport, bottom (£100) to top
   (£1,000,000), chiming as each rung crosses the centre and making a real
   moment of the two "2ND CHANCE" checkpoints and the diamond summit.     ── */
const KU_INTRO_SCROLL = 9.2, KU_INTRO_HOLD = 2.2, KU_INTRO_ROW_H = 54;
// tap-to-skip: rather than jump-cutting to the end, the remaining scroll
// rushes past at this many times normal speed (chimes still fire, just in
// a quick cascade) while the viewport gets a brief zoom-in whoosh — a fast
// version of the real animation, not an instant snap.
const KU_INTRO_SKIP_BOOST = 8, KU_INTRO_SKIP_ZOOM_DUR = 1.0, KU_INTRO_SKIP_HOLD = 0.6;
function kuIntroLayout(){
  const viewportTop = 92, viewportBottom = 400;
  return { viewportTop, viewportBottom, Hv: viewportBottom - viewportTop };
}
function kuIntroBallY(rank){ return (15-rank)*KU_INTRO_ROW_H + KU_INTRO_ROW_H/2; }
// eases in from a standing start, picks up speed through the middle,
// then decelerates into a little overshoot-bounce at the top — the
// ladder doesn't just glide to a stop, it arrives with enough of a
// settle that the £1M summit reads as a genuine "we made it" rather
// than quietly petering out
function kuIntroEase(p){
  const c1 = 1.4, c2 = c1*1.525;
  if (p < 0.5){
    const x = 2*p;
    return (x*x*((c2+1)*x - c2)) / 2;
  }
  const x = 2*p - 2;
  return (x*x*((c2+1)*x + c2) + 2) / 2;
}
// the content-space Y that sits at the viewport's centre right now — this
// is what both the ball positions AND the chime detection key off, so the
// two always agree on what's "centred"
function kuIntroCenterContentY(e){
  return kuIntroBallY(1) + (kuIntroBallY(15)-kuIntroBallY(1))*e;
}
function kuIntroCenterRank(e){
  const centerContentY = kuIntroCenterContentY(e);
  const rank = 15 - Math.round((centerContentY - KU_INTRO_ROW_H/2)/KU_INTRO_ROW_H);
  return Math.max(1, Math.min(15, rank));
}
function kuIntroChime(rank){
  if (rank === 15){
    SFX.boom(); SFX.crowdRoar(1); spawnConfetti(40);
    S.flash = Math.max(S.flash, 0.35); S.shake = Math.max(S.shake, 3);
  } else if (rank === 5 || rank === 10){
    SFX.rankUp(); spawnConfetti(16); S.flash = Math.max(S.flash, 0.15);
  } else if (AC){
    tone(440 + rank*44, AC.currentTime, 0.002, 0.08, 0.08, 'square');
  }
}
function drawKUIntro(){
  const ku = S.ku;
  const g = b.createRadialGradient(W/2,H*0.4,20, W/2,H*0.4,H*0.9);
  g.addColorStop(0,'#111b34'); g.addColorStop(1,'#05070d');
  b.fillStyle = g; b.fillRect(0,0,W,H);
  for (let i=0;i<30;i++){
    const hash = (i*2654435761)>>>0, sx = hash%W, sy = (hash>>>8)%H;
    const tw = 0.35 + 0.55*Math.max(0, Math.sin(S.t*1.3 + (hash%100)*0.1));
    b.save(); b.globalAlpha = tw; rect(sx, sy, 1, 1, '#cfe0ff'); b.restore();
  }

  txt(S.cat, W/2, 14, C.GOLD2, 8, 'center');
  txt(t('solo_keepyups'), W/2, 26, C.WHITE, 13, 'center');

  const p = Math.min(1, S.sceneT/KU_INTRO_SCROLL);
  const e = kuIntroEase(p);
  const L = kuIntroLayout();
  const centerContentY = kuIntroCenterContentY(e);
  const viewportCenter = L.viewportTop + L.Hv/2;
  const arrived = p >= 1;                         // true once the scroll segment itself is done
  const cx = W/2, r = 15;
  const railL = cx-18, railR = cx+18;

  b.save();
  b.beginPath(); b.rect(0, L.viewportTop, W, L.Hv); b.clip();

  if (ku.introSkipT > 0){
    // a quick zoom-in-and-back whoosh riding alongside the skip-rush —
    // reinforces "racing to the end" rather than the scroll just speeding up
    const zoom = 1 + 0.09*Math.sin(Math.min(1, ku.introSkipT) * Math.PI);
    b.translate(cx, viewportCenter); b.scale(zoom, zoom); b.translate(-cx, -viewportCenter);
  }

  line(railL, L.viewportTop-KU_INTRO_ROW_H, railL, L.viewportBottom+KU_INTRO_ROW_H, C.PANELED);
  line(railR, L.viewportTop-KU_INTRO_ROW_H, railR, L.viewportBottom+KU_INTRO_ROW_H, C.PANELED);

  for (let rank=1; rank<=15; rank++){
    const cy = viewportCenter + (kuIntroBallY(rank) - centerContentY);
    if (cy < L.viewportTop-30 || cy > L.viewportBottom+30) continue;

    const isCheckpoint = rank===5 || rank===10, isFinal = rank===15;
    const used = (rank===5 && ku.checkpoint5Used) || (rank===10 && ku.checkpoint10Used);
    const style = isFinal ? 'diamond' : isCheckpoint ? (used?'blue':'gold') : 'plain';

    // a soft spotlight band at the viewport centre — rungs pop as they pass it
    const distFromCenter = Math.abs(cy - viewportCenter);
    const focus = Math.max(0, 1 - distFromCenter/95);
    const finalGlow = (isFinal && arrived) ? 0.5 + 0.5*Math.sin(S.t*3.5) : 0;   // the diamond keeps breathing once home
    const rr = r * (0.82 + focus*0.3 + finalGlow*0.12 + (isFinal ? 0.3 : 0));   // the summit diamond sits noticeably bigger, always

    line(railL, cy, railR, cy, C.PANELED);
    if (focus > 0.05 || finalGlow>0){ b.save(); b.globalAlpha = Math.max(focus*0.5, finalGlow*0.7); ring(cx, cy, rr+5, C.GOLD2, 1.4); b.restore(); }
    drawLadderBall(cx, cy, rr, style);

    b.save(); b.globalAlpha = 0.5 + focus*0.5;
    txt(MONEY_LABELS[rank-1], cx + rr + 12, cy-4, focus>0.3?C.WHITE:C.GREYDK, 9);
    if (isCheckpoint) txt(t('second_chance'), cx + rr + 12, cy+6, used?C.BLUE:C.GOLD, 6);
    if (isFinal) txtFit('UNLOCKS A CLUB & MORE', cx + rr + 12, cy+6, C.GOLD, 6, W-(cx+rr+12)-6);
    b.restore();
  }
  b.restore();

  if (arrived){
    b.save(); b.globalAlpha = 0.4 + 0.3*Math.sin(S.t*3.5);
    txt(t('ladder_complete'), W/2, L.viewportTop-10, C.GOLD2, 9, 'center');
    b.restore();
  }

  // fade the viewport edges so rungs arrive/leave softly, not with a hard clip line
  const fade = b.createLinearGradient(0,L.viewportTop,0,L.viewportTop+26);
  fade.addColorStop(0,'#05070d'); fade.addColorStop(1,'rgba(5,7,13,0)');
  b.fillStyle = fade; b.fillRect(0,L.viewportTop,W,26);
  const fade2 = b.createLinearGradient(0,L.viewportBottom-26,0,L.viewportBottom);
  fade2.addColorStop(0,'rgba(5,7,13,0)'); fade2.addColorStop(1,'#05070d');
  b.fillStyle = fade2; b.fillRect(0,L.viewportBottom-26,W,26);

  if (S.confetti.length) drawConfetti();
  txt(t(arrived ? 'tap_to_start' : 'tap_to_skip'), W/2, 412, Math.sin(S.t*5)>0?C.GREYDK:'transparent', 8, 'center');
}

/* ── the chest ────────────────────────────────────────────────
   Beat a team to £1,000,000 honestly and this is what you get.
   Rattles under the lid for a beat, blows open on a burst of light,
   then hands over the code.                                     ── */
const CHEST_RATTLE = 1.15;
function drawChest(cx, cy, s, openAmt){
  const w = 52*s, h = 34*s, lidH = 20*s;
  const lift = openAmt * 22*s, tilt = openAmt * 0.9;

  // body
  rect(cx-w/2, cy-h/2+lidH*0.5, w, h, '#6b4620');
  rect(cx-w/2+1, cy-h/2+lidH*0.5+1, w-2, h-2, '#8a5c2c');
  for (let i=-1;i<=1;i+=2) rect(cx+i*w*0.31-1.5*s, cy-h/2+lidH*0.5, 3*s, h, '#c98f16');
  rect(cx-w/2, cy+h/2+lidH*0.5-3*s, w, 3*s, '#4a2f14');

  // lid — pivots on the back-left corner so it swings like a real
  // hinge instead of floating away from the body
  b.save();
  b.translate(cx-w/2, cy-h/2+lidH*0.5);
  b.rotate(-tilt);
  b.translate(0, -lift*0.18);
  rect(0, -lidH, w, lidH, '#6b4620');
  rect(1, -lidH+1, w-2, lidH-2, '#9a6832');
  for (let i=1;i<=2;i++) rect(w*(i/3)-1.5*s, -lidH, 3*s, lidH, '#c98f16');
  rect(0, -lidH, w, 2*s, '#c98f16');
  b.restore();

  // clasp, only while shut
  if (openAmt < 0.15){
    rect(cx-4*s, cy-h/2+lidH*0.5-3*s, 8*s, 8*s, C.GOLD);
    rect(cx-1.5*s, cy-h/2+lidH*0.5-0.5*s, 3*s, 3*s, '#4a2f14');
  }
}
function drawKUChest(){
  const g = b.createRadialGradient(W/2,180,10, W/2,180,H*0.8);
  g.addColorStop(0,'#181228'); g.addColorStop(1,'#05070d');
  b.fillStyle = g; b.fillRect(0,0,W,H);

  const t = S.sceneT;
  const open = Math.max(0, Math.min(1, (t - CHEST_RATTLE)/0.45));
  const cx = W/2, cy = 178;

  txt('LADDER COMPLETE', W/2, 40, C.GOLD2, 11, 'center');
  txtFit(S.cat + ' TAKEN TO ' + MONEY_LABELS[14], W/2, 56, C.GREY, 8, W-40, 'center');

  // light spilling out once the lid lets go
  if (open > 0){
    b.save();
    for (let i=0;i<10;i++){
      const a = (i/10)*Math.PI*2 + S.t*0.7;
      b.globalAlpha = 0.10*open;
      b.fillStyle = C.GOLD2;
      b.beginPath(); b.moveTo(cx, cy-6);
      b.lineTo(cx+Math.cos(a)*150, cy-6+Math.sin(a)*150);
      b.lineTo(cx+Math.cos(a+0.22)*150, cy-6+Math.sin(a+0.22)*150);
      b.closePath(); b.fill();
    }
