  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#05070d;overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center}
  /* the body's touch-action:manipulation still lets a real touchscreen's
     native gesture recognizer intercept a sustained drag (e.g. the
     DEFENDER joystick, or the achievements/hub momentum-scroll) before our
     own pointermove handlers ever see it — mouse input (and Playwright's
     synthetic mouse events) never goes through that gesture recognizer, so
     this only shows up on a real touchscreen. touch-action:none on the
     canvas hands 100% of touch handling to our own JS, which is what every
     interaction on this canvas already assumes. */
  canvas{display:block;cursor:pointer;touch-action:none;
    box-shadow:0 0 0 1px #1b2438, 0 0 60px -10px #1a3a6b}
  @media (prefers-reduced-motion:reduce){canvas{box-shadow:0 0 0 1px #1b2438}}
  #menuBtn{position:fixed;top:8px;left:8px;z-index:5;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

    border:1px solid #1d2942;border-radius:2px;padding:6px 9px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;user-select:none}
  #menuBtn{transition:transform .12s ease,background .12s ease,color .12s ease,box-shadow .12s ease}
  #menuBtn:hover{background:#16223a;color:#ffe89a;box-shadow:0 0 0 1px #2b3b5c,0 4px 18px #0008}
  #menuBtn:focus-visible,#devBtn:focus-visible{outline:2px solid #ffc93c;outline-offset:3px}
  #menuBtn:active{transform:translateY(1px) scale(.97);background:#1d2942;color:#ffe89a}
  #devBtn{position:fixed;bottom:8px;right:8px;z-index:5;

    border:1px solid #1d2942;border-radius:50%;width:26px;height:26px;line-height:24px;
    text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;opacity:0.55}
  #devBtn{transition:transform .12s ease,background .12s ease,color .12s ease,opacity .12s ease}
  #devBtn:hover{opacity:1;background:#16223a;color:#ffe89a}
  #devBtn:active{transform:scale(.92);background:#1d2942;color:#ffe89a;opacity:1}
  @media (prefers-reduced-motion:reduce){#menuBtn,#devBtn{transition:none}}

<body>
<div id="wrap"><canvas id="cv" role="application" aria-label="KICK-OFF — Fixtures & Fun football game"></canvas></div>
<div id="srStatus" aria-live="polite" aria-atomic="true" style="position:fixed;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden">KICK-OFF — Fixtures &amp; Fun</div>
<button id="menuBtn" type="button">≡ MENU</button>
<button id="devBtn" type="button">⚙</button>
<script>
/* Installable without a second file: the manifest is generated at run time
   and handed to the browser as a blob URL. Keeps the whole game one file. */
(function(){
  try {
    const icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%2305070d'/%3E%3Ccircle cx='256' cy='256' r='152' fill='%231d5fa8'/%3E%3Ccircle cx='256' cy='256' r='104' fill='%23e8402c'/%3E%3Ccircle cx='256' cy='256' r='56' fill='%23f0efe4'/%3E%3Ccircle cx='256' cy='256' r='24' fill='%23ffc93c'/%3E%3C/svg%3E";
    const manifest = {
      name:'KICK-OFF — Fixtures & Fun', short_name:'KICK-OFF',
      description:'Fixtures & Fun — three taps, ten seconds, one goal.',
      start_url:'.', display:'fullscreen', orientation:'portrait',
      background_color:'#05070d', theme_color:'#05070d',
      icons:[{ src:icon, sizes:'512x512', type:'image/svg+xml', purpose:'any maskable' }]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  } catch(e){ /* manifest is a nicety — never let it break the game */ }
})();
</script>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   KICK-OFF — three-tap prototype
   Power → Height → Placement.  Wind. Targets. Trivia inflation.
   Internal buffer 288x432, nearest-neighbour upscale.
   Fixed timestep 1/120s. Seeded PRNG. Procedural audio.
   ═══════════════════════════════════════════════════════════ */

const W = 288, H = 432;
// the game buffer stays 288x432 untouched; the display frame adds vertical
// padding above and below so the presentation fills a modern tall phone
// screen instead of letterboxing top and bottom.
const PAD_TOP = 54, PAD_BOTTOM = 26;
const FRAME_W = W, FRAME_H = H + PAD_TOP + PAD_BOTTOM;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
/* buf is drawn supersampled — its backing store is SS times the logical
   288x432 — then smooth-downscaled into the final composite in post().
   Every draw call in this file still works in plain W/H logical units;
   the b.scale(SS,SS) below makes that land at SS times the pixel density
   for free. Flat rects still look crisp (a solid-colour block downsamples
   to the same solid colour), but text and curves — which get antialiased
   at whatever resolution they're actually drawn at — stop looking like
   blurry, chunky mush once they're not also being nearest-neighbour
   blown up from a tiny 288px-wide source. */
const SS = 2;
const buf = document.createElement('canvas'); buf.width = W*SS; buf.height = H*SS;
const b = buf.getContext('2d', { alpha:false });
b.scale(SS, SS);
b.imageSmoothingEnabled = false;
ctx.imageSmoothingEnabled = false;

// tint buffers for the RGB-split flash — stay at logical resolution;
// they're sampled *from* the supersampled buf (with smoothing), so this
// is a free antialiased downsample rather than a quality loss.
const tA = document.createElement('canvas'); tA.width=W; tA.height=H;
const tB = document.createElement('canvas'); tB.width=W; tB.height=H;
const ta = tA.getContext('2d'), tb = tB.getContext('2d');
ta.imageSmoothingEnabled = true; tb.imageSmoothingEnabled = true;

// a small scratch canvas the language flags are drawn flat onto, then
// sampled column-by-column with a vertical sine offset to make them wave
const FLAG_W = 40, FLAG_H = 26;
const flagBuf = document.createElement('canvas'); flagBuf.width = FLAG_W; flagBuf.height = FLAG_H;
const flagCtx = flagBuf.getContext('2d');

/* ── palette: floodlit night stadium ─────────────────────────
   Derived from the subject: sodium floodlights on wet grass,
   chalk paint, terrace flare orange, scoreboard LED gold.     */
const C = {
  VOID:'#05070d', SKY:'#0a1020',
  STAND:'#101a2f', STAND2:'#0b1223',
  CROWD1:'#1c2b4a', CROWD2:'#26385c', CROWD3:'#152139',
  TURF1:'#1f6b42', TURF2:'#1a5c39', TURF3:'#124a2c', TURFLO:'#0d3a22',
  CHALK:'#f4f1e4', CHALKDIM:'#b9b8ae',
  POST:'#fbfaf3', POSTSH:'#a9b0c0',
  NET:'#2f4468', NET2:'#3b5480',
  GOLD:'#ffc93c', GOLD2:'#ffe89a', GOLDDK:'#c98f16',
  RED:'#e8402c', ORANGE:'#ff8a3d',
  BLUE:'#4ea8ff', BLUEDK:'#1d5fa8',
  WHITE:'#f4f1e4', GREY:'#6f7d99', GREYDK:'#3d4a63',
  GREEN:'#3fd06a', GREENDK:'#1d7a3d',
  INK:'#070b14', PANEL:'#0e1526', PANELED:'#1d2942',
  KEEP1:'#e8e0c8', KEEP2:'#4c7a4a', KEEP3:'#16203a', SKIN:'#c98b5e'
};

/* ── seeded PRNG (mulberry32) ──────────────────────────────── */
let SEED = (Math.random()*4294967296)>>>0;
let rngState = SEED;
function srand(s){ rngState = s>>>0; }
function rnd(){
  rngState = (rngState + 0x6D2B79F5)>>>0;
  let t = rngState;
  t = Math.imul(t ^ (t>>>15), t | 1);
  t ^= t + Math.imul(t ^ (t>>>7), t | 61);
  return ((t ^ (t>>>14))>>>0) / 4294967296;
}
const rrange = (a,c)=> a + rnd()*(c-a);
const rint = (a,c)=> Math.floor(rrange(a,c+1));

/* ═══════════════════════════════════════════════════════════
   AUDIO — everything synthesised, nothing loaded
   ═══════════════════════════════════════════════════════════ */
let AC = null, master = null, audioOn = true;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) { audioOn = false; return; }
  AC = new Ctor();
  master = AC.createGain(); master.gain.value = S.audioMuted ? 0 : S.audioVolume; master.connect(AC.destination);
  startAmbience();
}
function applyVolume(){ if (master) master.gain.value = S.audioMuted ? 0 : S.audioVolume; }

/* ── the stadium never goes silent ────────────────────────────
   A permanently-running filtered noise bed, whose gain follows the
   crowd's excitement. Costs one buffer source for the whole session
   and does more for "you are in a stadium" than any one-shot.   ── */
let ambBed = null, ambGain = null, ambFilter = null;
function startAmbience(){
  if (!AC || ambBed) return;
  try {
    ambBed = AC.createBufferSource(); ambBed.buffer = getNoise(); ambBed.loop = true;
    ambFilter = AC.createBiquadFilter(); ambFilter.type = 'bandpass';
    ambFilter.frequency.value = 480; ambFilter.Q.value = 0.55;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180;
    ambGain = AC.createGain(); ambGain.gain.value = 0.0001;
    ambBed.connect(ambFilter); ambFilter.connect(hp); hp.connect(ambGain); ambGain.connect(master);
    ambBed.start();
  } catch(e){ ambBed = null; }
}
function updateAmbience(){
  if (!ambGain || !AC) return;
  // louder and brighter the more the crowd is going; near-silent on menus
  const inPlay = S.scene && S.scene.indexOf('KU_') === 0 ||
                 ['ROUNDCARD','QUESTION','READY','AIM','P_POWER','P_ACCURACY','STRIKE','FLIGHT','RESOLVE'].indexOf(S.scene) >= 0;
  const target = (inPlay ? 0.022 : 0.006) + S.crowdHype * 0.05;
  try {
    ambGain.gain.setTargetAtTime(Math.max(0.0001, target), AC.currentTime, 0.5);
    ambFilter.frequency.setTargetAtTime(430 + S.crowdHype*760, AC.currentTime, 0.6);
  } catch(e){}
}
function env(node, t, a, d, peak){
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  node.connect(g); g.connect(master);
  return g;
}
function tone(freq, t, a, d, peak, type='square', detune=0){
  if(!AC) return;
  const o = AC.createOscillator();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  env(o, t, a, d, peak);
  o.start(t); o.stop(t + a + d + 0.02);
  return o;
}
function sweepTone(f0, f1, t, dur, peak, type='sawtooth'){
  if(!AC) return;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t + dur);
  env(o, t, 0.008, dur, peak);
  o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function getNoise(){
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate*3, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  return noiseBuf;
}
function noise(t, dur, peak, filterType, freq, q){
  if(!AC) return;
  const s = AC.createBufferSource(); s.buffer = getNoise(); s.loop = true;
  const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q||1;
  s.connect(f); env(f, t, 0.006, dur, peak);
  s.start(t); s.stop(t + dur + 0.05);
  return f;
}

const SFX = {
  // three distinct tap confirmations — low, mid, high. Expert play *sounds* different.
  lock(i, sweet){
    if(!AC) return; const t = AC.currentTime;
    const base = [220, 330, 494][i];
    tone(base, t, 0.004, 0.07, sweet?0.30:0.16, 'square');
    if (sweet) tone(base*2, t+0.01, 0.004, 0.10, 0.14, 'triangle');
  },
  tick(hot){ if(!AC) return; const t=AC.currentTime; tone(hot?1400:900, t, 0.002, 0.02, hot?0.10:0.05, 'square'); },
  juggleBop(kind, sideA){ // the keepy-up beat — foot/knee/head each read differently by ear
    if(!AC) return; const t=AC.currentTime;
    if (kind==='head'){
      tone(196, t, 0.004, 0.16, 0.22, 'sine'); tone(98, t+0.006, 0.005, 0.22, 0.16, 'sine');
      return;
    }
    if (kind==='knee'){
      const base = sideA?294:262;
      tone(base, t, 0.003, 0.10, 0.17, 'square'); tone(base*1.5, t+0.005, 0.003, 0.06, 0.06, 'triangle');
      return;
    }
    const base = sideA?392:330;
    tone(base, t, 0.003, 0.09, 0.16, 'triangle');
    tone(base*2, t+0.005, 0.003, 0.05, 0.06, 'square');
  },
  whistleShort(){
    if(!AC) return; const t = AC.currentTime;
    const f = noise(t, 0.16, 0.20, 'bandpass', 2600, 14);
    tone(2650, t, 0.01, 0.14, 0.05, 'sine');
  },
  whistleLong(){
    if(!AC) return; const t = AC.currentTime;
    [0,0.20,0.42].forEach((o,i)=>{
      noise(t+o, i===2?0.42:0.15, 0.20, 'bandpass', 2500+i*140, 14);
    });
  },
  boot(quality){ // 0 mishit, 1 clean, 2 pure
    if(!AC) return; const t = AC.currentTime;
    if (quality===0){ noise(t,0.09,0.22,'lowpass',420,1); tone(90,t,0.004,0.09,0.20,'sine'); return; }
    noise(t, 0.05, 0.30, 'bandpass', 1500, 1.2);
    sweepTone(150, 55, t, 0.16, 0.42, 'sine');
    if (quality===2){
      sweepTone(90, 38, t, 0.34, 0.55, 'sine');            // sub
      [1860, 2480, 3720].forEach((f,i)=> tone(f, t+0.004*i, 0.004, 0.5, 0.055, 'triangle', i*7)); // metallic ring
      noise(t, 0.02, 0.34, 'highpass', 5200, 1);
    }
  },
  ring(idx){ // 0 outer .. 3 bullseye — pitched, so you score by ear
    if(!AC) return; const t = AC.currentTime;
    if (idx===3){ [1318,1976,2637].forEach((f,i)=> tone(f, t+i*0.012, 0.004, 0.85, 0.16, 'sine')); return; }
    const f = [196, 294, 440][idx];
    tone(f, t, 0.004, 0.16, 0.22, 'triangle');
    tone(f*2, t, 0.004, 0.08, 0.08, 'square');
  },
  miss(){ if(!AC) return; const t=AC.currentTime; noise(t,0.5,0.13,'lowpass',300,1); sweepTone(180,70,t,0.5,0.10,'sawtooth'); },
  perfectCue(){ // both meters' gold cores hit together — a little fanfare
    if(!AC) return; const t = AC.currentTime;
    [660,880,1108,1320].forEach((f,i)=> tone(f, t+i*0.045, 0.004, 0.22, 0.18, 'square'));
    tone(1760, t+0.19, 0.006, 0.4, 0.16, 'triangle');
  },
  boom(){ // a big, punchy perfect-trap impact — bigger than a normal strike
    if(!AC) return; const t=AC.currentTime;
    noise(t, 0.10, 0.36, 'lowpass', 500, 1.4);
    sweepTone(220, 45, t, 0.28, 0.55, 'sine');
    [1600,2200].forEach((f,i)=> tone(f, t+0.006*i, 0.004, 0.30, 0.10, 'triangle'));
    noise(t, 0.03, 0.30, 'highpass', 4800, 1);
  },
  tootToot(){ // blunt vuvuzela-style horn, twice — the crowd going for it
    if(!AC) return; const t=AC.currentTime;
    [0, 0.34].forEach(off=>{
      const o = AC.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(233, t+off);
      const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=850; f.Q.value=1;
      o.connect(f); env(f, t+off, 0.02, 0.22, 0.18);
      o.start(t+off); o.stop(t+off+0.28);
    });
  },
  block(){ // deflating, and slightly funny
    if(!AC) return; const t=AC.currentTime;
    noise(t,0.11,0.26,'lowpass',300,1); sweepTone(150,52,t,0.30,0.20,'triangle');
    for(let i=0;i<3;i++) noise(t+0.34+i*0.17, 0.05, 0.10,'bandpass',1100,3); // slow clap
  },
  correct(){ if(!AC) return; const t=AC.currentTime; [523,659,784,1047].forEach((f,i)=> tone(f,t+i*0.05,0.005,0.14,0.16,'square')); },
  inflate(){ if(!AC) return; const t=AC.currentTime; sweepTone(300,1500,t,0.24,0.14,'sine'); noise(t,0.22,0.07,'bandpass',2000,2); },
  wrong(){ if(!AC) return; const t=AC.currentTime; sweepTone(420,110,t,0.34,0.20,'sawtooth'); tone(180,t+0.10,0.006,0.20,0.10,'square'); },
  crowdSwell(amt){ if(!AC) return; const t=AC.currentTime; noise(t,0.55,0.05+0.07*amt,'bandpass',560,0.7); },
  oppPick(){ if(!AC) return; const t=AC.currentTime;
    noise(t, 0.05, 0.10, 'bandpass', 2400, 5); tone(660, t, 0.004, 0.06, 0.08, 'triangle'); },
  rankUp(){ if(!AC) return; const t=AC.currentTime; [392,523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.075,0.006,0.3,0.15,'square')); }
};


/* ═══════════════════════════════════════════════════════════
   THE CROWD — three voices, all synthesised.
   A stadium's job is to tell you how you did before you read
   the number. Roar, groan, and boo must be instantly distinct
   from each other with the phone on silent-adjacent volume.
   ═══════════════════════════════════════════════════════════ */
function crowdBed(t, dur, peak, f0, f1, q, hp){
  const src = AC.createBufferSource(); src.buffer = getNoise(); src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f0; bp.Q.value=q;
  const g = AC.createGain();
  src.connect(bp);
  if (hp){ const h = AC.createBiquadFilter(); h.type='highpass'; h.frequency.value=hp; bp.connect(h); h.connect(g); }
  else bp.connect(g);
  g.connect(master);
  src.start(t); src.stop(t + dur + 0.1);
  bp.frequency.setValueAtTime(f0, t);
  bp.frequency.exponentialRampToValueAtTime(f1, t + dur*0.35);
  bp.frequency.exponentialRampToValueAtTime(f0*0.8, t + dur);
  return { g, dur };
}

Object.assign(SFX, {
  /* ── on target. intensity 0..1 — polite applause up to a full roar ── */
  crowdRoar(i){
    if(!AC) return; const t = AC.currentTime;
    const dur = 0.9 + i*1.9;
    const peak = 0.09 + i*0.30;
    const { g } = crowdBed(t, dur, peak, 420, 900 + i*950, 0.55, 170);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.09 + i*0.11);   // the surge
    g.gain.exponentialRampToValueAtTime(peak*0.55, t + dur*0.46);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    // individual claps scattered through it
    const n = Math.round(5 + i*30);
    for (let k=0;k<n;k++)
      noise(t + 0.04 + Math.random()*dur*0.78, 0.032, 0.025 + i*0.05,
            'bandpass', 1500 + Math.random()*2400, 2.6);
    // chest rumble on the big ones
    if (i > 0.5) sweepTone(72, 44, t, dur*0.65, 0.11*i, 'sine');
    if (i > 0.85){                                        // a bullseye gets a whistle from the stands
      for (let k=0;k<4;k++) noise(t + 0.25 + k*0.14, 0.10, 0.045, 'bandpass', 2900 + k*200, 16);
    }
  },

  /* ── on frame, blocked, narrowly wide: the collective "ohhh" ── */
  crowdGroan(){
    if(!AC) return; const t = AC.currentTime;
    const dur = 1.35;
    const { g } = crowdBed(t, dur, 0.16, 620, 300, 1.1, 120);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.17, t + 0.13);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const o = AC.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(330, t);
    o.frequency.exponentialRampToValueAtTime(186, t + dur*0.8);
    env(o, t, 0.05, dur*0.85, 0.075);
    o.start(t); o.stop(t + dur + 0.1);
  },

  /* ── way off. hostile, wobbling, and it lasts ── */
  crowdBoo(){
    if(!AC) return; const t = AC.currentTime;
    const dur = 2.2;
    const src = AC.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=4.5;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.27, t + 0.20);
    g.gain.setValueAtTime(0.27, t + dur*0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.frequency.setValueAtTime(430, t);
    lp.frequency.exponentialRampToValueAtTime(185, t + dur);
    // the wobble is what makes it read as a boo rather than wind
    const lfo = AC.createOscillator(); lfo.type='sine'; lfo.frequency.value = 5.4;
    const lg = AC.createGain(); lg.gain.value = 0.10;
    lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(t + dur);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.1);
    // two detuned falling saws, beating against each other — the "boooo"
    [0, 16].forEach(d => {
      const o = AC.createOscillator(); o.type='sawtooth'; o.detune.value = d;
      o.frequency.setValueAtTime(168, t);
      o.frequency.exponentialRampToValueAtTime(76, t + dur*0.85);
      const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 680;
      const og = AC.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.08, t + 0.24);
      og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(f); f.connect(og); og.connect(master);
      o.start(t); o.stop(t + dur + 0.1);
    });
  },

  /* ── the sadness. soft minor fall, arrives under the boos ── */
  sadSting(){
    if(!AC) return; const t = AC.currentTime;
    [[440,0],[349.23,0.17],[329.63,0.34],[261.63,0.54]].forEach(([f,d]) =>
      tone(f, t + d, 0.02, 0.55, 0.085, 'triangle'));
    tone(110, t + 0.54, 0.04, 1.5, 0.065, 'sine');
    tone(164.81, t + 0.54, 0.04, 1.5, 0.045, 'sine');
  },

  /* ── held breath while he's planted, waiting on tap 3 ── */
  crowdBreath(){
    if(!AC) return; const t = AC.currentTime;
    const dur = 1.5;
    const { g } = crowdBed(t, dur, 0.06, 300, 1500, 0.8, 400);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.062, t + dur*0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
});

  // the ultra boss a heavier sub sweep + metallic ring (layered under the

      return;
    }

      sweepTone(320,95,t,.20,.30,'sine');
      tone(1200,t+.01,.004,.15,.12,'triangle');
      noise(t,.05,.15,'highpass',3200,1);

    tone(1650,t+.005,.003,.07,.08,'triangle');

function questionBankFor(cat){ return QUESTIONS[cat] || CLUB_QUESTIONS[cat]; }

function buildQuestionSet(cat, n){
  const pool = questionBankFor(cat).slice();
  const out = [];
  for (let i=0; i<n; i++){
    if (!pool.length) pool.push(...QUESTIONS[cat]);
    const q = pool.splice(Math.floor(rnd()*pool.length), 1)[0];
    // shuffle options, remember where the answer went (server would do this — see doc §14.1)
    const opts = q[1].map((text, idx)=>({ text, correct: idx === q[2] }));
    for (let j=opts.length-1; j>0; j--){ const k = Math.floor(rnd()*(j+1)); [opts[j],opts[k]]=[opts[k],opts[j]]; }
    out.push({ text: q[0], opts });
  }
  return out;
}

  S.windParts = []; for (let i=0;i<26;i++) S.windParts.push({x:rnd()*W, y:GOAL.y0+rnd()*GH, s:0.4+rnd()});

function gotoScene(s){ S.scene = s; S.sceneT = 0; }
/* Wipe out, run the scene change at the midpoint, wipe back in — so
   big context switches land as a cut with intent behind it. */
function transitionTo(fn, dur){
  if (S.reduceMotion){ fn(); return; }
  S.transition = { t:0, dur: dur || 0.44, pending: fn };
}
function drawTransition(){
  const tr = S.transition;
  if (tr.dur <= 0) return;
  const p = Math.min(1, tr.t/tr.dur);
  // 0 → 1 → 0: closes over the screen, then peels back off it
  const cover = p < 0.5 ? (p/0.5) : (1-(p-0.5)/0.5);
  const e = cover*cover*(3-2*cover);
  const h = Math.ceil(H*0.5*e)+1;
  rect(0, 0, W, h, C.INK);
  rect(0, H-h, W, h, C.INK);
  b.save(); b.globalAlpha = Math.min(1, e*1.4);
  rect(0, h-1, W, 1, C.GOLDDK); rect(0, H-h, W, 1, C.GOLDDK);
  b.restore();
}

   juggles continuously in closeup; every correct answer buys 5
   more seconds; a wrong answer or an empty clock ends the run.
   ═══════════════════════════════════════════════════════════ */
const KU_START_CLOCK = 15, KU_BONUS = 5;
const KU_REVEAL_END = 0.55;
const JUG = { x: W/2, y: 215, s: 2.35 };   // closeup juggling anchor
const KU_JUG = { x: 172, y: 215, s: 2.56 }; // shifted only enough for the ladder, +25% scale

/* ── trick progression — the combo gets harder to watch as the streak
   grows. 0-5: plain foot-to-foot. 6-10: two touches then a header.
   11+: four knee touches, a header, then one more knee.            */
const TRICK_PATTERNS = [
  ['foot','foot'],
  ['foot','foot','head'],
  ['knee','knee','knee','knee','head','knee']
];
function trickTier(rank){ return rank>=11 ? 2 : rank>=6 ? 1 : 0; }
const CONTACT_Y     = { foot:0,  knee:-17, head:-40 };  // local-space contact height
const CONTACT_REACH = { foot:14, knee:11,  head:9 };    // extra arc height above the peak
function contactX(type, side){ return type==='head' ? 0 : (side===0 ? -5 : 5); }

/* ── the money ladder — a WWTBAM-style safety-net climb. Rank 5 and
   rank 10 are checkpoints: the first wrong answer past a checkpoint
   drops you back to a fresh question at that rank instead of ending
   the run, and spends that checkpoint's one-time save (gold→blue).
   A second failure against a spent checkpoint, or any wrong answer
   before rank 5 is secured, ends the run. Rank 15 is the win.       */
const MONEY_VALUES = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
function fmtMoney(v){
  const s = curSym();
  if (v >= 1000000) return s + (v/1000000) + 'M';
  if (v >= 1000) return s + (v/1000) + 'K';
  return s + v;
}
// rebuilt whenever S.language changes, so every rank label on the ladder
// reflects the chosen language's currency without touching any call site —
// they all just read MONEY_LABELS[rank-1] as before
function rebuildMoneyLabels(){ MONEY_LABELS = MONEY_VALUES.map(fmtMoney); }
let MONEY_LABELS = MONEY_VALUES.map(v => '£'+(v>=1000000?(v/1000000)+'M':v>=1000?(v/1000)+'K':v));

function shuffledPool(cat){
  const pool = questionBankFor(cat).slice();
  for (let j=pool.length-1;j>0;j--){ const k=Math.floor(rnd()*(j+1)); [pool[j],pool[k]]=[pool[k],pool[j]]; }
  return pool;
}
function nextKUQuestion(){
  const ku = S.ku;
  if (!ku.pool.length) ku.pool = shuffledPool(S.cat);
  const q = ku.pool.pop();
  const opts = q[1].map((text, idx)=>({ text, correct: idx === q[2] }));
  for (let j=opts.length-1;j>0;j--){ const k=Math.floor(rnd()*(j+1)); [opts[j],opts[k]]=[opts[k],opts[j]]; }
  ku.q = { text:q[0], opts };
  ku.qPick = -1; ku.qResolved = false; ku.qWasRight = false; ku.qRevealT = 0;
  ku.qShownClock = ku.clock;          // baseline for the "answered fast" badge
}
// cheats that shortcut the ladder itself void a run's club-unlock eligibility;
// purely cosmetic/other-mode cheats (bighead, discomode, nowind, hotshot,
// turbotouch) don't touch Keepy-Ups difficulty and stay unlock-safe.
const BLOCKING_CHEATS = ['nolose','megabucks','timefreeze'];

function beginKeepyups(cat){
  srand(SEED);
  S.mode = 'KEEPYUPS';
  S.cat = cat;
  S.shirtNum = S.playerNumber;
  S.crowdHype = 0; S.gloom = 0;
  S.ku = {
    pool: shuffledPool(cat),
    q:null, qPick:-1, qResolved:false, qWasRight:false, qRevealT:0,
    clock: KU_START_CLOCK, rank:0, best:0, answered:0, asked:0, qShownClock:KU_START_CLOCK,
    checkpoint5Used:false, checkpoint10Used:false, won:false,
    cycleT:0, foot:0, trickIdx:0, tier:0, contactPop:0, contactType:'foot', celebWord:'', bike:null, bonusFlashT:0,
    introChimed:0, introSkip:false, introSkipT:0,
    // set the moment a run-trivialising cheat is seen active (nolose,
    // megabucks, timefreeze); a tainted run still counts for xp and
    // stats, it just can't open a chest or unlock a club
    tainted: BLOCKING_CHEATS.some(k => S.cheats[k])
  };
  if (S.cheats.megabucks){ S.ku.rank = 10; S.ku.best = 10; }   // cheat: start already banked
  gotoScene('KU_INTRO');
}
/* The daily is the same run for everybody on a given date: the seed,
   and therefore the pool order and every option shuffle, comes from
   the calendar rather than from Math.random(). */
function beginDaily(){
  SEED = dailySeed();
  S.isDaily = true;
  beginKeepyups(dailyCat());
}
function pickKUAnswer(i){
  const ku = S.ku;
  if (ku.qResolved) return;
  const spent = ku.qShownClock - ku.clock;      // how long this answer took
  ku.qPick = i; ku.qResolved = true; ku.qRevealT = 0;
  ku.qWasRight = i>=0 && ku.q.opts[i].correct;
  ku.asked = (ku.asked||0) + 1;
  if(ku.qWasRight){
    SFX.correct(); buzz(18); tapFeedback(tapDownX||-1,tapDownY||-1,'good'); pushFeedback('CORRECT · +'+KU_BONUS+'s',C.GREEN);
    unlockAch('on_the_board');
    if (spent < 2) unlockAch('quickdraw');
    if (ku.clock < 2) unlockAch('clutch');
  } else { SFX.wrong(); buzz([30,40,30]); tapFeedback(tapDownX||-1,tapDownY||-1,'bad'); pushFeedback('WRONG',C.RED); }
}
function startBicycle(){
  S.ku.bike = { t:0 };
  SFX.crowdBreath();
  gotoScene('KU_BICYCLE');
}
function startSafetyNet(){
  SFX.rankUp();
  S.safetyNet = { active:true, t:0 };
  gotoScene('KU_SAFETYNET');
}
/* Bank the run into the career: xp, lifetime counters, the daily
   streak, and every badge the run just earned. Builds the summary
   the results screen animates. Called exactly once per run. */
/* A clean (untainted) £1M finish spends the category it was played with —
   nation or club — toward unlocking the next queued Club Legends team, in
   CLUB_UNLOCK_ORDER. Each category can only fund one unlock, ever, which
   is what makes "a team you haven't used before" a real constraint. */
// direct bank purchase, bypassing the £1M-win unlock entirely — priced
// £3,000,000-£6,000,000 across the roster, spread evenly by unlock order
// so later (harder-earned) clubs cost more than earlier ones
function clubDirectPrice(club){
  const n = CLUB_UNLOCK_ORDER.length, idx = CLUB_UNLOCK_ORDER.indexOf(club.id);
  if (idx < 0) return 0;
  const span = n>1 ? idx/(n-1) : 0;
  return Math.round((3000000 + span*3000000)/50000)*50000;
}
function buyClubWithBank(club){
  const price = clubDirectPrice(club);
  if (!price || S.profile.clubsUnlocked.indexOf(club.id) >= 0) return false;
  if (!bankSpend(price)) return false;
  S.profile.clubsUnlocked.push(club.id);
  saveGame();
  return true;
}
function checkClubUnlock(){
  const ku = S.ku, p = S.profile;
  if (!ku.won || ku.tainted) return null;
  if (p.clubUnlockFundsUsed.indexOf(S.cat) >= 0) return null;
  const nextId = CLUB_UNLOCK_ORDER.find(id => p.clubsUnlocked.indexOf(id) < 0);
  if (!nextId) return null;
  p.clubUnlockFundsUsed.push(S.cat);
  p.clubsUnlocked.push(nextId);
  return CLUB_BY_ID[nextId];
}
function finishRun(){
  const ku = S.ku, p = S.profile;
  const levelBefore = levelFromXp(p.xp).level;

  const xpRank    = ku.best * 25;
  const xpCorrect = ku.answered * 8;
  const xpWin     = ku.won ? 400 : 0;
  const base      = xpRank + xpCorrect + xpWin;
  const xpDaily   = S.isDaily ? Math.round(base * 0.5) : 0;
  const total     = base + xpDaily;

  p.xp += total;
  p.runs++;
  p.answered += (ku.asked || 0);
  p.correct  += ku.answered;
  p.bestRank = Math.max(p.bestRank, ku.best);
  // the bank takes a "prize money" cut of whatever rung was reached —
  // banked permanently, unlike ku's own in-run money which resets every
  // run. Deliberately a fraction, not the full amount: it's a slow second
  // path to a direct club/strip buy, not a way to bypass the £1M unlock
  if (ku.best > 0) bankAdd(MONEY_VALUES[ku.best-1] * 0.1);
  if (ku.won) p.ladderCompletes++;
  if (ku.best > S.bestEverRank) S.bestEverRank = ku.best;
  if (CATS.indexOf(S.cat) >= 0){
    noteTeamPlayed(S.cat);
  } else if (p.clubsPlayed.indexOf(S.cat) < 0){
    p.clubsPlayed.push(S.cat);
  }
  if (S.isDaily) recordDailyResult(ku.best);

  const before = Object.keys(p.achievements).length;
  if (ku.won && !ku.checkpoint5Used && !ku.checkpoint10Used) unlockAch('no_net');
  if (ku.checkpoint5Used && ku.checkpoint10Used) unlockAch('both_nets');

  // a clean win on a nation you've never beaten opens the chest — clubs
  // don't feed the vault, that reward track predates Club Legends and
  // stays scoped to the original six nations
  S.chestReward = null;
  if (ku.won && !ku.tainted && CATS.indexOf(S.cat) >= 0) S.chestReward = openChest();

  const clubUnlock = checkClubUnlock();
  // DEFENDER mode: locked behind one clean (non-tainted) £1,000,000 finish —
  // same integrity rule as the club-unlock/chest tracks above, so cheats
  // that trivialise the ladder can't shortcut it either
  const defenderUnlock = !p.defenderUnlocked && ku.won && !ku.tainted;
  if (defenderUnlock) p.defenderUnlocked = true;
  checkMilestoneAch();
  if (clubUnlock || defenderUnlock) SFX.rankUp();

  const levelAfter = levelFromXp(p.xp).level;
  S.runSummary = {
    xpRank, xpCorrect, xpWin, xpDaily, total,
    levelBefore, levelAfter,
    xpAtStart: p.xp - total,
    anim: 0,
    newAchs: Object.keys(p.achievements).length - before,
    clubUnlock, defenderUnlock
  };
  saveGame();
}
function endKeepyups(){
  finishRun();
  // a chest to open takes precedence over the results screen; the
  // results are still waiting behind it when the ceremony finishes
  if (S.chestReward){ SFX.crowdBreath(); gotoScene('KU_CHEST'); return; }
  if (S.ku.won){ gotoScene('KU_OVER'); return; }
  SFX.miss(); SFX.crowdBoo();
  setTimeout(()=>{ if (audioOn && AC) SFX.sadSting(); }, 300);
  S.gloom = 1; S.hitstop = 0.10; buzz([40,60,90]);
  gotoScene('KU_OVER');
}

function updateKeepyups(dt){
  const ku = S.ku;

  if (S.scene === 'KU_INTRO'){
    if (ku.introSkip){
      if (S.sceneT < KU_INTRO_SCROLL) S.sceneT += dt * KU_INTRO_SKIP_BOOST;   // rush, don't jump-cut
      ku.introSkipT = Math.min(1, ku.introSkipT + dt/KU_INTRO_SKIP_ZOOM_DUR);
    }
    if (S.sceneT < KU_INTRO_SCROLL){
      const e = kuIntroEase(Math.min(1, S.sceneT/KU_INTRO_SCROLL));
      const frontier = kuIntroCenterRank(e);
      while (ku.introChimed < frontier){ ku.introChimed++; kuIntroChime(ku.introChimed); }
    } else if (ku.introChimed < 15){
      while (ku.introChimed < 15){ ku.introChimed++; kuIntroChime(ku.introChimed); }
    }
    const holdDur = ku.introSkip ? KU_INTRO_SKIP_HOLD : KU_INTRO_HOLD;
    if (S.sceneT > KU_INTRO_SCROLL + holdDur) gotoScene('KU_READY');
    return;
  }

  const juggling = S.scene==='KU_READY' || S.scene==='KU_PLAY' || S.scene==='KU_HATTRICK' || S.scene==='KU_SAFETYNET';
  if (juggling){
    if (!ku.tainted) ku.tainted = BLOCKING_CHEATS.some(k => S.cheats[k]);   // dev menu toggled mid-run
    ku.cycleT += dt * (S.cheats.turbotouch ? 2.2 : 1);   // cheat: double-time tricks
    if (ku.cycleT >= 1){
      ku.cycleT -= 1;
      const tier = trickTier(ku.rank);
      if (tier !== ku.tier){ ku.tier = tier; ku.trickIdx = 0; }
      else { const pat = TRICK_PATTERNS[ku.tier]; ku.trickIdx = (ku.trickIdx+1) % pat.length; }
      ku.foot = 1-ku.foot;
      ku.contactPop = 1;
      ku.contactType = TRICK_PATTERNS[ku.tier][ku.trickIdx];
      SFX.juggleBop(ku.contactType, ku.foot===0);
      S.shake = Math.max(S.shake, ku.contactType==='head' ? 1.2 : 0.8);
    }
    ku.contactPop = Math.max(0, ku.contactPop - dt*3.2);
  }
  ku.bonusFlashT = Math.max(0, ku.bonusFlashT - dt*1.2);

  if (S.scene === 'KU_PLAY'){
    if (!ku.qResolved){
      if (!S.cheats.timefreeze) ku.clock -= dt;    // cheat: clock never runs down
      if (ku.clock < 3 && S.t - lastTickSound > 0.25){ SFX.tick(true); lastTickSound = S.t; }
      else if (ku.clock >= 3 && S.t - lastTickSound > 0.5){ SFX.tick(false); lastTickSound = S.t; }
      if (ku.clock <= 0){ ku.clock = 0; endKeepyups(); return; }
    } else {
      ku.qRevealT += dt;
      if (ku.qRevealT >= KU_REVEAL_END){
        if (!ku.qWasRight){
          if (S.cheats.nolose){ nextKUQuestion(); return; }   // cheat: wrong answers just don't count
          // the ladder: fail before rank 5 and there's no net yet; fail in
          // 6-10 or 11-15 and the checkpoint behind you saves you exactly
          // once, dropping you back to a fresh question at that checkpoint
          const attempted = ku.rank + 1;
          if (attempted <= 5){ endKeepyups(); return; }
          else if (attempted <= 10){
            if (!ku.checkpoint5Used){ ku.checkpoint5Used = true; ku.rank = 4; startSafetyNet(); return; }
            else { endKeepyups(); return; }
          } else {
            if (!ku.checkpoint10Used){ ku.checkpoint10Used = true; ku.rank = 9; startSafetyNet(); return; }
            else { endKeepyups(); return; }
          }
        }
        ku.clock = Math.min(60, ku.clock + KU_BONUS);
        ku.bonusFlashT = 1;
        ku.rank++; ku.best = Math.max(ku.best, ku.rank); ku.answered++;
        if (ku.rank > S.bestEverRank){ S.bestEverRank = ku.rank; saveGame(); }
        if (ku.rank >= 5)  unlockAch('pocket_change');
        if (ku.rank >= 10) unlockAch('tidy_sum');
        if (ku.rank >= 11) unlockAch('showboat');
        if (ku.rank === 15){
          ku.won = true; ku.celebWord = MONEY_LABELS[14]+'!!';
          spawnConfetti(36); triggerCrowdBurst();
          startBicycle();
        } else if (ku.rank % 5 === 0){
          ku.celebWord = MONEY_LABELS[ku.rank-1]+' '+t('secured_suffix');
          spawnConfetti(24); triggerCrowdBurst();
          startBicycle();
        } else if (ku.rank % 3 === 0){
          ku.celebWord = t('hat_trick'); S.hattrick = {active:true, t:0};
          unlockAch('hattrick'); gotoScene('KU_HATTRICK');
        } else {
          nextKUQuestion();
        }
      }
    }
    return;
  }

  if (S.scene === 'KU_HATTRICK'){
    if (S.sceneT > 1.3){ nextKUQuestion(); gotoScene('KU_PLAY'); }
    return;
  }

  if (S.scene === 'KU_SAFETYNET'){
    if (S.sceneT > 1.6){ nextKUQuestion(); gotoScene('KU_PLAY'); }
    return;
  }

  if (S.scene === 'KU_OVER'){
    if (S.runSummary && S.runSummary.anim < 1){
      S.runSummary.anim = Math.min(1, S.runSummary.anim + dt*0.75);
    }
    return;
  }

  if (S.scene === 'KU_CHEST'){
    const before = S.sceneT - dt;
    if (before < CHEST_RATTLE && S.sceneT >= CHEST_RATTLE){   // the lid goes
      SFX.boom(); SFX.crowdRoar(1);
      spawnConfetti(44); triggerCrowdBurst();
      S.flash = Math.max(S.flash, 0.5); S.shake = Math.max(S.shake, 4);
      S.crowdHype = 1; buzz([50,40,80]);
    }
    if (S.sceneT < CHEST_RATTLE && S.sceneT % 0.28 < dt) SFX.tick(true);  // it rattles
    return;
  }

  if (S.scene === 'KU_BICYCLE'){
    const bk = ku.bike;
    const before = bk.t;
    bk.t += dt;
    if (before < 0.30 && bk.t >= 0.30){          // contact — the ball launches
      SFX.boot(2); S.flash = 0.4; S.shake = 5; S.hitstop = 0.05;
    }
    if (before < 1.25 && bk.t >= 1.25){          // it sinks into the goal
      SFX.ring(3); SFX.crowdRoar(1); S.crowdHype = 1; S.flash = Math.max(S.flash,0.3);
    }
    if (bk.t > 2.3){
      if (ku.won){ endKeepyups(); }
      else { nextKUQuestion(); gotoScene('KU_PLAY'); }
    }
    return;
  }
  // KU_READY / KU_OVER: nothing else to simulate
}

/* ── set up the upcoming shot ──────────────────────────────── */
function prepShot(){
  const ci = ROUND_CONDS[S.round][S.shot];
  S.cond = CONDS[ci];
  S.wind = S.cheats.nowind ? 0 : rrange(S.cond.wind[0], S.cond.wind[1]);   // cheat: dead calm
  S.windDir = rnd() < 0.5 ? -1 : 1;
  S.clock = 10;
  S.gauge = 0; S.gaugeDir = 1;
  S.pureFlags = [false,false];
  S.lockP = S.lockA = 0;
  S.aimU = 0.5; S.aimV = 0.55; S.aimSet = false;
  S.perfect = { active:false, t:0 };
  S.ball = null; S.impact = null; S.result = null; S.trail = [];
  S.runT = 0; S.clockAtLock = 10;
  S.keeperOn = (S.round === 2);
  S.keeperU = 0.5;

  const r = targetRadius();
  if (S.round === 0){
    const spots = [[0.22,0.72],[0.5,0.30],[0.78,0.74],[0.32,0.52],[0.68,0.46]];
    const sp = spots[rint(0, spots.length-1)];
    S.target = { u:sp[0], v:sp[1], r, motion:null };
  } else if (S.round === 1){
    const kinds = ['SWEEP','PENDULUM','DRIFT'];
    const kind = kinds[Math.min(S.shot, 2)];
    S.target = { u:0.5, v:0.55, r, motion:{ kind, w:rrange(1.5,2.3), amp:rrange(0.26,0.34), ph:rnd()*6.28, vamp: kind==='DRIFT'?0.16:0 } };
  } else {
    S.target = { u:0.5, v:0.085, r:r*0.92, motion:null };   // floor, dead centre
    S.keeperMotion = { w: rrange(1.7, 2.5), amp:0.36, ph:rnd()*6.28, feint: S.shot===2 };
  }

  S.smokePuffs = [];
  if (S.cond.smoke){
    for (let i=0;i<5;i++) S.smokePuffs.push({ x:rnd()*W, y:GOAL.y0+rnd()*GH, r:rrange(18,34), sp:rrange(6,16)*(rnd()<0.5?-1:1), ph:rnd()*6.28 });
  }

  const qi = S.round*3 + S.shot;
  S.q = S.questions[qi]; S.qPick = -1; S.qTimer = 5; S.qResolved = false; S.qWasRight = false;
  S.qRevealT = 0; S.oppApplied = false;
  // the ghost's answer is fixed the moment the question is dealt — it does not
  // react to yours. In the real build this is a replayed human input.
  const correctIdx = S.q.opts.findIndex(o => o.correct);
  const wrongIdx = S.q.opts.map((o,k)=>k).filter(k => k !== correctIdx);
  S.oppWasRight = rnd() < 0.62;
  S.oppAnswer = S.oppWasRight ? correctIdx : wrongIdx[rint(0, wrongIdx.length-1)];
  S.oppAnsweredAt = rrange(0.7, 4.3);
  gotoScene('QUESTION');
}

/* ── target / keeper position at a given time ──────────────── */
function targetAt(t){
  const m = S.target.motion;
  if (!m) return { u:S.target.u, v:S.target.v };
  let u = 0.5, v = S.target.v;
  const a = t*m.w + m.ph;
  if (m.kind === 'PENDULUM')      u = 0.5 + m.amp * Math.sin(a) * (0.75 + 0.25*Math.abs(Math.cos(a)));
  else                             u = 0.5 + m.amp * Math.sin(a);
  if (m.vamp) v = S.target.v + m.vamp * Math.sin(a*1.7 + 1.2);
  return { u, v };
}
function keeperAt(t){
  const m = S.keeperMotion; if (!m) return 0.5;
  let a = t*m.w + m.ph;
  let u = 0.5 + m.amp * Math.sin(a);
  if (m.feint) u += 0.10 * Math.sin(a*3.1);      // half-step reversal
  return Math.max(0.10, Math.min(0.90, u));
}

/* ═══════════════════════════════════════════════════════════
   SHOT RESOLUTION — the deterministic core (doc §14.1)
   three timestamps in, trajectory + score out
   ═══════════════════════════════════════════════════════════ */
function resolveShot(){
  const card = CARDS[S.round];
  const p = S.lockP, a = S.lockA;

  // flight time: harder = faster = less wind, less lead needed
  const flight = (0.88 - 0.36*p) / card.power;

  // POWER: too soft drops it low and pulls it, too hard sends it up and wide
  const lo = 0.70 - card.band/2, hi = 0.70 + card.band/2;
  const coreLo = 0.70 - card.core/2, coreHi = 0.70 + card.core/2;
  const powerPure = p >= coreLo && p <= coreHi;
  const powerClean = p >= lo && p <= hi;
  let vErr = 0, uErrP = 0;
  if (p < lo){ const e = lo - p; vErr -= e*1.35; uErrP += (rnd()-0.5)*e*0.9; }
  else if (p > hi){ const e = p - hi; vErr += e*1.25; uErrP += (rnd()-0.5)*e*1.1; }

  // ACCURACY: how precisely you executed the spot you aimed at. Miss the
  // band and the strike drifts off your intended point in a random
  // direction; the sweep direction at the tap still sets curl.
  const aLo = 0.5 - card.band/2, aHi = 0.5 + card.band/2;
  const aCoreLo = 0.5 - card.core/2, aCoreHi = 0.5 + card.core/2;
  const accPure = a >= aCoreLo && a <= aCoreHi;
  const accClean = a >= aLo && a <= aHi;
  let uErrA = 0, vErrA = 0;
  if (a < aLo || a > aHi){
    const e = a < aLo ? (aLo - a) : (a - aHi);
    const ang = rnd()*6.2832;
    uErrA = Math.cos(ang) * e * 1.15;
    vErrA = Math.sin(ang) * e * 0.85;
  }

  // curl from the sweep direction on the accuracy tap
  const curl = S.curlDir * card.curl * (1 - p*0.45) * 0.13;

  // wind, acting after commitment
  const drift = S.windDir * (S.wind/24) * flight * 0.55;

  const pure = powerPure && accPure;     // both gold cores — a PERFECT SHOT
  const clean = powerClean && accClean;

  const iu = S.aimU + curl + drift + uErrP + uErrA;
  const iv = S.aimV + vErr + vErrA;

  // where things are when the ball arrives
  const arriveT = S.t + flight;
  const tp = targetAt(arriveT);
  const ku = S.keeperOn ? keeperAt(arriveT) : -9;

  const ix = u2x(iu), iy = v2y(iv);
  const tx = u2x(tp.u), ty = v2y(tp.v);
  const dist = Math.hypot(ix - tx, iy - ty);
  const R = S.target.r;

  // classify
  let ring = -1, base = 0, blocked = false, offTarget = false;
  if (iu < -0.02 || iu > 1.02 || iv < -0.02 || iv > 1.02) offTarget = true;
  else if (S.keeperOn && Math.abs(iu - ku) < 0.095 && iv < 0.44) blocked = true;
  else {
    const t = dist / R;
    if (t < 0.18){ ring = 3; base = 1000; }
    else if (t < 0.42){ ring = 2; base = 600; }
    else if (t < 0.70){ ring = 1; base = 300; }
    else if (t <= 1.00){ ring = 0; base = 100; }
  }

  // continuous falloff inside the ring (doc §6)
  if (base > 0){
    const edges = [1.00, 0.70, 0.42, 0.18];
    const inner = [0.70, 0.42, 0.18, 0.00];
    const t = dist / R;
    const frac = (edges[ring] - t) / Math.max(0.0001, edges[ring] - inner[ring]);
    base = Math.round(base * (1 + 0.15*Math.max(0, Math.min(1, frac))));
  }

  const c = S.clockAtLock;
  const tempoMult = c >= 6 ? 1.5 : c >= 3.5 ? 1.2 : c >= 1 ? 1.0 : 0.85;
  const pts = Math.round(base * tempoMult * S.cond.mult * ROUND_MULT[S.round] * (pure ? 1.25 : 1));

  let grade;
  if (offTarget || S.clockAtLock <= 0) grade = 'F';
  else if (blocked || ring < 0) grade = 'D';
  else if (ring === 3 && pure && S.cond.mult > 1 && tempoMult >= 1.2) grade = 'S';
  else if (ring === 3 || (ring === 2 && pure)) grade = 'A';
  else if (ring === 2 || (ring === 1 && pure)) grade = 'B';
  else grade = 'C';

  S.result = { pts, ring, grade, blocked, offTarget, pure, clean, tempoMult, dist, R, flight, ku, tp };
  S.impact = { x:ix, y:iy, u:iu, v:iv };
  S.ball = { t:0, dur:flight, from:{x:SPOT.x, y:SPOT.y}, to:{x:ix, y:iy}, curl, done:false };

  SFX.boot(offTarget ? 0 : (pure ? 2 : 1));
  if (pure){
    S.hitstop = 0.075; S.aberr = 0.30; S.flash = 0.35;
    S.perfect = { active:true, t:0 };
    SFX.perfectCue();
  }
  S.shake = pure ? 4.5 : 2.2;
}

function applyResult(){
  const r = S.result;
  S.score += r.pts;
  S.grades.push(r.grade);
  if (r.pts > S.bestShot) S.bestShot = r.pts;
  if (r.ring === 3){ S.bullseyes++; unlockAch('sharpshooter'); }
  if (r.pure) unlockAch('pure_strike');
  if (r.ring >= 0) buzz(r.ring === 3 ? 45 : 20);

  // opponent ghost (doc §4.3 — a stored human replay in the real build)
  const opp = Math.round(rrange(140, 780) * (1 + 0.09*S.opp.streak)
                         * ROUND_MULT[S.round] * rrange(1.0, 1.45));
  S.oppScore += opp;

  // how far outside the goal did it finish?
  const i = S.impact;
  const off = Math.max(0, -i.u, i.u - 1, -i.v, i.v - 1);

  if (r.ring >= 0){                                   // on target
    SFX.ring(r.ring);
    SFX.crowdRoar([0.15, 0.38, 0.68, 1.0][r.ring]);
    S.crowdHype = [0.35, 0.6, 0.85, 1.0][r.ring];
    if (r.ring === 3){ S.flash = Math.max(S.flash, 0.3); S.shake = Math.max(S.shake, 3.5); }
  } else if (r.blocked){
    SFX.block(); SFX.crowdGroan(); S.gloom = 0.55;
  } else if (r.offTarget && off > 0.18){              // way off — they let him know
    SFX.miss(); SFX.crowdBoo();
    setTimeout(()=>{ if (audioOn && AC) SFX.sadSting(); }, 420);
    S.gloom = 1; S.hitstop = 0.10;
  } else {                                            // on frame, or narrowly wide
    SFX.miss(); SFX.crowdGroan(); S.gloom = 0.6;
  }
}

function advance(){
  S.shot++;
  if (S.shot >= 3){
    S.shot = 0; S.round++;
    if (S.round >= 3){
      SFX.whistleLong();
      const p = S.profile;
      p.matches++;
      if (S.score > S.oppScore){ p.matchWins++; unlockAch('match_winner'); }
      p.xp += Math.round(S.score/12) + (S.score > S.oppScore ? 200 : 0);
      noteTeamPlayed(S.cat); checkMilestoneAch(); saveGame();
      gotoScene('MATCHEND'); return;
    }
    gotoScene('ROUNDCARD'); return;
  }
  prepShot();
}

/* ═══════════════════════════════════════════════════════════
   INPUT — one tap zone, the whole screen
   ═══════════════════════════════════════════════════════════ */
function tapAt(px, py){
  initAudio();
  // a wipe is mid-flight and about to swap scenes — swallow taps until it
  // lands, so an eager double-tap can't start two runs at once
  if (S.transition.pending) return;
  if (S.settingsOpen){ handleSettingsTap(px, py); return; }
  if (S.devPinOpen){ handleDevPinTap(px, py); return; }
  if (S.devMenuOpen){ handleDevMenuTap(px, py); return; }
  switch (S.scene){
    case 'LANGUAGE': {
      const code = langHit(px, py);
      if (!code) return;
      SFX.lock(0, true); S.language = code; rebuildMoneyLabels(); gotoScene('NAME');
      return;
    }
    case 'NAME': {
      const hit = nameHit(px, py);
      if (!hit) return;
      if (hit.length === 6){                     // NAME_RECTS: [key, delta, x, y, w, h]
        if (hit[0] === 'num'){ S.playerNumber = ((S.playerNumber - 1 + hit[1] + 99) % 99) + 1; SFX.tick(true); }
        else if (hit[0] === 'go'){
          if (!S.playerName) S.playerName = t('name_label');
          SFX.whistleShort(); saveGame(); gotoScene('CREATE');
        }
      } else {                                    // KEYBOARD_RECTS: [ch, x, y, w, h]
        const ch = hit[0];
        if (ch === '⌫') S.playerName = S.playerName.slice(0,-1);
        else if (S.playerName.length < 12) S.playerName += ch;
        SFX.tick(true);
      }
      return;
    }
    case 'CREATE': {
      const hit = createHit(px, py);
      if (!hit) return;
      if (hit[4] === 'go'){ confirmCharacter(); SFX.whistleShort(); gotoScene('TITLE'); }
      else if (hit[4] === 'strips'){
        if (bankSpend(STRIPS_PRICE)){ S.profile.stripsUnlocked = true; saveGame(); spawnConfetti(14); SFX.rankUp(); }
        else SFX.wrong();
      }
      else cycleCharacter(hit[4], hit[5]);
      return;
    }
    case 'PROFILE':
      if (S.achDetail){ S.achDetail = null; SFX.lock(0,true); return; }   // any tap dismisses the card
      { const hit = ACH_RECTS.find(r=>px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]);
        if (hit){ S.achDetail = hit[4]; SFX.lock(0,true); return; } }
      if (PROFILE_BACK && px>=PROFILE_BACK[0] && px<=PROFILE_BACK[0]+PROFILE_BACK[2] &&
          py>=PROFILE_BACK[1] && py<=PROFILE_BACK[1]+PROFILE_BACK[3]){
        SFX.lock(0,true); gotoScene('TITLE');
      }
      return;
    case 'CLUBS': handleClubsTap(px, py); return;
    case 'WORLDTEAMS': handleWorldTeamsTap(px, py); return;
    case 'HUB': handleHubTap(px, py); return;
    case 'TITLE':
      // edit player, career card, daily, mode toggle, then category grid
      if (editHit(px, py)){ SFX.lock(0, true); resetCreateShow(); gotoScene('CREATE'); return; }
      if (PROFILE_RECT && px>=PROFILE_RECT[0] && px<=PROFILE_RECT[0]+PROFILE_RECT[2] &&
          py>=PROFILE_RECT[1] && py<=PROFILE_RECT[1]+PROFILE_RECT[3]){
        SFX.lock(0,true); S.profileScroll = 0; gotoScene('PROFILE'); return;
      }
      if (DAILY_RECT && px>=DAILY_RECT[0] && px<=DAILY_RECT[0]+DAILY_RECT[2] &&
          py>=DAILY_RECT[1] && py<=DAILY_RECT[1]+DAILY_RECT[3]){
        SFX.whistleShort(); buzz(20); transitionTo(()=> beginDaily()); return;
      }
      { const m = modeHit(px, py); if (m){
          if (m==='DEFENDER' && !S.profile.defenderUnlocked){
            S.clubHintMsg = 'Win '+curSym()+'1,000,000 in Keepy-Ups to unlock DEFENDER.';
            S.clubHintT = 2.6; SFX.lock(0,false);
            return;
          }
          S.menuMode = m; SFX.lock(0, true); if (m==='DEFENDER') { transitionTo(()=>beginDefender()); } return;
      } }
      if (WORLDTEAMS_RECT && px>=WORLDTEAMS_RECT[0] && px<=WORLDTEAMS_RECT[0]+WORLDTEAMS_RECT[2] &&
          py>=WORLDTEAMS_RECT[1] && py<=WORLDTEAMS_RECT[1]+WORLDTEAMS_RECT[3]){
        SFX.lock(0,true); gotoScene('WORLDTEAMS'); return;
      }
      if (CLUBS_RECT && px>=CLUBS_RECT[0] && px<=CLUBS_RECT[0]+CLUBS_RECT[2] &&
          py>=CLUBS_RECT[1] && py<=CLUBS_RECT[1]+CLUBS_RECT[3]){
        SFX.lock(0,true); S.clubsScroll = 0; gotoScene('CLUBS'); return;
      }
      if (HUB_RECT && px>=HUB_RECT[0] && px<=HUB_RECT[0]+HUB_RECT[2] &&
          py>=HUB_RECT[1] && py<=HUB_RECT[1]+HUB_RECT[3]){
        SFX.lock(0,true); S.hub.scroll = 0; gotoScene('HUB');
        fetchFixtures(); fetchNews();
        return;
      }
      return;
    case 'DEFENDER_INTRO': case 'DEFENDER_RUN': case 'DEFENDER_LEVELUP': case 'DEFENDER_SHOP': case 'DEFENDER_OVER': defTap(px,py); return;
    case 'ROUNDCARD': if (S.sceneT > 0.35){ SFX.whistleShort(); prepShot(); } return;
    case 'QUESTION': {
      if (S.qResolved) return;
      const i = answerHit(px, py);
      if (i >= 0) pickAnswer(i);
      return;
    }
    case 'READY': SFX.whistleShort(); gotoScene('AIM'); return;
    case 'AIM': {
      const u = Math.max(0.04, Math.min(0.96, (px - GOAL.x0)/GW));
      const v = Math.max(0.04, Math.min(0.96, (GOAL.y1 - py)/GH));
      S.aimU = u; S.aimV = v; S.aimSet = true;
      SFX.lock(0, true);
      gotoScene('P_POWER'); return;
    }
    case 'P_POWER':
      S.lockP = S.cheats.hotshot ? 0.70 : S.gauge;    // cheat: always dead in the gold core
      { const c = CARDS[S.round];
        S.pureFlags[0] = Math.abs(S.lockP-0.70) <= c.core/2;
        SFX.lock(1, Math.abs(S.lockP-0.70) <= c.band/2); SFX.crowdBreath(); }
      S.gauge = 0; S.gaugeDir = 1; gotoScene('P_ACCURACY'); return;
    case 'P_ACCURACY': {
      S.lockA = S.cheats.hotshot ? 0.5 : S.gauge; S.curlDir = S.gaugeDir; S.clockAtLock = S.clock;
      const c = CARDS[S.round];
      S.pureFlags[1] = Math.abs(S.lockA-0.5) <= c.core/2;
      SFX.lock(2, true);
      gotoScene('STRIKE'); return;     // he swings; contact resolves at the end
    }
    case 'RESOLVE': if (S.sceneT > 0.5) advance(); return;
    case 'MATCHEND': if (S.sceneT > 0.6){ SEED = (SEED*1664525+1013904223)>>>0; gotoScene('TITLE'); } return;

    case 'KU_READY': SFX.whistleShort(); nextKUQuestion(); gotoScene('KU_PLAY'); return;
    case 'KU_PLAY': {
      if (S.ku.qResolved) return;
      const i = answerHit(px, py);
      if (i >= 0) pickKUAnswer(i);
      return;
    }
    case 'KU_HATTRICK': case 'KU_BICYCLE': return;   // these play out on their own — under 3s, no skip needed
    case 'KU_INTRO': {
      const ku = S.ku;
      if (S.sceneT >= KU_INTRO_SCROLL){ gotoScene('KU_READY'); return; }   // already at the summit — go
      if (!ku.introSkip){ ku.introSkip = true; SFX.lock(0,true); }        // else: kick off the skip-rush
      return;
    }
    case 'KU_CHEST':
      // no skipping the rattle — the reveal is the whole point
      if (S.sceneT > CHEST_RATTLE + 0.5){ SFX.lock(0,true); gotoScene('KU_OVER'); }
      return;
    case 'KU_OVER': {
      if (S.sceneT < 0.4) return;
      // let an impatient tap fast-forward the xp count-up before it acts
      if (S.runSummary && S.runSummary.anim < 1){ S.runSummary.anim = 1; return; }
      const hit = KUOVER_RECTS.find(r=>px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]);
      const key = hit ? hit[4] : 'title';
      if (key === 'share'){ doShare(); return; }
      if (key === 'again'){
        SFX.whistleShort();
        const cat = S.cat;
        SEED = (SEED*1664525+1013904223)>>>0;
        // the daily is one attempt a day — a replay is an ordinary run
        S.isDaily = false;
        transitionTo(()=> beginKeepyups(cat));
        return;
      }
      SEED = (SEED*1664525+1013904223)>>>0;
      transitionTo(()=> gotoScene('TITLE'));
      return;
    }
  }
}
/* Shared-question flow, QuizUp-style:
     0.00  you commit — neutral lock, nothing revealed
     0.28  their arrow slides onto whichever option they took
     0.62  the answer resolves for both of you
     1.50  on to the shot                                          */
const REVEAL_OPP = 0.28, REVEAL_ANS = 0.62, REVEAL_END = 1.50;
function pickAnswer(i){
  if (S.qResolved) return;
  S.qPick = i; S.qResolved = true; S.qRevealT = 0;
  S.qWasRight = i >= 0 && S.q.opts[i].correct;
  SFX.lock(1, true);                       // committed. no verdict yet.
}
function applyQuestion(){
  if (S.qWasRight){
    S.streak = Math.min(5, S.streak + 1); S.triviaRight++;
    SFX.correct(); S.inflate = 0.55; buzz(22); pushFeedback('CORRECT',C.GREEN); tapFeedback(tapDownX||-1,tapDownY||-1,'good');
    setTimeout(()=>{ if (audioOn && AC) SFX.inflate(); }, 200);
  } else {
    S.streak = 0; SFX.wrong(); buzz([25,45,25]); pushFeedback('WRONG',C.RED); tapFeedback(tapDownX||-1,tapDownY||-1,'bad'); S.streakBreak = 0.5; S.shake = 2;
  }
  if (S.oppWasRight){ S.opp.streak = Math.min(5, S.opp.streak + 1); S.opp.right++; }
  else S.opp.streak = 0;
  S.target.r = (S.round===2 ? 0.92 : 1) * targetRadius();
}

// hit regions
let ANSWER_RECTS = [], CAT_RECTS = [], MODE_RECTS = [], CREATE_RECTS = [], EDIT_RECT = null, CLUBS_RECT = null, WORLDTEAMS_RECT = null, HUB_RECT = null;
function answerHit(px,py){ for (let i=0;i<ANSWER_RECTS.length;i++){ const r=ANSWER_RECTS[i];
  if (px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]) return i; } return -1; }
function catHit(px,py){ for (const r of CAT_RECTS){ if (px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]) return r[4]; } return null; }
function modeHit(px,py){ for (const r of MODE_RECTS){ if (px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]) return r[4]; } return null; }
function createHit(px,py){ for (const r of CREATE_RECTS){ if (px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]) return r; } return null; }
function editHit(px,py){ const r=EDIT_RECT; return r && px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3]; }

function cycleCharacter(key, dir){
  const c = S.character;
  const wrap = (i,n) => (i+dir+n)%n;
  if (key==='team') c.teamIdx = wrap(c.teamIdx, TEAM_OPTS.length);
  else if (key==='body') c.bodyIdx = wrap(c.bodyIdx, BODY_OPTS.length);
  else if (key==='height') c.heightIdx = wrap(c.heightIdx, HEIGHT_OPTS.length);
  else if (key==='skin') c.skinIdx = wrap(c.skinIdx, SKINS.length);
  else if (key==='hair') c.hairIdx = wrap(c.hairIdx, HAIRS.length);
  else if (key==='shirt') c.shirtIdx = wrap(c.shirtIdx, activePalette().length);
  else if (key==='socks') c.sockIdx = wrap(c.sockIdx, activePalette().length);
  else if (key==='shoes') c.shoeIdx = wrap(c.shoeIdx, activePalette().length);
  if (S.createShow.phase === 'REST'){ S.createShow.phase = 'JUGGLE'; S.createShow.phaseT = 0; }
  SFX.tick(false);
}
function confirmCharacter(){
  S.hair = HAIRS[S.character.hairIdx];
  S.skin = SKINS[S.character.skinIdx];
  saveGame();
}
function resetCreateShow(){
  S.createShow = { phase:'REST', phaseT:0, cycleT:0, foot:0, routineIdx:0, beatIdx:-1 };
}

/* ── create-a-player showcase — ball rests at his right foot until you
   touch a control, then he starts juggling. After CS_TRICK_DELAY
   seconds he breaks into one of Maradona's warm-up routines:
   (A) a huge flick that leaves the frame entirely, tracked by eye
       through an anticipation beat while the crowd builds, then a
       BOOM perfect trap on the back of his neck and an eruption; or
   (B) shoulder-to-shoulder keepy-ups arcing well above his head,
       which settle onto the crown of his head for a five-second
       balancing act before dropping back down.
   Routines alternate, then it's back to plain juggling.            */
const CS_TRICK_DELAY = 15;
const CS_HC_LAUNCH = 0.30, CS_HC_EXIT = 0.75, CS_HC_ANTIC_END = 2.60, CS_HC_CATCH = 3.35, CS_HC_TOTAL = 4.6;
const CS_SH_LIFT = 0.35, CS_SH_BOUNCE_PERIOD = 0.75, CS_SH_BOUNCES = 5, CS_SH_SETTLE = 0.4;
const CS_SH_TOTAL = CS_SH_LIFT + CS_SH_BOUNCES*CS_SH_BOUNCE_PERIOD + CS_SH_SETTLE;
const CS_HB_HOLD = 5.0, CS_HB_DROP = 0.5, CS_HB_TOTAL = CS_HB_HOLD + CS_HB_DROP;

function spawnConfetti(n){
  for (let i=0;i<n;i++){
    S.confetti.push({
      x: rnd()*W, y: -10 - rnd()*60,
      vy: 40 + rnd()*35, sway: 1.5 + rnd()*2.5, ph: rnd()*6.28,
      col: [C.GOLD,C.GOLD2,C.RED,C.BLUE,C.GREEN,'#ffffff'][rint(0,5)],
      size: 2 + rint(0,1)
    });
  }
}
function drawConfetti(){
  for (const p of S.confetti) rect(p.x, p.y, p.size, p.size, p.col);
}

function updateCreateShow(dt){
  const cs = S.createShow;

  if (cs.phase === 'REST') return;
  const before = cs.phaseT;
  cs.phaseT += dt;
  const after = cs.phaseT;

  if (cs.phase === 'JUGGLE'){
    cs.cycleT += dt;
    if (cs.cycleT >= 1){
      cs.cycleT -= 1; cs.foot = 1-cs.foot;
      SFX.juggleBop('foot', cs.foot===0);
      S.shake = Math.max(S.shake, 0.6);
    }
    if (after >= CS_TRICK_DELAY){
      cs.phase = cs.routineIdx===0 ? 'HIGH_CATCH' : 'SHOULDERS';
      cs.phaseT = 0; cs.beatIdx = -1;
    }
    return;
  }

  if (cs.phase === 'HIGH_CATCH'){
    if (before < CS_HC_EXIT && after >= CS_HC_EXIT) SFX.boot(1);                 // the powerful kick away
    if (before < CS_HC_ANTIC_END-1.2 && after >= CS_HC_ANTIC_END-1.2) SFX.crowdBreath();  // tension starts
    if (after > CS_HC_EXIT && after < CS_HC_CATCH){                              // anticipation slowly builds
      const k = Math.min(1, (after-CS_HC_EXIT)/(CS_HC_CATCH-CS_HC_EXIT));
      S.crowdHype = Math.max(S.crowdHype, k*0.55);
    }
    if (before < CS_HC_CATCH && after >= CS_HC_CATCH){                           // BOOM
      SFX.boom(); S.flash = 0.5; S.shake = 6; S.hitstop = 0.06;
      SFX.crowdRoar(1); S.crowdHype = 1; triggerCrowdBurst();
    }
    if (after >= CS_HC_TOTAL){ cs.phase='JUGGLE'; cs.phaseT=0; cs.cycleT=0; cs.routineIdx=1-cs.routineIdx; }
    return;
  }

  if (cs.phase === 'SHOULDERS'){
    if (after >= CS_SH_LIFT){
      const bt = after - CS_SH_LIFT;
      const span = CS_SH_BOUNCES * CS_SH_BOUNCE_PERIOD;
      if (bt < span){
        const beatIdx = Math.floor(bt / CS_SH_BOUNCE_PERIOD);
        if (beatIdx !== cs.beatIdx){ cs.beatIdx = beatIdx; SFX.juggleBop('knee', beatIdx%2===0); S.shake = Math.max(S.shake,0.5); }
      }
    }
    if (after >= CS_SH_TOTAL){ cs.phase='HEAD_BALANCE'; cs.phaseT=0; }
    return;
  }

  if (cs.phase === 'HEAD_BALANCE'){
    if (before < 0.05 && after >= 0.05){
      SFX.tootToot(); SFX.crowdRoar(1); S.crowdHype = 1; triggerCrowdBurst(); spawnConfetti(32);
    }
    if (before < 2.6 && after >= 2.6){ SFX.tootToot(); triggerCrowdBurst(); S.crowdHype = Math.max(S.crowdHype, 0.85); }
    if (after >= CS_HB_TOTAL){ cs.phase='JUGGLE'; cs.phaseT=0; cs.cycleT=0; cs.routineIdx=1-cs.routineIdx; }
    return;
  }
}

/* ── save/load — character, settings, best-ever streak. Best-effort:
   some contexts (private browsing, sandboxed file://) block storage
   entirely, so every call is guarded and failure is silent.       ── */
/* ═══════════════════════════════════════════════════════════
   CAREER — the reason to come back tomorrow.

   Everything above this line is a single session. This is what
   survives it: experience, a level with a title attached to it,
   lifetime counters, badges, and a daily streak that punishes
   you for skipping a day. Cheap to compute, all of it derived
   from a handful of integers so the save stays tiny.
   ═══════════════════════════════════════════════════════════ */
const RANK_TITLES = [
  [1,  'SUNDAY LEAGUE'], [4,  'ACADEMY'],    [8,  'SEMI-PRO'],
  [12, 'PROFESSIONAL'],  [17, 'INTERNATIONAL'], [23, 'WORLD CLASS'],
  [30, 'LEGEND'],        [40, 'ICON']
];
function xpForLevel(n){ return 180 + (n-1)*130; }         // xp needed to clear level n
function levelFromXp(xp){
  let lvl = 1, rem = xp;
  while (lvl < 99 && rem >= xpForLevel(lvl)){ rem -= xpForLevel(lvl); lvl++; }
  return { level: lvl, into: rem, need: xpForLevel(lvl) };
}
function rankTitle(level){
  let title = RANK_TITLES[0][1];
  for (const [min, name] of RANK_TITLES) if (level >= min) title = name;
  return title;
}

function freshProfile(){
  return {
    xp:0, runs:0, matches:0, matchWins:0,
    answered:0, correct:0, bestRank:0, ladderCompletes:0,
    teamsPlayed:[], langsUsed:[],
    dailyStreak:0, dailyBest:0, lastDaily:'', dailyBestRank:0,
    achievements:{},
    wonTeams:[], unlockedCheats:[],    // the cheat vault — see openChest()

/* ── the cheat vault ──────────────────────────────────────────
   Cheats stop being a debug backdoor and become the reward loop:
   take a nation all the way to £1,000,000 honestly and a chest opens
   with one random code in it. Six nations, eight codes — so a full
   sweep of the world still leaves a couple to chase. "Honestly" means
   ku.tainted stayed false — see BLOCKING_CHEATS near beginKeepyups().
   Club Legends runs don't feed this vault; see finishRun().        ── */
function cheatUnlocked(key){
  return S.profile && S.profile.unlockedCheats.indexOf(key) >= 0;
}
/* Returns the cheat won, or null if there was nothing to win. */
function openChest(){
  const p = S.profile;
  if (p.wonTeams.indexOf(S.cat) >= 0) return null;    // already conquered
  p.wonTeams.push(S.cat);
  const locked = CHEATS.filter(c => p.unlockedCheats.indexOf(c.key) < 0);
  if (!locked.length) return null;                     // vault already full
  const pick = locked[Math.floor(Math.random()*locked.length)];
  p.unlockedCheats.push(pick.key);
  return pick;
}

/* ── daily challenge ──────────────────────────────────────────
   The seed is the date itself, so every player in the world gets
   the identical run and can compare without a server.         ── */
function todayKey(d){
  const x = d || new Date();
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
function yesterdayKey(){
  const x = new Date(); x.setDate(x.getDate()-1);
  return todayKey(x);
}
function dailySeed(){
  const k = todayKey();
  let h = 2166136261;
  for (let i=0;i<k.length;i++){ h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h>>>0;
}
function dailyDone(){ return S.profile.lastDaily === todayKey(); }
/* The team for the day is also derived from the date, so the daily
   is a genuinely fixed challenge rather than a player choice. */
function dailyCat(){ return CATS[dailySeed() % CATS.length]; }
function recordDailyResult(rank){
  const p = S.profile, today = todayKey();
  if (p.lastDaily === today) return;
  p.dailyStreak = (p.lastDaily === yesterdayKey()) ? p.dailyStreak + 1 : 1;
  p.dailyBest = Math.max(p.dailyBest, p.dailyStreak);
  p.lastDaily = today;
  p.dailyBestRank = rank;
}
/* A streak the player has already broken should read as broken on
   the title screen, not linger at its old value until they play. */
function effectiveDailyStreak(){
  const p = S.profile;
  if (!p.lastDaily) return 0;
  if (p.lastDaily === todayKey() || p.lastDaily === yesterdayKey()) return p.dailyStreak;
  return 0;
}

/* ── haptics — a tiny but disproportionate chunk of "feel" ──── */
function buzz(ms){
  if (S.reduceMotion) return;
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

/* Micro-feedback: restrained touch rings and score callouts. */
function tapFeedback(x,y,kind='tap'){ if(x<0||y<0)return; S.tapFX={x,y,t:0,kind}; }
function pushFeedback(text,color=C.GOLD2){
  const live=document.getElementById('srStatus'); if(live) live.textContent=text;
  S.feedbackQueue.push({text,color,t:0}); if(S.feedbackQueue.length>3) S.feedbackQueue.shift();
}
function drawTapFX(){
  if(!S.tapFX||S.reduceMotion)return; const f=S.tapFX,t=Math.min(1,f.t/.34),e=1-Math.pow(1-t,3),r=4+e*13;
  b.save(); b.globalAlpha=(1-t)*.72; b.strokeStyle=f.kind==='bad'?C.RED:(f.kind==='good'?C.GOLD2:C.WHITE); b.lineWidth=1;
  b.beginPath(); b.arc(f.x,f.y,r,0,Math.PI*2); b.stroke(); b.globalAlpha=(1-t)*.35; b.fillStyle=f.kind==='bad'?C.RED:C.GOLD; b.fillRect(f.x-1,f.y-1,2,2); b.restore();
}
function drawFeedback(){
  if(!S.feedbackQueue.length)return; S.feedbackQueue=S.feedbackQueue.filter(f=>f.t<.82);
  S.feedbackQueue.forEach((f,i)=>{const t=f.t,k=Math.min(1,t/.18),out=t>.58?(t-.58)/.24:0,y=118-i*14-k*4; b.save(); b.globalAlpha=(1-Math.min(1,out))*.92; b.font='bold 9px ui-monospace, Menlo, Consolas, monospace'; b.textAlign='center'; b.textBaseline='middle'; b.fillStyle='#000b'; b.fillText(f.text,W/2+1,y+2); b.fillStyle=f.color; b.fillText(f.text,W/2,y); b.restore();});
}

const SAVE_KEY = 'kick-off_save_v1';
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      character: S.character,
      audioVolume: S.audioVolume,
      audioMuted: S.audioMuted,
      reduceMotion: S.reduceMotion,
      ladderStyle: S.ladderStyle,
      bestEverRank: S.bestEverRank,
      language: S.language,
      playerName: S.playerName,
      playerNumber: S.playerNumber,
      profile: S.profile,
      defMeta: S.defMeta
    }));
    return true;
  } catch(e){ return false; }
}
function loadGame(){
  S.profile = freshProfile();
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    // merge rather than replace, so a save written by an older build
    // still gains any fields added since without wiping what it had
    if (d.profile && typeof d.profile === 'object'){
      const p = S.profile;
      for (const k in p){
        const v = d.profile[k];
        if (v === undefined || v === null) continue;
        if (Array.isArray(p[k])){ if (Array.isArray(v)) p[k] = v.slice(); }
        else if (typeof p[k] === 'object'){ if (typeof v === 'object') Object.assign(p[k], v); }
        else if (typeof v === typeof p[k]) p[k] = v;
      }
    }
    if (d.character) Object.assign(S.character, d.character);
    if (typeof d.audioVolume === 'number') S.audioVolume = d.audioVolume;
    if (typeof d.audioMuted === 'boolean') S.audioMuted = d.audioMuted;
    if (typeof d.reduceMotion === 'boolean') S.reduceMotion = d.reduceMotion;
    if (d.ladderStyle === 'football' || d.ladderStyle === 'money') S.ladderStyle = d.ladderStyle;
    if (typeof d.bestEverRank === 'number') S.bestEverRank = d.bestEverRank;
    else if (typeof d.bestEverStreak === 'number') S.bestEverRank = Math.min(15, d.bestEverStreak); // migrate old saves
    if (I18N[d.language]) S.language = d.language;
    rebuildMoneyLabels();
    if (typeof d.playerName === 'string') S.playerName = d.playerName;
    if (typeof d.playerNumber === 'number') S.playerNumber = d.playerNumber;
    // saves from before the HOOLIGAN -> DEFENDER rename used the key
    // "hoolMeta" — fall back to it so those players don't lose their tokens/
    // best time/crew progress just because the field got renamed
    const defMetaSrc = d.defMeta || d.hoolMeta;
    if (defMetaSrc && typeof defMetaSrc === 'object'){
      if (typeof defMetaSrc.tokens==='number') S.defMeta.tokens=defMetaSrc.tokens;
      if (typeof defMetaSrc.bestTime==='number') S.defMeta.bestTime=defMetaSrc.bestTime;
      if (typeof defMetaSrc.bestWave==='number') S.defMeta.bestWave=defMetaSrc.bestWave;
      if (typeof defMetaSrc.totalKills==='number') S.defMeta.totalKills=defMetaSrc.totalKills;
      if (typeof defMetaSrc.kickball==='boolean') S.defMeta.kickball=defMetaSrc.kickball;
      if (defMetaSrc.crew){
        // old saves used scarf/drum/flag ids; scarf/drum no longer exist as
        // H_CREW entries (defense/striker replaced them) — map the counts
        // across by nearest-role rather than blindly merging, which would
        // leave stray scarf/drum keys around for beginDefender()'s
        // Object.keys(S.defMeta.crew) loop to crash on (H_CREW['scarf'] is
        // now undefined)
        const legacy = defMetaSrc.crew;
        S.defMeta.crew.defense = (typeof legacy.defense==='number'?legacy.defense:0) + (typeof legacy.scarf==='number'?legacy.scarf:0);
        S.defMeta.crew.striker = (typeof legacy.striker==='number'?legacy.striker:0) + (typeof legacy.drum==='number'?legacy.drum:0);
        S.defMeta.crew.flag = typeof legacy.flag==='number'?legacy.flag:0;
      }
      if (defMetaSrc.perm) Object.assign(S.defMeta.perm,defMetaSrc.perm);
    }
    S.hair = HAIRS[S.character.hairIdx];
    S.skin = SKINS[S.character.skinIdx];
  } catch(e){ /* storage unavailable — start fresh */ }
}

function toBuf(e){
  const rect = cv.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  return [ cx * (FRAME_W/rect.width), cy * (FRAME_H/rect.height) - PAD_TOP ];
}
/* Tap vs. drag-to-scroll, unified in one pointerdown/move/up pipeline.
   A tap only fires on pointerUP, and only if the finger never travelled
   past TAP_MOVE_THRESHOLD from where it went down — NOT on pointerdown.
   (An earlier version called tapAt() straight from pointerdown, which
   meant the very first pixel of ANY scroll gesture was indistinguishable
   from a tap — starting a scroll on the News & Fixtures list would open
   whatever card happened to be under your finger before the drag had a
   chance to register. Never go back to firing taps on pointerdown.)
   Only the career, Club Legends and News & Fixtures screens scroll, so a
   drag anywhere else stays a plain tap-or-nothing and nothing else
   changes. Lifting your finger doesn't kill scroll motion dead — it
   keeps gliding on whatever velocity it had and eases out, same as any
   native scroll view, instead of stopping the instant you let go. */
const TAP_MOVE_THRESHOLD = 10;   // buffer px of travel allowed before a press stops counting as a tap
let tapDownX = null, tapDownY = null, tapMoved = 0;
let dragY = null, dragMoved = 0, dragLastT = 0, scrollVel = 0;
const SCROLLABLE_SCENES = ['PROFILE','CLUBS','HUB'];
// one shared spot each scrollable scene's drag/momentum reads and writes,
// rather than repeating a three-way branch at every call site
function scrollAdd(delta){
  // the dev menu is an overlay (a flag, not a scene) that can sit on top of
  // any scene — check it first so its own scroll always wins while it's open
  if (S.devMenuOpen) S.devMenuScroll += delta;
  else if (S.scene==='PROFILE') S.profileScroll += delta;
  else if (S.scene==='CLUBS') S.clubsScroll += delta;
  else if (S.scene==='HUB'){
    if (S.hub.teamPicker) S.hub.teamPickerScroll += delta;
    else S.hub.scroll += delta;
  }
}
// the article-summary popup is a static card, not a scroll view — dragging
// behind it shouldn't move the list underneath
function hubOverlayBlocksScroll(){ return S.scene==='HUB' && !!S.hub.openItem; }
function scrollGateOpen(){ return (SCROLLABLE_SCENES.includes(S.scene) || S.devMenuOpen) && !S.achDetail && !hubOverlayBlocksScroll(); }
// DEFENDER_RUN's virtual joystick lives entirely inside these three
// listeners, gated on scene===DEFENDER_RUN and the press starting below the
// HUD (y>=52, so the top-left quit / top-right shop buttons always win).
// It never touches tapDownX/tapDownY/tapMoved or the scroll/tap pipeline
// used by every other scene — DEFENDER_INTRO/LEVELUP/SHOP/OVER and all
// non-DEFENDER scenes still go through the exact same tapAt() path as before.
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  // once a press starts, keep receiving its move/up events even if the
  // finger drifts past the canvas's visible edge mid-drag (a real-device
  // touch failure mode desktop mouse testing can't reproduce)
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  const [x,y] = toBuf(e);
  tapDownX = x; tapDownY = y; tapMoved = 0; S.press={x,y,t:0};
  // the settings/pause overlay AND the dev menu both draw on top of
  // DEFENDER_RUN without changing S.scene (they're flags, not scenes), so
  // every DEFENDER-specific branch below must also bow out while either is
  // open — otherwise taps meant for those panels get eaten as joystick/
  // place-mode input instead
  if (S.scene==='DEFENDER_RUN' && S.def && !S.settingsOpen && !S.devMenuOpen){
    if (S.def.placeMode && S.def.placeMode.active){
      // one clear cancel rule: tapping the HUD strip while placing drops
      // the Throw-In back out of place mode, no token spent
      if (y<52){ S.def.placeMode=null; pushFeedback(t('defender_cancelled'),C.GREY); return; }
      const w=defScreenToWorld(x,y); S.def.placeMode.x=w.x; S.def.placeMode.y=w.y; return;
    }
    if (y>=52){ const j=S.def.joystick; j.active=true; j.originX=x; j.originY=y; j.curX=x; j.curY=y; buzz(8); return; }
    return;   // HUD area (y<52): fall through to the plain tap-on-release path below, no drag/scroll setup needed in this mode
  }
  if (scrollGateOpen()){ dragY = y; dragMoved = 0; dragLastT = performance.now(); scrollVel = 0; }
}, {passive:false});
cv.addEventListener('pointermove', e=>{
  if (tapDownX === null) return;
  const [x,y] = toBuf(e);
  tapMoved = Math.max(tapMoved, Math.hypot(x-tapDownX, y-tapDownY));
  if (S.scene==='DEFENDER_RUN' && S.def && !S.settingsOpen && !S.devMenuOpen){
    if (S.def.placeMode && S.def.placeMode.active){ const w=defScreenToWorld(x,y); S.def.placeMode.x=w.x; S.def.placeMode.y=w.y; return; }
    if (S.def.joystick.active){ S.def.joystick.curX=x; S.def.joystick.curY=y; }
    return;
  }
  if (!scrollGateOpen() || dragY===null) return;
  e.preventDefault();
  const now = performance.now(), vdt = Math.max(0.001, (now-dragLastT)/1000);
  const dy = y - dragY; dragMoved += Math.abs(dy); dragY = y; dragLastT = now;
  scrollAdd(-dy);
  // smoothed instantaneous velocity — this is what the release carries forward
  scrollVel = scrollVel*0.72 + (-dy/vdt)*0.28;
}, {passive:false});
cv.addEventListener('pointerup', e=>{
  if (S.scene==='DEFENDER_RUN' && S.def && !S.settingsOpen && !S.devMenuOpen){
    if (S.def.placeMode && S.def.placeMode.active){
      defTryPlaceUnit();
      tapDownX=null; tapDownY=null; dragY=null; S.press=null; return;
    }
    S.def.joystick.active=false;
    if (tapDownY!==null && tapDownY<52 && tapMoved<TAP_MOVE_THRESHOLD){ tapFeedback(tapDownX,tapDownY,'tap'); tapAt(tapDownX,tapDownY); }
    tapDownX=null; tapDownY=null; dragY=null; S.press=null; return;
  }
  if(tapDownX!==null&&tapMoved<TAP_MOVE_THRESHOLD){tapFeedback(tapDownX,tapDownY,'tap');tapAt(tapDownX,tapDownY);}
  tapDownX=null;tapDownY=null;dragY=null;S.press=null;
});
['pointercancel','pointerleave'].forEach(ev =>
  cv.addEventListener(ev, ()=>{ if(S.def) S.def.joystick.active=false; tapDownX=null; tapDownY=null; dragY=null; S.press=null; }));   // scrollVel is left as-is — that's the momentum
cv.addEventListener('wheel', e=>{
  if (!SCROLLABLE_SCENES.includes(S.scene) || hubOverlayBlocksScroll()) return;
  e.preventDefault();
  scrollAdd(e.deltaY*0.5);
}, {passive:false});
document.getElementById('menuBtn').addEventListener('click', e=>{
  e.preventDefault(); e.stopPropagation();
  initAudio();
  S.devPinOpen = false; S.devMenuOpen = false;
  S.settingsOpen = !S.settingsOpen;
  S.settingsConfirmQuit = false;
  if (S.settingsOpen && S.def) S.def.joystick.active = false;
});
document.getElementById('devBtn').addEventListener('click', e=>{
  e.preventDefault(); e.stopPropagation();
  initAudio();
  S.settingsOpen = false; S.settingsConfirmQuit = false;
  if (S.devMenuOpen){ S.devMenuOpen = false; return; }
  if (S.devUnlocked){ S.devMenuOpen = true; if (S.def) S.def.joystick.active = false; return; }
  S.devPinOpen = !S.devPinOpen;
  S.devPin = '';
});
window.addEventListener('keydown', e=>{
  if (e.code==='Escape'){ e.preventDefault(); S.settingsOpen = !S.settingsOpen; S.settingsConfirmQuit = false; if (S.settingsOpen && S.def) S.def.joystick.active = false; return; }
  if (e.code==='Space'||e.code==='Enter'){ e.preventDefault();
    if (S.settingsOpen) return;
    if (S.scene==='QUESTION' && !S.qResolved) return;      // questions need a real choice
    tapAt(-1,-1);
  }
  if (e.code>='Digit1'&&e.code<='Digit4' && S.scene==='QUESTION' && !S.qResolved){
    pickAnswer(+e.code.slice(5)-1);
  }
  if (e.code>='Digit1'&&e.code<='Digit4' && S.scene==='KU_PLAY' && S.ku && !S.ku.qResolved){
    pickKUAnswer(+e.code.slice(5)-1);
  }
}, {passive:false});

/* ═══════════════════════════════════════════════════════════
   DEFENDER MODE — football-skinned survivor loop
   Inspired by the genre's readable, timer-driven horde structure:
   enemies pursue directly, XP gems magnetise, level-ups pause the run,
   and periodic waves escalate without ever letting the live entity count
   become an unreadable wall. The theme, names and balance are original.
   ═══════════════════════════════════════════════════════════ */
const H_MAX_ENEMIES=280, H_MAX_GEMS=420, H_MAX_PROJS=100, H_MAX_FX=90, H_MAX_BALLS=4;
const H_ARENA={x:0,y:50,w:W,h:H-50};
const H_PLAYER={r:7,baseSpeed:48,baseHP:100};
// the run camera zooms in 33% (visible world scaled to 75% linear size) and
// tracks the player, so the world needs to be bigger than the old fixed
// H_ARENA box or the zoomed-in view would show void past its edges. The
// camera position itself is also clamped to H_WORLD (see defUpdateRun),
// so even at the player's own clamp limits nothing outside H_WORLD is drawn.
const H_ZOOM = 4/3;
const H_WORLD = { x0:-60, y0:H_ARENA.y-60, x1:W+60, y1:H+60 };

function defUpdateDefenseUnit(c, dt){

  c.invuln=Math.max(0,(c.invuln||0)-dt);

    const d=Math.hypot(target.x-c.x,target.y-c.y);
